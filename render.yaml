# Render blueprint — one web service, serving the client and the API from one origin.
#
# Create the service from this file, then set DATABASE_URL in the dashboard to the Supabase
# connection string (Connect > Session pooler, the IPv4 one on port 5432). Nothing secret
# belongs in this file.
#
# Region: put the database as close to this as you can. Render has no Australian region, so a
# Supabase project in ap-southeast-2 (Sydney) is a cross-sea hop from Singapore — about 90ms
# each way. Matching them means a Supabase project in ap-southeast-1.
#
# Keep this at ONE instance. The live game is held in the process between settled points, so
# two instances would each believe they own a room. Durability is already handled — the game
# is written to Postgres, and a restart or deploy picks it straight back up.
services:
  - type: web
    name: frigate-online
    runtime: node
    plan: free
    region: singapore        # closest to an ap-southeast-2 (Sydney) database; see the note below
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false          # set in the dashboard, never committed
      - key: NODE_VERSION
        value: "20"
      # Render terminates the connection at its edge, so the address this process sees is the
      # proxy's and every player would share one rate-limit bucket. The forwarded address is
      # only believed where something in front is known to be setting it, so say so here
      # rather than leaving it to be inferred from Render's own environment variables.
      - key: FRIGATE_TRUST_PROXY
        value: "on"
      # Only needed if the page is served from somewhere other than this service. Left unset,
      # the API answers same-origin requests and local addresses, and nobody else.
      # - key: FRIGATE_ORIGIN
      #   value: https://frigate-online.onrender.com
