<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheet Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frigate-sheet/css/style.css">
<link rel="stylesheet" href="../frigate-sheet/css/frigate.css">
<style>
  body { padding: 28px 18px 110px; }
  .builder { max-width: 1200px; margin: 0 auto; }
  .builder-panel { margin-top: 16px; padding: 22px 26px; position: relative; }
  .builder-panel .eyebrow { margin-bottom: 14px; }
  .builder-hidden { display: none !important; }

  /* options grid */
  .opt-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px; margin-top: 4px;
  }
  .opt {
    position: relative; text-align: left; cursor: pointer;
    background: var(--panel-alt); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 16px;
    color: var(--ink); font-family: var(--body); font-size: 13.5px; line-height: 1.45;
    display: flex; flex-direction: column; gap: 8px; min-height: 120px;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  .opt:hover { border-color: var(--cyan); }
  .opt.compact { min-height: 0; padding: 12px 16px; }
  .opt.sel {
    border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber), 0 0 18px rgba(232,169,74,.25);
  }
  .opt.sel::after {
    content: '✓'; position: absolute; top: 8px; right: 10px;
    color: var(--amber); font-family: var(--mono); font-weight: 700; font-size: 16px;
  }
  .opt-title {
    font-family: var(--disp); font-size: 14px; letter-spacing: .04em;
    color: var(--ink); text-transform: uppercase;
  }
  .opt-title-row {
    display: flex; align-items: center; gap: 8px;
  }
  .opt-title-row .ticon { width: 15px; height: 15px; flex: none; }
  .opt-meta {
    display: flex; flex-wrap: wrap; gap: 6px;
    font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
  }
  .opt-meta span { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border: 1px solid var(--line); color: var(--ink-mid); border-radius: 4px; line-height: 1; vertical-align: middle; }
  .opt-meta span.t-cyan { color: var(--cyan); border-color: var(--cyan-dim); }
  .opt-meta span.t-amber { color: var(--amber); border-color: var(--brown-dim); }
  .opt-meta span.t-red { color: var(--red); border-color: var(--red-dim); }
  .opt-meta span.t-skill { color: var(--amber); border-color: var(--brown-dim); background: rgba(232,169,74,.08); }
  .opt-meta span.t-hull { background: rgba(232,169,74,.12); color: var(--amber); border-color: var(--amber); }
  .opt-meta span.t-class-tech { color: var(--icon-charged); border-color: var(--icon-charged); background: rgba(156,63,102,.12); }
  .opt-meta .ticon { width: 11px; height: 11px; flex: none; display: block; }
  /* core options: stacked sections that collapse to a header once passed */
  .opt-grid.opt-flat { display: block; }
  .core-sec { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; }
  .core-sec.open { border-color: var(--cyan-dim); }
  .core-sec-head {
    width: 100%; display: flex; align-items: center; gap: 10px;
    background: transparent; border: 0; padding: 11px 14px; cursor: pointer; text-align: left;
    font-family: var(--disp); font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink);
  }
  .core-sec-head:hover { color: var(--cyan); }
  .core-sec-head .cs-num { font-family: var(--mono); font-size: 11px; color: var(--cyan); }
  .core-sec-head .cs-pick { margin-left: auto; font-family: var(--mono); font-size: 11px; letter-spacing: .05em; text-transform: none; color: var(--amber); }
  .core-sec-head .cs-pick.none { color: var(--ink-mid); }
  .core-sec.open > .core-sec-head { border-bottom: 1px solid var(--line); }
  .core-sec-body { padding: 14px; }
  .opt.classopt:not(.sel) { border-color: var(--icon-charged); background: rgba(156,63,102,.08); }
  .opt.classopt:not(.sel):hover { border-color: var(--icon-charged); }
  .opt.classopt .opt-title { color: var(--icon-charged); }
  .opt.locked-opt { opacity: .55; cursor: default; }
  .grant-line { font-family: var(--mono); font-size: 11px; letter-spacing: .05em; color: var(--ink-mid); }
  .sk-top { grid-column: 1 / -1; display: flex; justify-content: flex-end; margin-bottom: 6px; }
  .recbtn {
    background: var(--panel-alt); border: 1px solid var(--cyan); color: var(--cyan);
    font-family: var(--body); font-size: 12px; padding: 6px 12px; border-radius: 6px; cursor: pointer;
  }
  .recbtn:hover { background: var(--cyan); color: var(--ink-strong); border-color: var(--cyan); }
  .sk-total { grid-column: 1 / -1; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--ink-mid); margin-bottom: 10px; }
  .sk-total b { color: var(--amber); }
  .opt-body {
    color: var(--ink-mid); font-size: 12.5px; white-space: pre-line;
    display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden;
  }
  .opt-body .ticon { width: 15px; height: 15px; vertical-align: -2px; margin-right: 6px; }

  /* filter bar */
  .filter-bar { display: flex; align-items: center; gap: 12px; margin: 14px 0 2px; flex-wrap: wrap; }
  .ff-row { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .ffilter {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 34px; height: 30px; padding: 0 8px;
    border: 1px solid var(--line-bright); border-radius: 6px;
    background: none; color: var(--ink-mid); cursor: pointer; font-size: 13px; line-height: 1;
    transition: border-color .12s ease, color .12s ease, background .12s ease;
  }
  .ffilter .ticon { width: 15px; height: 15px; display: block; }
  .ffilter:hover { border-color: var(--cyan); color: var(--cyan); }
  .ffilter.on { border-color: var(--cyan); color: var(--cyan); background: rgba(79,216,201,.12); }
  .ff-div { width: 1px; height: 20px; background: var(--line); margin: 0 3px; flex: none; }
  .fsearch {
    flex: 1; min-width: 190px;
    background: var(--panel-alt); border: 1px solid var(--line); color: var(--ink);
    font: 500 13px var(--body); padding: 7px 12px; border-radius: 6px;
  }
  .fsearch:focus { outline: none; border-color: var(--cyan); }
  /* inventory bar (multi-picks above the filter bar) */
  .inv-bar {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
    margin: 12px 0 0;
  }
  .invchip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 5px; cursor: pointer;
    background: var(--void); border: 1px solid var(--amber); color: var(--amber);
    font-family: var(--mono); font-size: 11px; letter-spacing: .05em;
  }
  .invchip b { color: var(--amber); }
  .invchip:hover { background: rgba(232,169,74,.12); }
  /* deck building: Create Deck block, draw popup, Current Deck heading */
  .inv-bar.deck-bar { display: block; }
  .sub-head {
    font-family: var(--disp); font-size: 13px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--cyan); margin: 0 0 8px;
  }
  .filter-bar .sub-head { margin-top: 14px; }
  .drawbtn {
    width: 100%; padding: 15px 18px; cursor: pointer; border-radius: 8px;
    background: var(--panel-alt); border: 1px solid var(--cyan); color: var(--cyan);
    font-family: var(--disp); font-size: 15px; letter-spacing: .08em; text-transform: uppercase;
    transition: background .12s ease, color .12s ease;
  }
  .drawbtn:hover:not(:disabled) { background: var(--cyan); color: var(--ink-strong); }
  .drawbtn:disabled { opacity: .4; cursor: default; border-color: var(--line); color: var(--ink-mid); }
  .deck-points { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--ink-mid); margin-top: 8px; }
  .deck-points b { color: var(--amber); }
  .draw-sec { margin-top: 14px; }
  .draw-sec .core-sec-head { cursor: default; }
  .draw-sec .core-sec-head:hover { color: var(--ink); }
  .draw-close { margin-left: auto; background: transparent; border: 0; color: var(--ink-mid); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 2px; }
  .draw-close:hover { color: var(--amber); }
  .deck-count { color: var(--amber); font-family: var(--mono); font-size: 11px; }
  /* expandable option cards */
  .opt-wrap { display: flex; flex-direction: column; }
  .opt-wrap .opt { flex: 1; }
  .opt-chev {
    margin-top: auto; align-self: flex-end; line-height: 1;
    font-family: var(--mono); font-size: 13px; color: var(--ink-dim);
  }
  .opt.sel .opt-chev, .opt.open .opt-chev { color: var(--amber); }
  .opt-panel {
    position: relative; margin-top: 6px; padding: 13px 15px;
    background: var(--void); border: 1px solid var(--line); border-left: 3px solid var(--cyan-dim);
    border-radius: 8px; display: flex; flex-direction: column; gap: 13px;
  }
  .exp-add {
    position: absolute; top: 8px; right: 10px;
    width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
    background: none; border: 1px solid var(--line-bright); color: var(--ink-mid);
    font-family: var(--mono); font-size: 16px; line-height: 1;
  }
  .exp-add:hover { border-color: var(--amber); color: var(--amber); }
  .exp-add.locked, .exp-add:disabled { cursor: not-allowed; opacity: .35; border-color: var(--line-dim); color: var(--line-dim); }
  .exp-add.locked:hover, .exp-add:disabled:hover { border-color: var(--line-dim); color: var(--line-dim); }
  .exp-count {
    position: absolute; top: 8px; right: 42px;
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em; color: var(--amber);
  }
  .exp-item-name {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-family: var(--disp); font-size: 12px; letter-spacing: .04em; color: var(--ink); text-transform: uppercase;
  }
  .exp-tag {
    font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--cyan); border: 1px solid var(--cyan-dim); border-radius: 4px; padding: 2px 7px;
  }
  .exp-item-desc { color: var(--ink-mid); font-size: 12px; line-height: 1.55; white-space: pre-line; }
  .exp-item-desc br + br { display: none; }

  /* progress steps */
  .psteps { display: flex; gap: 10px; align-items: center; margin: 22px 0 6px; flex-wrap: wrap; }
  .pstep {
    font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-dim); border: 1px solid var(--line); border-radius: 20px; padding: 4px 12px;
    background: none; cursor: pointer; line-height: inherit;
  }
  .pstep:hover { border-color: var(--cyan); color: var(--cyan); }
  .pstep.done { color: var(--cyan); border-color: var(--cyan-dim); }
  .pstep.cur { color: var(--ink); border-color: var(--cyan); background: rgba(79,216,201,.08); }

  /* window nav */
  .win-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 26px; gap: 12px; }
  .b-btn {
    font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    background: none; border: 1px solid var(--line-bright); color: var(--ink-mid);
    padding: 9px 18px; border-radius: 6px; cursor: pointer;
    transition: border-color .12s ease, color .12s ease;
  }
  .b-btn:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }
  .b-btn:disabled { opacity: .35; cursor: default; }
  .b-btn.primary {
    background: rgba(79,216,201,.08); border-color: var(--cyan); color: var(--cyan);
  }
  .b-btn.primary:hover:not(:disabled) { background: rgba(79,216,201,.15); }

  /* landing */
  .land-btns { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; }
  .land-btns .b-btn { padding: 14px 22px; font-size: 12px; }
  .hint-text { color: var(--ink-dim); font-size: 12px; margin-top: 18px; line-height: 1.55; }

  /* export screen */
  .exp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-top: 16px; }
  .exp-pick {
    background: var(--panel-alt); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
  }
  .exp-pick .opt-title { font-size: 12px; margin-bottom: 4px; }
  .exp-pick .exp-none { color: var(--ink-dim); font-style: italic; font-size: 12.5px; }
  .exp-field { margin-top: 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .exp-field label { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--ink-mid); text-transform: uppercase; }
  .exp-field input {
    background: var(--panel-alt); border: 1px solid var(--line); color: var(--ink);
    font-size: 13px; font-family: var(--body); padding: 8px 12px; border-radius: 6px; min-width: 240px;
  }
  .exp-field input:focus { outline: none; border-color: var(--cyan); }

  /* skills window */
  .dl-row {
    display: flex; align-items: center; gap: 9px; margin-top: 16px; cursor: pointer; user-select: none;
    grid-column: 1 / -1;
    font-family: var(--disp); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-mid);
  }
  .dl-row input { width: 16px; height: 16px; accent-color: var(--cyan); cursor: pointer; }
  .dl-row:hover { color: var(--cyan); }
  .sk .sk-head.sk-warn .sk-name,
  .sk .sk-head.sk-warn .sk-num { color: var(--red); }
  .sk-warn-desc {
    margin-top: 8px; padding: 8px 10px;
    background: var(--panel); border: 1px solid var(--red-dim); border-left: 3px solid var(--red);
    border-radius: 6px; color: var(--red); font-size: 12px; line-height: 1.4;
  }
  .sk-grid {
    grid-column: 1 / -1;
    display: grid; grid-template-columns: 1fr;
    gap: 12px; margin-top: 4px;
  }
  .sk {
    display: flex; flex-direction: column;
    background: var(--panel-alt); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 14px;
  }
  .sk-head { display: flex; align-items: center; gap: 10px; }
  .sk-name {
    font-family: var(--disp); font-size: 13px; letter-spacing: .04em; text-transform: uppercase;
    min-width: 0; flex: 1 1 auto; white-space: normal; overflow-wrap: break-word;
  }
  .sk-num {
    font-family: var(--mono); font-weight: 700; font-size: 15px; color: var(--cyan);
    width: 34px; text-align: center; flex: none;
  }
  .sk-btns { display: flex; gap: 6px; flex: none; }
  .sbtn {
    width: 30px; height: 30px; border-radius: 6px; cursor: pointer;
    background: none; border: 1px solid var(--line-bright); color: var(--ink-mid);
    font-family: var(--mono); font-size: 15px; line-height: 1;
  }
  .sbtn:hover { border-color: var(--cyan); color: var(--cyan); }
  .sk-pen { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
  .sk-pen label {
    font-family: var(--mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim);
  }
  .sk-pen input {
    width: 52px; background: var(--panel-alt); border: 1px solid var(--line); color: var(--ink);
    font: 600 13px var(--body); padding: 4px 6px; border-radius: 4px;
  }
  .sk-pen input:focus { outline: none; border-color: var(--cyan); }
  .skinfo {
    margin-left: 2px; width: 28px; height: 26px; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid var(--line); border-radius: 5px;
    color: var(--ink-mid); cursor: pointer;
  }
  .skinfo .ticon { width: 14px; height: 14px; }
  .skinfo:hover, .skinfo.on { color: var(--amber); border-color: var(--amber); }
  .sk-desc {
    margin-top: 8px; padding: 8px 10px;
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--amber);
    border-radius: 6px; color: var(--ink-mid); font-size: 12px; line-height: 1.4;
  }

  /* export summary */
  .exp-wide { grid-column: 1 / -1; }
  .exp-skills { display: flex; flex-wrap: wrap; gap: 8px; }
  .exp-skill {
    font-family: var(--mono); font-size: 11px; letter-spacing: .03em;
    color: var(--ink-mid); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px;
  }
</style>
</head>
<body>
<nav class="menu-bar">
  <div class="menu-brand">
    <div class="ship-class-label">Sheet Builder</div>
  </div>
  <div class="menu-actions">
    <button type="button" class="menu-toggle" onclick="window.close()" title="Close the sheet builder"><span class="menu-ico" aria-hidden="true">✕</span><span class="menu-label">Close</span></button>
  </div>
</nav>

<main class="builder">

  <!-- LANDING -->
  <section class="panel builder-panel" id="landing">
    <div class="bl"></div><div class="br"></div>
    <div class="eyebrow"><span class="eb-text">Build a Character</span></div>
    <p style="color:var(--ink-mid);font-size:13.5px;line-height:1.6;margin:8px 0 4px;">
      Run through a few windows to assemble your frigate: pick a hull class, a core option,
      a starting technology and a starting module. Choices are remembered in this browser and can
      be exported to a full frigate sheet JSON.
    </p>
    <div class="land-btns">
      <button type="button" class="b-btn primary" onclick="startNew()">Create new character</button>
      <button type="button" class="b-btn" onclick="loadExisting()">Load existing character</button>
      <button type="button" class="b-btn" id="resumeBtn" onclick="resumeRun()" style="display:none;">Continue run in progress</button>
    </div>
    <div class="hint-text" id="landingHint">No saved choices yet.</div>
  </section>

  <!-- PROGRESS -->
  <div class="psteps" id="psteps"></div>

  <!-- CHOICE WINDOW -->
  <section class="panel builder-panel builder-hidden" id="win">
    <div class="bl"></div><div class="br"></div>
    <div class="eyebrow"><span class="eb-text" id="winTitle">…</span></div>
    <div class="inv-bar" id="invBar"></div>
    <div class="filter-bar" id="filterBar"></div>
    <div class="opt-grid" id="winOptions"></div>
    <div class="win-nav">
      <button type="button" class="b-btn" id="backBtn">← Back</button>
      <button type="button" class="b-btn primary" id="continueBtn">Continue →</button>
    </div>
  </section>

  <!-- EXPORT WINDOW -->
  <section class="panel builder-panel builder-hidden" id="exp">
    <div class="bl"></div><div class="br"></div>
    <div class="eyebrow"><span class="eb-text">Review &amp; Export</span></div>
    <div class="exp-grid" id="expSummary"></div>
    <div class="exp-field">
      <label for="shipName">Ship Name</label>
      <input type="text" id="shipName" maxlength="40" placeholder="e.g. The Inevitable">
    </div>
    <div class="win-nav">
      <button type="button" class="b-btn" id="expBackBtn">← Back</button>
      <button type="button" class="b-btn primary" onclick="exportSheet()">⇩ Export</button>
    </div>
  </section>

</main>

<script src="../frigate-sheet/presets/tech-presets.js"></script>
<script src="../frigate-sheet/presets/mod-presets.js"></script>
<script>
(function () {
  'use strict';

  var BUILDER_KEY = 'frigateBuilderChoices';

  /* hull classes: name only, no stat/skill/tech/mod/trait grants */
  var CLASS_PRESETS = {
    'Controller': { desc: 'Placeholder description for the Controller hull.' },
    'Jump': { desc: 'Placeholder description for the Jump hull.' },
    'Tank': { desc: 'Placeholder description for the Tank hull.' },
    'Striker': { desc: 'Placeholder description for the Striker hull.' }
  };

  /* core options: three sections, each a single pick. grants are [tech name, count] pairs. */
  var WEAPON_OPTIONS = [
    { name: 'Standard', desc: 'Mid range modules that can perform destruction in a variety of ways.', grants: [['Cannon Unit', 5]] },
    { name: 'Close Range', desc: 'Short range guns that pack a punch and provide added defense.', grants: [['P.D. Unit', 5]] }
  ];
  var CLASS_WEAPONS = {
    'Controller': { name: 'Tactician', desc: 'Standard weapons, supplemented with weapons that can mess with enemy ships.', grants: [['Cannon Unit', 4], ['Tract Beam', 1]] },
    'Jump': { name: 'Lightweight', desc: 'Standard weapons, but not so many to slow you down.', grants: [['Cannon Unit', 4], ['Boost', 1]] },
    'Tank': { name: 'Armored', desc: '3 armor units, 2 Point Defense units, 1 Cannon unit, well rounded and tanky.', grants: [['Armor Unit', 3], ['P.D. Unit', 2], ['Cannon Unit', 1]] },
    'Striker': { name: 'Large', desc: 'Standard weapons and close range weapons to ensure you can respond to any situation.', grants: [['Cannon Unit', 4], ['P.D. Unit', 2]] }
  };

  var ENGINE_OPTIONS = [
    { name: 'Standard', desc: 'Basic modules to fly your ship. Nothing fancy.', grants: [['Graviton Unit', 3]] },
    { name: 'Lightweight', desc: 'Less reliable but move flexible.', grants: [['Grav Jet', 2]] }
  ];
  /* only some hulls are offered a third engine box */
  var CLASS_ENGINES = {
    'Jump': { name: 'Heavyweight', desc: 'Less speed individually these engines are ideal for large ships moving quick.', grants: [['Thrust Unit', 3]] },
    'Tank': { name: 'Heavyweight', desc: 'Less speed individually these engines are ideal for large ships moving quick.', grants: [['Thrust Unit', 3]] }
  };

  var GENERATOR_OPTIONS = [
    { name: 'Standard', desc: 'Power extra Techs over time to keep your deck moving.', grants: [['Boost', 1]] }
  ];
  /* only some hulls are offered a second generator box */
  var CLASS_GENERATORS = {
    'Controller': { name: 'Flexible', desc: 'Power larger decks.', grants: [['Dynamo', 1]] },
    'Striker': { name: 'Flexible', desc: 'Power larger decks.', grants: [['Dynamo', 1]] }
  };

  /* a section's boxes are its own options plus, where offered, one granted by the hull class */
  var CORE_SECTIONS = [
    { key: 'weapons', title: 'Weaponary', options: WEAPON_OPTIONS, classOptions: CLASS_WEAPONS },

        c.mod = s.mod || null;

  /* ===== find helpers ===== */

  function skillEffective(name) {

  function skillsTotal() {
    var total = 0;
    for (var i = 0; i < SKILL_NAMES.length; i++) {
      var b = parseInt(choices.skills[SKILL_NAMES[i]].points, 10);
      if (!isNaN(b)) total += b;
    }
    return total;
  }
  function presetFor(invKey, name) {
    if (invKey === 'tech') return findTech(name);
    return findMod(name);
  }
  function hasTrait(invKey, trait) {
    var inv = choices.inv && choices.inv[invKey];
    if (!inv) return false;
    var re = new RegExp('\\b' + trait + '\\b', 'i');
    for (var k in inv) {
      if (inv[k] > 0) {
        var p = presetFor(invKey, k);
        var tr = p && p.traits ? String(p.traits) : '';
        if (re.test(tr)) return true;
      }
    }
    return false;
  }
  function countTraits(trait) {
    var re = new RegExp('\\b' + trait + '\\b', 'i');
    var total = 0;
    ['tech', 'mod'].forEach(function (invKey) {
      var inv = choices.inv && choices.inv[invKey];
      if (!inv) return;
      for (var k in inv) {
        if (inv[k] > 0) {
          var p = presetFor(invKey, k);
          var tr = p && p.traits ? String(p.traits) : '';
          if (re.test(tr)) total += 1;
        }
      }
    });
    return total;
  }
  function storageCost() {
    var inv = choices.inv && choices.inv.tech;
    if (!inv) return 0;
    var total = 0;
    for (var k in inv) {
      if (inv[k] <= 0) continue;
      var t = findTech(k);
      var st = t && t.storage ? parseInt(t.storage, 10) : 0;
      if (isNaN(st) || st < 0) st = 0;
      total += st * inv[k];
    }
    return total;
  }
  function recommendSkills() {
    var sk = {};
    var i, n;
    for (i = 0; i < SKILL_NAMES.length; i++) sk[SKILL_NAMES[i]] = 0;

    var sensCount = countTraits('Sensors');
    var gravJet = !!(choices.inv && choices.inv.tech && (choices.inv.tech['Grav Jet'] || 0) > 0);
    var storage = storageCost();

    sk['Sensors'] = sensCount >= 2 ? 4 : (sensCount === 1 ? 3 : 0);
    sk['Navigation'] = gravJet ? 4 : 0;
    sk['Logistics'] = storage;
    sk['Leadership'] = 0;

    var d;
    if (sensCount === 0) d = 'Sensors';
    else if (countTraits('Piloting') === 0) d = 'Piloting';
    else if (countTraits('Diplomacy') === 0) d = 'Diplomacy';
    else if (storage === 0 && countTraits('Logistics') === 0) d = 'Logistics';
    else d = 'Cyber';

    for (i = 0; i < SKILL_NAMES.length; i++) {
      n = SKILL_NAMES[i];
      sk[n] = Math.max(-1, Math.min(4, sk[n]));
    }
    sk[d] = -1;

    var used = 0;
    for (i = 0; i < SKILL_NAMES.length; i++) used += sk[SKILL_NAMES[i]];
    var remaining = 13 - used;
    var order = ['Science', 'Cyber', 'Engineering'];
    for (i = 0; i < order.length && remaining > 0; i++) {
      var add = Math.min(remaining, 4 - sk[order[i]]);
      if (add > 0) { sk[order[i]] += add; remaining -= add; }
    }

    for (i = 0; i < SKILL_NAMES.length; i++) {
      n = SKILL_NAMES[i];
      if (!choices.skills[n]) choices.skills[n] = { points: '0', penalty: '' };
      choices.skills[n].points = String(sk[n]);
    }
    saveChoices();
  }
function skillsOptions() {
    var out = [];
    var remaining = 13 - skillsTotal();
    out.push('<div class="sk-top"><button type="button" class="recbtn" data-skrec="1" title="Auto-distribute points based on your chosen Traits, Officers, Techs and Modules">Recommend skills</button></div>');

    for (var i = 0; i < SKILL_NAMES.length; i++) {

      var base = parseInt(v.points, 10);
      if (isNaN(base)) base = 0;
      var eff = skillEffective(n);
      var canPlus = remaining > 0 && (choices.disableLimits || base < 4);

      var desc = SKILL_DESC[n] || '';

      out.push(

        '<button type="button" class="sbtn splus" data-d="1" title="Increase ' + esc(n) + '"' + (canPlus ? '' : ' disabled') + '>+</button>' +
        '</span>' +

        '</span>' +
        (desc ? '<button type="button" class="skinfo' + (infoOpen ? ' on' : '') + '" title="' + esc(desc) + '"><svg class="ticon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 11.2v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="7.8" r="1.1" fill="currentColor"/></svg></button>' : '') +
        '</div>' +

        try {
          var json = JSON.parse(e.target.result);
          var loaded = applyLoadedSheet(json);
          if (!loaded) {
            alert('Load failed: no matching cards found in that sheet file.');
            return;
          }

  function applyLoadedSheet(json) {

      c.shipClass = json.shipClass;

    if (json && json.coreOptions && typeof json.coreOptions === 'object') {
      for (var oi = 0; oi < CORE_SECTIONS.length; oi++) {
        var osk = CORE_SECTIONS[oi].key;

          matched = true;
        }
      }
    }
    if (json && json.skills && typeof json.skills === 'object') {
      for (var i = 0; i < SKILL_NAMES.length; i++) {
        var n = SKILL_NAMES[i];
        var sv = json.skills[n];
        if (sv && typeof sv === 'object') {
          c.skills[n].points = (sv.points !== undefined && sv.points !== null) ? String(sv.points) : c.skills[n].points;
          c.skills[n].penalty = (sv.penalty !== undefined && sv.penalty !== null) ? String(sv.penalty) : '';

      var pick = corePick(sec.key);
      html += '<div class="exp-pick exp-wide"><div class="opt-title">' + esc(sec.title) + '</div><div>' +
        (pick ? esc(pick) : '<span class="exp-none">Not chosen</span>') + '</div></div>';
    }
    pickList('Technologies', choices.inv.tech);
    pickList('Modules / Deployables', choices.inv.mod);

    var skPts = [];
    for (var si = 0; si < SKILL_NAMES.length; si++) {
      var n = SKILL_NAMES[si];
      var v = choices.skills[n] || { points: '0', penalty: '' };
      var pen = v.penalty ? ' (' + v.penalty + ')' : '';
      skPts.push(n + ' ' + skillEffective(n) + pen);
    }
    html += '<div class="exp-pick exp-wide"><div class="opt-title">Crew Skills</div><div class="exp-skills">' +
      skPts.map(function (x) { return '<span class="exp-skill">' + esc(x) + '</span>'; }).join('') +
      '</div></div>';
    document.getElementById('expSummary').innerHTML = html;
  }

  function buildSheet() {
    var s = JSON.parse(JSON.stringify(SHEET_DEFAULTS));
    s.shipName = choices.shipName || '';
    s.shipClass = choices.shipClass || 'Unclassified';
    s.coreOptions = {};
    for (var ck = 0; ck < CORE_SECTIONS.length; ck++) {
      s.coreOptions[CORE_SECTIONS[ck].key] = corePick(CORE_SECTIONS[ck].key) || '';
    }
    var skills = {};
    for (var si = 0; si < SKILL_NAMES.length; si++) {
      var sn = SKILL_NAMES[si];
      var cv = choices.skills[sn] || {};
      skills[sn] = {
        points: (cv.points !== undefined && cv.points !== null) ? String(cv.points) : SHEET_DEFAULTS.skills[sn],
        penalty: cv.penalty || ''
      };
    }
    s.skills = skills;

    s.crew = [];

    s.tech = [];
    var techCounts = deckCounts();
    for (var tn in techCounts) {
      var tech = findTech(tn);
      if (!tech) continue;
      for (var tk = 0; tk < techCounts[tn]; tk++) {
        s.tech.push({
          name: tech.name,
          traits: tech.traits || '',
          onbuild: tech.onbuild || '',
          passive: tech.passive || '',
          onactivate: tech.onactivate || '',
          techType: tech.tt || 'offense',
          storage: tech.storage || '0',
          hull: '',
          charges: tech.charges || '',
          deploy: deployKey(tech.deploy),
          state: 'deck'
        });
      }
    }

    s.mods = [];
    for (var mn in choices.inv.mod) {
      var mod = findMod(mn);
      if (!mod) continue;
      for (var mk = 0; mk < choices.inv.mod[mn]; mk++) {
        s.mods.push({
          name: mod.name,
          req: mod.req || '',
          hull: mod.hull || '',
          duration: mod.duration || '',
          speed: mod.speed || '',
          charges: mod.charges || '',
          onbuild: mod.onbuild || '',
          passive: mod.passive || '',
          onactivate: mod.onactivate || '',
          type: mod.type || 'module',
          tt: mod.tt || 'offense',
          shape: '',
          exhaust: false
        });
      }
    }
    return s;
  }

  function deployKey(d) {
    if (d === 'module') return 'module';
    if (d === true || d === 'true' || d === 1 || d === '1') return 'deployable';
    if (d === 'deployable' || d === 2 || d === '2') return 'deployable';
    return 'normal';
  }

  function exportSheet() {
    var data = buildSheet();
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var name = (data.shipName || 'frigate-sheet').replace(/[^a-z0-9_-]+/gi, '_').replace(/^_+|_+$/g, '') || 'frigate-sheet';
    a.href = url;
    a.download = name + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* expose export for the inline onclick */
  window.exportSheet = exportSheet;
  window.buildSheet = buildSheet;

  /* ===== init ===== */
  choices = loadChoices();
  document.getElementById('shipName').value = choices.shipName;
  window.startNew = function () { startNew(); };
  window.loadExisting = function () { loadExisting(); };
  window.resumeRun = function () { resumeRun(); };
  window.goStep = goStep;
  show('landing');
  renderProgressDots();
})();
</script>
</body>
</html>
