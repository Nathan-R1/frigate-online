<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheet Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frigate-sheet/css/style.css">
<link rel="stylesheet" href="../frigate-sheet/css/frigate.css">
<style>
  body { padding: 28px 18px 110px; }
  .builder { max-width: 1200px; margin: 0 auto; }
  .builder-panel { margin-top: 16px; padding: 22px 26px; position: relative; }
  /* the step heading carries the instructions, so it reads as a heading, not an eyebrow */
  .builder-panel .eyebrow {
    font-family: var(--disp); font-size: 20px; letter-spacing: .05em;
    line-height: 1.25; margin-bottom: 8px;
  }
  .builder-panel .eyebrow::before { font-size: 16px; }
  /* frigate.css hides eyebrow text under 320px; the builder needs its title there */
  @media (max-width: 320px) {
    .builder-panel .eyebrow { font-size: 16px; }
    .builder-panel .eyebrow .eb-text { display: inline; }
  }
  .builder-hidden { display: none !important; }

  /* options grid */
  .opt-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px; margin-top: 4px;
  }
  .opt {
    position: relative; text-align: left; cursor: pointer;
    background: var(--panel-alt); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 16px;
    color: var(--ink); font-family: var(--body); font-size: 13.5px; line-height: 1.45;
    display: flex; flex-direction: column; gap: 8px; min-height: 120px;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  .opt:hover { border-color: var(--cyan); }
  .opt.compact { min-height: 0; padding: 12px 16px; }
  .opt.sel {
    border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber), 0 0 18px rgba(232,169,74,.25);
  }
  .opt.sel::after {
    content: '✓'; position: absolute; top: 8px; right: 10px;
    color: var(--amber); font-family: var(--mono); font-weight: 700; font-size: 16px;
  }
  .opt-title {
    font-family: var(--disp); font-size: 14px; letter-spacing: .04em;
    color: var(--ink); text-transform: uppercase;
  }
  .opt-title-row {
    display: flex; align-items: center; gap: 8px;
  }
  .opt-count {
    margin-left: auto; flex: none;
    padding: 2px 7px; border: 1px solid var(--brown-dim); border-radius: 4px;
    background: rgba(232,169,74,.08); color: var(--amber);
    font-family: var(--mono); font-size: 10px; letter-spacing: .08em; line-height: 1;
  }
  /* how many copies sit in the deck — a stack count, deliberately unlike the cost pips:
     pilled and card-coloured, where costs are bare icons in the top-left */
  .opt-count.copies {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 20px;
    border-color: var(--icon-card); background: rgba(154,167,255,.12); color: var(--icon-card);
  }
  .opt-count.copies .ticon { width: 12px; height: 12px; flex: none; }
  /* the card's border colour is its rarity, so the title names it outright */
  .rar-tag {
    flex: none; display: inline-flex; align-items: center;
    line-height: 1; color: var(--ink-dim);
  }
  .rar-ico { width: 18px; height: 14px; display: block; flex: none; }
  .rchip .rar-ico { width: 17px; height: 13px; }
  .rar-tag-uncommon { color: var(--icon-hull); }
  .rar-tag-rare { color: var(--amber); }
  .opt-title-row .ticon { width: 15px; height: 15px; flex: none; }
  /* the hull silhouette leads its card, and takes the card's accent when ticked */
  .hull-ico { width: 48px; height: 61px; flex: none; display: block; color: var(--icon-cyan); }
  .opt.sel .hull-ico { color: var(--amber); }
  /* storage / capacity cost, parked in the card's bottom-left opposite the chevron */
  .opt-cost {
    position: absolute; left: 16px; bottom: 10px;
    display: inline-flex; align-items: center; gap: 9px; flex: none;
  }
  .opt-cost .cost {
    display: inline-flex; align-items: center; gap: 3px;
    font-family: var(--mono); font-size: 13px; font-weight: 700; line-height: 1;
  }
  .opt-cost .cost-st { color: var(--icon-logistics); }
  .opt-cost .cost-ld { color: var(--icon-leader); }
  .opt-title-row .opt-cost .ticon { width: 19px; height: 19px; }
  /* tech cards keep a footer strip clear: costs pinned bottom-left, chevron bottom-right */
  .opt[data-okey="tech"], .opt[data-okey="draw"] { padding-bottom: 36px; }
  .opt[data-okey="tech"] .opt-chev, .opt[data-okey="draw"] .opt-chev {
    position: absolute; right: 14px; bottom: 11px; margin: 0;
  }
  .opt-meta {
    display: flex; flex-wrap: wrap; gap: 6px;
    font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
  }
  .opt-meta span { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border: 1px solid var(--line); color: var(--ink-mid); border-radius: 4px; line-height: 1; vertical-align: middle; }
  .opt-meta span.t-cyan { color: var(--cyan); border-color: var(--cyan-dim); }
  .opt-meta span.t-amber { color: var(--amber); border-color: var(--brown-dim); }
  .opt-meta span.t-red { color: var(--red); border-color: var(--red-dim); }
  .opt-meta span.t-skill { color: var(--amber); border-color: var(--brown-dim); background: rgba(232,169,74,.08); }
  .opt-meta span.t-hull { background: rgba(232,169,74,.12); color: var(--amber); border-color: var(--amber); }
  .opt-meta span.t-class-tech { color: var(--icon-charged); border-color: var(--icon-charged); background: rgba(156,63,102,.12); }
  .opt-meta .ticon { width: 11px; height: 11px; flex: none; display: block; }
  /* core options: stacked sections that collapse to a header once passed */
  .opt-grid.opt-flat { display: block; }
  .core-sec { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; }
  .core-sec.open { border-color: var(--cyan-dim); }
  .core-sec-head {
    width: 100%; display: flex; align-items: center; gap: 10px;
    background: transparent; border: 0; padding: 11px 14px; cursor: pointer; text-align: left;
    font-family: var(--disp); font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink);
  }
  .core-sec-head:hover { color: var(--cyan); }
  .core-sec-head .cs-num { font-family: var(--mono); font-size: 11px; color: var(--cyan); }
  .core-sec-head .cs-pick { margin-left: auto; font-family: var(--mono); font-size: 11px; letter-spacing: .05em; text-transform: none; color: var(--amber); }
  .core-sec-head .cs-pick.none { color: var(--ink-mid); }
  .core-sec.open > .core-sec-head { border-bottom: 1px solid var(--line); }
  .core-sec-body { padding: 14px; }
  .opt.rar-uncommon:not(.sel) { border-color: var(--icon-hull); background: rgba(127,216,138,.07); }
  .opt.rar-uncommon:not(.sel):hover { border-color: var(--icon-hull); }
  .opt.rar-uncommon .opt-title { color: var(--icon-hull); }
  .opt.rar-rare:not(.sel) { border-color: var(--amber); background: rgba(232,169,74,.08); }
  .opt.rar-rare:not(.sel):hover { border-color: var(--amber); }
  .opt.rar-rare .opt-title { color: var(--amber); }
  .opt.classopt:not(.sel) { border-color: var(--icon-charged); background: rgba(156,63,102,.08); }
  .opt.classopt:not(.sel):hover { border-color: var(--icon-charged); }
  .opt.classopt .opt-title { color: var(--icon-charged); }
  .opt.locked-opt { opacity: .55; cursor: default; }
  .rchip { display: inline-flex; align-items: center; line-height: 1; }
  .rchip-common { color: var(--ink-mid); }
  .rchip-uncommon { color: var(--icon-hull); }
  .rchip-rare { color: var(--amber); }
  .grant-line { font-family: var(--mono); font-size: 11px; letter-spacing: .05em; color: var(--ink-mid); }
  .sk-top { grid-column: 1 / -1; display: flex; justify-content: flex-end; margin-bottom: 6px; }
  .recbtn {
    background: var(--panel-alt); border: 1px solid var(--cyan); color: var(--cyan);
    font-family: var(--body); font-size: 12px; padding: 6px 12px; border-radius: 6px; cursor: pointer;
  }
  .recbtn:hover { background: var(--cyan); color: var(--ink-strong); border-color: var(--cyan); }
  .sk-total { grid-column: 1 / -1; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--ink-mid); margin-bottom: 10px; }
  .sk-total b { color: var(--amber); }
  .opt-body {
    color: var(--ink-mid); font-size: 12.5px; white-space: pre-line;
    display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden;
  }
  .opt-body .ticon { width: 15px; height: 15px; vertical-align: -2px; margin-right: 6px; }

  /* filter bar */
  .filter-bar { display: flex; align-items: center; gap: 12px; margin: 14px 0 2px; flex-wrap: wrap; }
  .ff-row { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .ffilter {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 34px; height: 30px; padding: 0 8px;
    border: 1px solid var(--line-bright); border-radius: 6px;
    background: none; color: var(--ink-mid); cursor: pointer; font-size: 13px; line-height: 1;
    transition: border-color .12s ease, color .12s ease, background .12s ease;
  }
  .ffilter .ticon { width: 15px; height: 15px; display: block; }
  .ffilter:hover { border-color: var(--cyan); color: var(--cyan); }
  .ffilter.on { border-color: var(--cyan); color: var(--cyan); background: rgba(79,216,201,.12); }
  .ff-div { width: 1px; height: 20px; background: var(--line); margin: 0 3px; flex: none; }
  .fsearch {
    flex: 1; min-width: 190px;
    background: var(--panel-alt); border: 1px solid var(--line); color: var(--ink);
    font: 500 13px var(--body); padding: 7px 12px; border-radius: 6px;
  }
  .fsearch:focus { outline: none; border-color: var(--cyan); }
  /* inventory bar (multi-picks above the filter bar) */
  .inv-bar {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
    margin: 12px 0 0;
  }
  .invchip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 5px; cursor: pointer;
    background: var(--void); border: 1px solid var(--amber); color: var(--amber);
    font-family: var(--mono); font-size: 11px; letter-spacing: .05em;
  }
  .invchip b { color: var(--amber); }
  .invchip:hover { background: rgba(232,169,74,.12); }
  /* deck building: Create Deck block, draw popup, Current Deck heading */
  .inv-bar.deck-bar { display: block; }
  .sub-head {
    font-family: var(--disp); font-size: 13px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--cyan); margin: 0 0 8px;
  }
  .filter-bar .sub-head { margin-top: 14px; }
  .drawbtn {
    width: 100%; padding: 15px 18px; cursor: pointer; border-radius: 8px;
    background: var(--panel-alt); border: 1px solid var(--cyan); color: var(--cyan);
    font-family: var(--disp); font-size: 15px; letter-spacing: .08em; text-transform: uppercase;
    transition: background .12s ease, color .12s ease;
  }
  .drawbtn:hover:not(:disabled) { background: var(--cyan); color: var(--ink-strong); }
  .drawbtn:disabled { opacity: .4; cursor: default; border-color: var(--line); color: var(--ink-mid); }
  .lvl-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .lvl-label {
    font-family: var(--disp); font-size: 26px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--ink);
  }
  .lvl-num {
    font-family: var(--disp); font-size: 26px; color: var(--amber); min-width: 1.4em; text-align: center;
  }
  .lvlbtn {
    width: 36px; height: 36px; border-radius: 6px; cursor: pointer;
    background: var(--panel-alt); border: 1px solid var(--cyan); color: var(--cyan);
    font-family: var(--mono); font-size: 20px; line-height: 1;
  }
  .lvlbtn:hover:not(:disabled) { background: var(--cyan); color: var(--ink-strong); }
  .lvlbtn:disabled { opacity: .3; cursor: default; border-color: var(--line); color: var(--ink-mid); }
  .deck-points { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--ink-mid); margin-top: 8px; }
  .deck-points b { color: var(--amber); }
  /* the draw budget belongs to the draw button, so they share one framed block */
  .draw-block {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 14px; border: 1px solid var(--cyan-dim); border-radius: 10px;
    background: rgba(79,216,201,.05);
  }
  .draw-block .drawbtn { width: auto; flex: 1 1 200px; }
  .draw-block.spent { border-color: var(--line); background: none; }
  .draw-count { display: flex; align-items: center; gap: 9px; flex: none; color: var(--amber); }
  .draw-count .ticon { width: 22px; height: 22px; flex: none; }
  .draw-num { font-family: var(--disp); font-size: 30px; line-height: 1; color: var(--amber); }
  .draw-word {
    font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-mid); max-width: 6em; line-height: 1.3;
  }
  .draw-block.spent .draw-count, .draw-block.spent .draw-num { color: var(--ink-dim); }
  .draw-sec { margin-top: 14px; }
  .draw-sec .core-sec-head { cursor: default; }
  .draw-sec .core-sec-head:hover { color: var(--ink); }
  .rerollbtn {
    width: 100%; margin-top: 12px; padding: 11px 16px; cursor: pointer; border-radius: 6px;
    background: rgba(232,169,74,.1); border: 1px solid var(--amber); color: var(--amber);
    font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  }
  .rerollbtn:hover { background: var(--amber); color: var(--ink-strong); }
  .draw-close { margin-left: auto; background: transparent; border: 0; color: var(--ink-mid); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 2px; }
  .draw-close:hover { color: var(--amber); }
  .deck-count { color: var(--amber); font-family: var(--mono); font-size: 11px; }
  /* expandable option cards */
  .opt-wrap { display: flex; flex-direction: column; position: relative; }
  .tick-x {
    position: absolute; right: 8px; bottom: 8px; z-index: 2;
    width: 20px; height: 20px; padding: 0; border-radius: 4px; cursor: pointer;
    background: rgba(176,58,58,.12); border: 1px solid var(--red); color: var(--red);
    font-family: var(--mono); font-size: 11px; line-height: 1;
  }
  .tick-x:hover { background: var(--red); color: var(--ink-strong); }
  .opt-wrap .opt { flex: 1; }
  .opt-chev {
    margin-top: auto; align-self: flex-end; line-height: 1;
    font-family: var(--mono); font-size: 13px; color: var(--ink-dim);
  }
  .opt.sel .opt-chev, .opt.open .opt-chev { color: var(--amber); }
  .opt-panel {
    position: relative; margin-top: 6px; padding: 13px 15px;
    background: var(--void); border: 1px solid var(--line); border-left: 3px solid var(--cyan-dim);
    border-radius: 8px; display: flex; flex-direction: column; gap: 13px;
  }
  .exp-add {
    position: absolute; top: 8px; right: 10px;
    width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
    background: none; border: 1px solid var(--line-bright); color: var(--ink-mid);
    font-family: var(--mono); font-size: 16px; line-height: 1;
  }
  .exp-add:hover { border-color: var(--amber); color: var(--amber); }
  .exp-add.locked, .exp-add:disabled { cursor: not-allowed; opacity: .35; border-color: var(--line-dim); color: var(--line-dim); }
  .exp-add.locked:hover, .exp-add:disabled:hover { border-color: var(--line-dim); color: var(--line-dim); }
  .exp-del {
    position: absolute; top: 8px; right: 10px;
    width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
    background: rgba(176,58,58,.12); border: 1px solid var(--red); color: var(--red);
    font-family: var(--mono); font-size: 13px; line-height: 1;
  }
  .exp-del:hover { background: var(--red); color: var(--ink-strong); }
  .exp-count {
    position: absolute; top: 8px; right: 42px;
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em; color: var(--amber);
  }
  /* the inline info pip that opens a module's own text from a tech card */
  .mod-info {
    display: inline-flex; align-items: center; justify-content: center; vertical-align: -3px;
    width: 16px; height: 16px; margin-left: 5px; padding: 0; border: 0; border-radius: 50%;
    background: none; color: var(--cyan); cursor: pointer; line-height: 1;
  }
  .mod-info .ticon { width: 15px; height: 15px; display: block; }
  .mod-info:hover { color: var(--amber); }

  /* module / deployable detail popup */
  .mp-back {
    position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
    padding: 20px; background: rgba(0,0,0,.6);
  }
  .mp-box {
    position: relative; width: min(460px, 100%); max-height: 80vh; overflow-y: auto;
    background: var(--panel-alt); border: 1px solid var(--line); border-left: 3px solid var(--cyan-dim);
    border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px;
  }
  .mp-close {
    position: absolute; top: 10px; right: 12px;
    width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
    background: none; border: 1px solid var(--line-bright); color: var(--ink-mid);
    font-family: var(--mono); font-size: 12px; line-height: 1;
  }
  .mp-close:hover { border-color: var(--amber); color: var(--amber); }
  .mp-head { display: flex; align-items: center; gap: 8px; padding-right: 34px; }
  .mp-lead .ticon { width: 18px; height: 18px; display: block; }
  .mp-name {
    font-family: var(--disp); font-size: 14px; letter-spacing: .04em; color: var(--ink); text-transform: uppercase;
  }
  .mp-desc { color: var(--ink-mid); font-size: 12.5px; line-height: 1.55; white-space: pre-line; }

  .exp-item .opt-meta { margin-bottom: 8px; }
  .exp-item-name {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-family: var(--disp); font-size: 12px; letter-spacing: .04em; color: var(--ink); text-transform: uppercase;
  }
  .exp-tag {
    font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--cyan); border: 1px solid var(--cyan-dim); border-radius: 4px; padding: 2px 7px;
  }
  .exp-item-desc { color: var(--ink-mid); font-size: 12px; line-height: 1.55; white-space: pre-line; }
  .exp-item-desc br + br { display: none; }

  /* progress steps */
  .psteps { display: flex; gap: 10px; align-items: center; margin: 22px 0 6px; flex-wrap: wrap; }
  .pstep {
    font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-dim); border: 1px solid var(--line); border-radius: 20px; padding: 4px 12px;
    background: none; cursor: pointer; line-height: inherit;
  }
  .pstep:hover { border-color: var(--cyan); color: var(--cyan); }
  .pstep.done { color: var(--cyan); border-color: var(--cyan-dim); }
  .pstep.cur { color: var(--ink); border-color: var(--cyan); background: rgba(79,216,201,.08); }
  /* a locked step is one the run is not allowed to jump to yet */
  .pstep.locked { opacity: .38; cursor: not-allowed; }
  .pstep.locked:hover { border-color: var(--line); color: var(--ink-dim); }
  .pstep.locked.done:hover { color: var(--cyan); border-color: var(--cyan-dim); }

  /* window nav */
  .win-nav { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 18px; gap: 12px; }
  .b-btn {
    font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    background: none; border: 1px solid var(--line-bright); color: var(--ink-mid);
    padding: 9px 18px; border-radius: 6px; cursor: pointer;
    transition: border-color .12s ease, color .12s ease;
  }
  .b-btn:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }
  .b-btn:disabled { opacity: .35; cursor: default; }
  .b-btn.primary {
    background: rgba(79,216,201,.08); border-color: var(--cyan); color: var(--cyan);
  }
  .b-btn.primary:hover:not(:disabled) { background: rgba(79,216,201,.15); }
  .b-btn.primary.ready {
    background: rgba(232,169,74,.12); border-color: var(--amber); color: var(--amber);
    box-shadow: 0 0 0 1px var(--amber), 0 0 16px rgba(232,169,74,.3);
  }
  .b-btn.primary.ready:hover:not(:disabled) { background: var(--amber); color: var(--ink-strong); }

  /* landing */
  .land-btns { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; }
  .land-btns .b-btn { padding: 14px 22px; font-size: 12px; }
  .hint-text { color: var(--ink-dim); font-size: 12px; margin-top: 18px; line-height: 1.55; }

  /* export screen */
  .exp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-top: 16px; }
  .exp-pick {
    background: var(--panel-alt); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
  }
  .exp-pick .opt-title { font-size: 12px; margin-bottom: 4px; }
  .exp-pick .exp-none { color: var(--ink-dim); font-style: italic; font-size: 12.5px; }
  .exp-field { margin-top: 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .exp-field label { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--ink-mid); text-transform: uppercase; }
  .exp-field input {
    background: var(--panel-alt); border: 1px solid var(--line); color: var(--ink);
    font-size: 13px; font-family: var(--body); padding: 8px 12px; border-radius: 6px; min-width: 240px;
  }
  .exp-field input:focus { outline: none; border-color: var(--cyan); }

  /* skills window */
  .dl-row {
    display: flex; align-items: center; gap: 9px; margin-top: 16px; cursor: pointer; user-select: none;
    grid-column: 1 / -1;

  .land-opts { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 16px; }
  .win-sub { color: var(--ink-mid); font-size: 15px; line-height: 1.6; margin: 0 0 18px; }
  .dl-row:hover { color: var(--cyan); }
  .sk .sk-head.sk-warn .sk-name,

  .sk-warn-desc {
    margin-top: 8px; padding: 8px 10px;

    border-radius: 6px; color: var(--red); font-size: 12px; line-height: 1.4;

  .sk-grid {
    grid-column: 1 / -1;
    display: grid; grid-template-columns: 1fr;

  }
  .sk {
    display: flex; flex-direction: column;
    background: var(--panel-alt); border: 1px solid var(--line);

  .sk-head { display: flex; align-items: center; gap: 10px; }
  .sk-name {
    font-family: var(--disp); font-size: 13px; letter-spacing: .04em; text-transform: uppercase;

  }
  .sk-num {
    font-family: var(--mono); font-weight: 700; font-size: 15px; color: var(--cyan);

  .sk-btns { display: flex; gap: 6px; flex: none; }
  .sbtn {
    width: 30px; height: 30px; border-radius: 6px; cursor: pointer;

  .sbtn:hover { border-color: var(--cyan); color: var(--cyan); }
  .sk-pen { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
  .sk-pen label {
    font-family: var(--mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim);
  }
  .sk-pen input {

  .sk-pen input:focus { outline: none; border-color: var(--cyan); }
  .skinfo {

  }
  .skinfo .ticon { width: 14px; height: 14px; }
  .skinfo:hover, .skinfo.on { color: var(--amber); border-color: var(--amber); }
  .sk-desc {
    margin-top: 8px; padding: 8px 10px;
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--amber);
    border-radius: 6px; color: var(--ink-mid); font-size: 12px; line-height: 1.4;

  /* export summary */
  .exp-wide { grid-column: 1 / -1; }
  .exp-skills { display: flex; flex-wrap: wrap; gap: 8px; }
  .exp-skill {
    font-family: var(--mono); font-size: 11px; letter-spacing: .03em;

</style>

<body>
<nav class="menu-bar">
  <div class="menu-brand">
    <div class="ship-class-label">Sheet Builder</div>
  </div>
  <div class="menu-actions">
    <button type="button" class="menu-toggle" onclick="window.close()" title="Close the sheet builder"><span class="menu-ico" aria-hidden="true">✕</span><span class="menu-label">Close</span></button>
  </div>
</nav>

<main class="builder">

  <!-- LANDING -->
  <section class="panel builder-panel" id="landing">
    <div class="bl"></div><div class="br"></div>
    <div class="eyebrow"><span class="eb-text">Build a Character</span></div>
    <p style="color:var(--ink-mid);font-size:13.5px;line-height:1.6;margin:8px 0 4px;">
      Run through a few windows to assemble your frigate: pick a hull class, a core option,
      a starting technology and a starting module. Choices are remembered in this browser and can
      be exported to a full frigate sheet JSON.
    </p>
    <div class="land-btns">
      <button type="button" class="b-btn primary" onclick="startNew()">Create new character</button>
      <button type="button" class="b-btn" onclick="loadExisting()">Load existing character</button>
      <button type="button" class="b-btn" id="resumeBtn" onclick="resumeRun()" style="display:none;">Continue run in progress</button>
    </div>
    <div class="land-opts">
      <label class="dl-row"><input type="checkbox" id="statBlocksBox"> Customise stat-blocks</label>
      <label class="dl-row"><input type="checkbox" id="limitsBox"> Disable limits</label>
      <label class="dl-row"><input type="checkbox" id="showAllDrawBox"> Show all on card draw</label>
    </div>
    <div class="hint-text" id="landingHint">No saved choices yet.</div>
  </section>

  <!-- PROGRESS -->
  <div class="psteps" id="psteps"></div>

  <!-- CHOICE WINDOW -->
  <section class="panel builder-panel builder-hidden" id="win">
    <div class="bl"></div><div class="br"></div>
    <div class="eyebrow"><span class="eb-text" id="winTitle">…</span></div>
    <div class="win-sub" id="winSub"></div>
    <div class="win-nav">
      <button type="button" class="b-btn" id="backBtn">← Back</button>
      <button type="button" class="b-btn primary" id="continueBtn">Continue →</button>
    </div>
    <div class="inv-bar" id="invBar"></div>
    <div class="filter-bar" id="filterBar"></div>
    <div class="opt-grid" id="winOptions"></div>
  </section>

  <!-- EXPORT WINDOW -->
  <section class="panel builder-panel builder-hidden" id="exp">
    <div class="bl"></div><div class="br"></div>
    <div class="eyebrow"><span class="eb-text">Review &amp; Export</span></div>
    <div class="win-nav">
      <button type="button" class="b-btn" id="expBackBtn">← Back</button>
      <button type="button" class="b-btn primary ready" onclick="exportSheet()">⇩ Export</button>
    </div>
    <div class="exp-grid" id="expSummary"></div>
    <div class="exp-field">
      <label for="shipName">Ship Name</label>
      <input type="text" id="shipName" maxlength="40" placeholder="e.g. The Inevitable">
    </div>
  </section>

  <!-- MODULE / DEPLOYABLE DETAIL POPUP -->
  <div class="mp-back builder-hidden" id="modPop">
    <div class="mp-box" role="dialog" aria-modal="true" aria-labelledby="modPopName">
      <button type="button" class="mp-close" id="modPopClose" title="Close">&#10005;</button>
      <div class="mp-head"><span class="mp-lead" id="modPopLead"></span><span class="mp-name" id="modPopName"></span></div>
      <div class="opt-meta" id="modPopMeta"></div>
      <div class="mp-desc" id="modPopDesc"></div>
    </div>
  </div>

</main>

<script src="../frigate-sheet/presets/skill-descriptions.js"></script>
<script src="../frigate-sheet/presets/tech-presets.js"></script>
<script src="../frigate-sheet/presets/mod-presets.js"></script>
<script>
(function () {
  'use strict';

  var BUILDER_KEY = 'frigateBuilderChoices';

  /* hull classes: name only, no stat/skill/tech/mod/trait grants */
  /* key order is the hull order everywhere: the step 1 cards, the draw slots, and the
     class grouping a draw offer is sorted into */
  var CLASS_PRESETS = {
    'Striker': { desc: 'Guns and more guns, destroy everything with offensive decks.' },
    'Tank': { desc: 'Strength and durability allow this defensive deck to dominate.' },
    'Jump': { desc: 'Speed and rule-defying actions define this movement focused deck.' },
    'Controller': { desc: 'Science focused decks to manipulate the map and your enemies.' }
  };

  /* core options: three sections, each a single pick. grants are [tech name, count] pairs. */
  var WEAPON_OPTIONS = [
    { name: 'Standard', desc: 'Mid range modules that can perform destruction in a variety of ways.', grants: [['Cannon Unit', 4]] }
  ];
  var CLASS_WEAPONS = {
    'Controller': { name: 'Tactician', desc: 'Standard weapons, supplemented with weapons that can mess with enemy ships.', grants: [['Cannon Unit', 3], ['Tract Beam', 1]] },
    'Jump': { name: 'Lightweight', desc: 'Standard weapons, but not so many to slow you down.', grants: [['Cannon Unit', 3], ['Boost', 1]] },
    'Tank': { name: 'Armored', desc: '3 armor units, 1 Point Defense unit, 1 Cannon unit, well rounded and tanky.', grants: [['Armor Unit', 3], ['P.D. Unit', 1], ['Cannon Unit', 1]] },
    'Striker': { name: 'Close Range', desc: 'Short range guns that pack a punch and provide added defense.', grants: [['P.D. Unit', 4]] }
  };

  var ENGINE_OPTIONS = [
    { name: 'Standard', desc: 'Basic modules to fly your ship. Nothing fancy.', grants: [['Graviton Unit', 3]] }
  ];
  /* only some hulls are offered extra engine boxes, and a hull may unlock more than one */
  var HEAVY_ENGINE = { name: 'Heavyweight', desc: 'Less speed individually these engines are ideal for large ships moving quick.', grants: [['Thrust Unit', 3]] };
  var LIGHT_ENGINE = { name: 'Lightweight', desc: 'Less reliable but move flexible.', grants: [['Grav Jet', 2]] };
  var CLASS_ENGINES = {
    'Jump': [HEAVY_ENGINE, LIGHT_ENGINE],
    'Tank': HEAVY_ENGINE,
    'Striker': LIGHT_ENGINE
  };

  var GENERATOR_OPTIONS = [
    { name: 'Standard', desc: 'Power extra Techs over time to keep your deck moving.', grants: [['Boost', 1], ['Shield Generator', 1]] }
  ];
  /* only some hulls are offered a second generator box */
  var CITADEL_GEN = { name: 'Citadel', desc: 'A double size core which can power more weapons and cover more space on the battlefield.', grants: [['Citadel', 1], ['Shield Generator', 1]] };
  var FLEXIBLE_GEN = { name: 'Flexible', desc: 'Power larger decks.', grants: [['Boost', 1], ['Dynamo', 1]] };
  var CLASS_GENERATORS = {
    'Controller': FLEXIBLE_GEN,
    'Striker': FLEXIBLE_GEN,
    'Tank': CITADEL_GEN
  };

  /* a section's boxes are its own options plus, where offered, one granted by the hull class */
  var CORE_SECTIONS = [
    { key: 'weapons', title: 'Weaponary', options: WEAPON_OPTIONS, classOptions: CLASS_WEAPONS },
    { key: 'engines', title: 'Engines', options: ENGINE_OPTIONS, classOptions: CLASS_ENGINES },
    { key: 'generator', title: 'Generator', options: GENERATOR_OPTIONS, classOptions: CLASS_GENERATORS }
  ];

  /* matches the values a fresh frigate.html sheet starts with */
  var SHEET_DEFAULTS = {
    dcHex: '7',
    stats: {
      hullCur: '5', hullBase: '5', shieldCur: '6', shieldBase: '6',
      storageBase: '0',
      sensorRangeBase: '0', drawPlayBase: '1', drawDrawBase: '4'
    },
    skills: {
      Cyber: '1', Diplomacy: '0', Engineering: '3', Leadership: '0',
      Logistics: '2', Navigation: '3', Piloting: '3', Sensors: '2', Science: '-1'
    }
  };

  /* ship level sets both budgets: this many hull ticks AND this many drawn cards.
     core-option grants are free. */
  var DEFAULT_LEVEL = 2, MIN_LEVEL = 1, MAX_LEVEL = 5;

  var SKILL_NAMES = ['Cyber', 'Diplomacy', 'Engineering', 'Leadership', 'Logistics', 'Navigation', 'Piloting', 'Sensors', 'Science'];
  /* the deck can outgrow Leadership and Logistics, so they lead the grid */
  var SKILL_DISPLAY_ORDER = ['Leadership', 'Logistics', 'Cyber', 'Diplomacy', 'Engineering', 'Navigation', 'Piloting', 'Sensors', 'Science'];


  var ALL_STEPS = [
    { key: 'shipClass', label: 'Hull Class', title: 'Choose a Hull',
      sub: 'Spend your Hull Points to customise your hull.' },
    { key: 'core', label: 'Core Options', title: 'Choose Core Technologies',
      sub: 'Select your core weapons, engines and generator which makes up the base of your technology deck.' },
    { key: 'tech', label: 'Technology Deck', title: 'Build Your Deck',
      sub: 'Each level-up you get to choose from a set of Tech options. These options are determined by your class.' },
    { key: 'mod', label: 'Stat-blocks', title: 'Add Stat-blocks for quick reference', sub: '' },
    { key: 'skills', label: 'Crew Skills', title: 'Choose Your Skills',
      sub: 'Put points into the abilities you want your crew to excel at.' }
  ];
  /* the stat-block step only joins the run when the landing checkbox asks for it */
  var steps = [];
  function rebuildSteps() {
    steps = [];
    for (var i = 0; i < ALL_STEPS.length; i++) {
      if (ALL_STEPS[i].key === 'mod' && !choices.statBlocks) continue;
      steps.push(ALL_STEPS[i]);
    }
    if (step > steps.length) step = steps.length;
  }

  function defaultSkills() {
    var out = {};
    for (var i = 0; i < SKILL_NAMES.length; i++) {
      out[SKILL_NAMES[i]] = { points: SHEET_DEFAULTS.skills[SKILL_NAMES[i]], penalty: '' };
    }
    return out;
  }

  var choices = { hulls: {}, level: DEFAULT_LEVEL, removed: {}, core: emptyCore(), tech: null, mod: null, skills: defaultSkills(), shipName: '', disableLimits: false, statBlocks: false, showAllDraw: false, inv: emptyInv() };
  var step = 0;
  var coreSection = 0; // which Core Options section is expanded; the rest show as headers
  var drawOffer = null; // the 3 tech names currently on offer, or null when no draw is open
  var screen = 'landing'; // landing | win | exp
  var expandedFor = {};
  var filters = { q: '', types: [], vehs: [], rars: [], st: false, ld: false, ch: false };
  function resetFilters() { filters = { q: '', types: [], vehs: [], rars: [], st: false, ld: false, ch: false }; }
  var skillInfoOpen = null;

  /* ===== persistence ===== */
  function emptyInv() { return { tech: {}, mod: {} }; }
  function emptyCore() {
    var o = {};
    for (var i = 0; i < CORE_SECTIONS.length; i++) o[CORE_SECTIONS[i].key] = null;
    return o;
  }
  function emptyChoices() { return { hulls: {}, level: DEFAULT_LEVEL, removed: {}, core: emptyCore(), tech: null, mod: null, skills: defaultSkills(), shipName: '', disableLimits: false, statBlocks: false, showAllDraw: false, inv: emptyInv() }; }
  function loadChoices() {
    try {
      var raw = localStorage.getItem(BUILDER_KEY);
      var s = raw ? JSON.parse(raw) : {};
      var c = emptyChoices();
      if (s && typeof s === 'object') {
        if (s.hulls && typeof s.hulls === 'object') {
          Object.keys(s.hulls).forEach(function (hn) {
            var n = parseInt(s.hulls[hn], 10);
            if (n > 0 && CLASS_PRESETS[hn]) c.hulls[hn] = n;
          });
        } else if (s.shipClass && CLASS_PRESETS[s.shipClass]) {
          c.hulls[s.shipClass] = 1; /* pre-multi-hull save */
        }
        var prevHulls = choices.hulls;
        choices.hulls = c.hulls;
        if (s.core && typeof s.core === 'object') {
          for (var ci = 0; ci < CORE_SECTIONS.length; ci++) {
            var sk = CORE_SECTIONS[ci].key;
            c.core[sk] = validCorePick(sk, s.core[sk]);
          }
        }
        choices.hulls = prevHulls;
        c.tech = s.tech || null;
        c.mod = s.mod || null;
        c.shipName = s.shipName || '';
        c.disableLimits = !!s.disableLimits;
        c.statBlocks = !!s.statBlocks;
        c.showAllDraw = !!s.showAllDraw;
        if (s.removed && typeof s.removed === 'object') {
          Object.keys(s.removed).forEach(function (rn) {
            var rv = parseInt(s.removed[rn], 10);
            if (rv > 0) c.removed[rn] = rv;
          });
        }
        var lv = parseInt(s.level, 10);
        c.level = isNaN(lv) ? DEFAULT_LEVEL : Math.max(MIN_LEVEL, Math.min(MAX_LEVEL, lv));
        if (s.inv && typeof s.inv === 'object') {
          c.inv = emptyInv();
          ['tech', 'mod'].forEach(function (ik) {
            var src = s.inv[ik];
            if (src && typeof src === 'object') {
              Object.keys(src).forEach(function (name) {
                var n = parseInt(src[name], 10);
                if (n > 0) c.inv[ik][name] = n;
              });
            }
          });
        } else {
          c.inv = emptyInv();
          if (s.tech) c.inv.tech[s.tech] = 1;
          if (s.mod) c.inv.mod[s.mod] = 1;
        }
        if (s.skills && typeof s.skills === 'object') {
          for (var i = 0; i < SKILL_NAMES.length; i++) {
            var n = SKILL_NAMES[i];
            var v = s.skills[n];
            if (v && typeof v === 'object') {
              c.skills[n].points = (v.points !== undefined && v.points !== null) ? String(v.points) : SHEET_DEFAULTS.skills[n];
              c.skills[n].penalty = (v.penalty !== undefined && v.penalty !== null) ? String(v.penalty) : '';
            }
          }
        }
      }
      return c;
    } catch (e) { return emptyChoices(); }
  }
  function saveChoices() {
    try { localStorage.setItem(BUILDER_KEY, JSON.stringify(choices)); } catch (e) {}
  }
  function choicesHaveAny() {
    return !!(hullTicks() || corePick(CORE_SECTIONS[0].key) || choices.tech || choices.mod || choices.shipName);
  }
  /* hulls are ticked, not picked: a name -> tick count map */
  function hullNames() {
    var out = [];
    var keys = Object.keys(CLASS_PRESETS);
    for (var i = 0; i < keys.length; i++) if ((choices.hulls[keys[i]] || 0) > 0) out.push(keys[i]);
    return out;
  }
  function hullLabel() {
    var names = hullNames();
    var out = [];
    for (var i = 0; i < names.length; i++) {
      var c = choices.hulls[names[i]];
      out.push(c > 1 ? names[i] + ' ×' + c : names[i]);
    }
    return out.join(', ');
  }
  function hullTicks() {
    var total = 0;
    for (var n in choices.hulls) if (choices.hulls[n] > 0) total += choices.hulls[n];
    return total;
  }
  function countFor(key, id) {
    if (key === 'shipClass') return (choices.hulls && choices.hulls[id]) || 0;
    var inv = choices.inv && choices.inv[key];
    return (inv && inv[id]) || 0;
  }

  /* steps that hold one pick rather than a counted inventory; core keys are 'core:<section>' */
  function isSingle(k) { return k.indexOf('core') === 0; }
  function coreSecKey(k) { return k.indexOf('core:') === 0 ? k.slice(5) : null; }
  function corePick(secKey) { return (choices.core && choices.core[secKey]) || null; }
  function pickOf(k) {
    var sec = coreSecKey(k);
    return sec ? corePick(sec) : choices[k];
  }
  function setPick(k, id) {
    var sec = coreSecKey(k);
    if (sec) { if (!choices.core) choices.core = emptyCore(); choices.core[sec] = id; }
    else choices[k] = id;
  }
  function findSection(secKey) {
    for (var i = 0; i < CORE_SECTIONS.length; i++) if (CORE_SECTIONS[i].key === secKey) return CORE_SECTIONS[i];
    return null;
  }
  /* a hull's entry in classOptions is one box, or a list of them; always read it as a list */
  function classBoxesFor(sec, hull) {
    var co = sec.classOptions && sec.classOptions[hull];
    if (!co) return [];
    return (Object.prototype.toString.call(co) === '[object Array]') ? co : [co];
  }
  /* options in a section are its own, plus the class boxes any ticked hull unlocks.
     two hulls granting the same box (Jump and Tank both give Heavyweight) still show it once. */
  function sectionOptions(secKey) {
    var sec = findSection(secKey);
    if (!sec) return [];
    var out = (sec.options || []).slice();
    if (!sec.classOptions) return out;
    var seen = {};
    var hulls = hullNames();
    for (var i = 0; i < hulls.length; i++) {
      var boxes = classBoxesFor(sec, hulls[i]);
      for (var b = 0; b < boxes.length; b++) {
        var co = boxes[b];
        if (seen[co.name]) { seen[co.name].fromClass.push(hulls[i]); continue; }
        seen[co.name] = { name: co.name, desc: co.desc, grants: co.grants, isClass: true, fromClass: [hulls[i]] };
        out.push(seen[co.name]);
      }
    }
    return out;
  }
  function findSectionOption(secKey, name) {
    var list = sectionOptions(secKey);
    for (var i = 0; i < list.length; i++) if (list[i].name === name) return list[i];
    return null;
  }
  /* a stored pick survives only while it is still offered (changing hulls changes the class boxes) */
  function validCorePick(secKey, name) {
    if (!name) return null;
    var list = sectionOptions(secKey);
    for (var i = 0; i < list.length; i++) if (list[i].name === name) return name;
    return null;
  }
  /* every tech in the deck: core-option grants plus everything drawn, less anything deleted */
  function deckCounts() {
    var out = coreTechCounts();
    var inv = choices.inv && choices.inv.tech;
    if (inv) {
      for (var n in inv) if (inv[n] > 0) out[n] = (out[n] || 0) + inv[n];
    }
    var gone = choices.removed || {};
    for (var g in gone) {
      if (!out[g]) continue;
      out[g] -= gone[g];
      if (out[g] <= 0) delete out[g];
    }
    return out;
  }
  /* take one copy off the stack: a drawn card first (refunding its point), else a grant */
  function removeOneFromDeck(name) {
    var inv = choices.inv.tech;
    if (inv && inv[name] > 0) {
      inv[name] -= 1;
      if (inv[name] <= 0) delete inv[name];
      return;
    }
    if (!choices.removed) choices.removed = {};
    choices.removed[name] = (choices.removed[name] || 0) + 1;
  }
  function drawnCount() {
    var total = 0;
    var inv = choices.inv && choices.inv.tech;
    if (inv) {
      for (var n in inv) if (inv[n] > 0) total += inv[n];
    }
    return total;
  }
  function shipLevel() {
    var n = parseInt(choices.level, 10);
    if (isNaN(n)) n = DEFAULT_LEVEL;
    return Math.max(MIN_LEVEL, Math.min(MAX_LEVEL, n));
  }
  /* dropping a level must not strand points already spent, so the minus stops at whatever is committed */
  function minLevel() {
    return Math.max(MIN_LEVEL, hullTicks(), drawnCount());
  }
  function hullPointsLeft() {
    return choices.disableLimits ? shipLevel() : shipLevel() - hullTicks();
  }
  function deckPointsLeft() {
    return choices.disableLimits ? shipLevel() : shipLevel() - drawnCount();
  }
  /* each slot first rolls for a free reroll, then splits the rest 4:2:1 across the rarities.
     REROLL_CHANCE of 0.125 restores the old 1/2 common, 1/4 uncommon, 1/8 rare, 1/8 reroll;
     it is 0 for now, so every slot always deals a card. */
  var REROLL_CHANCE = 0;
  var RARITY_ORDER = ['common', 'uncommon', 'rare'];
  function rollRarity() {
    if (REROLL_CHANCE > 0 && Math.random() < REROLL_CHANCE) return 'reroll';
    var r = Math.random() * 7;
    if (r < 4) return 'common';
    if (r < 6) return 'uncommon';
    return 'rare';
  }
  /* a draw offers one card per hull tick. Within a class the ticks are levels: odd levels
     (1, 3, 5) draw from that class's own pool, even levels (2, 4, 6) from the classless pool. */
  function rollDraw() {
    var out = [];
    var used = {};
    var reroll = false;
    function poolOf(cls, rarity) {
      var pool = [];
      for (var i = 0; i < TECH_PRESETS.length; i++) {
        var t = TECH_PRESETS[i];
        if (used[t.name]) continue;
        if (techClasses(t).indexOf(cls) === -1) continue;
        if ((t.rarity || 'common') !== rarity) continue;
        pool.push(t.name);
      }
      return pool;
    }
    function take(cls) {
      var want = rollRarity();
      if (want === 'reroll') { reroll = true; return; }
      var pool = poolOf(cls, want);
      /* that class may be out of cards at the rolled rarity; slide to another rather than drop the slot */
      for (var i = 0; !pool.length && i < RARITY_ORDER.length; i++) pool = poolOf(cls, RARITY_ORDER[i]);
      if (!pool.length) return;
      var name = pool[Math.floor(Math.random() * pool.length)];
      used[name] = true;
      out.push({ name: name, cls: cls });
    }
    /* the landing's "Show all on card draw" turns the offer into the whole pool the ship
       can reach: every classless card plus every card of each ticked class, no rarity roll.
       `used` still applies, so a card in two classes is offered once. */
    function takeAll(cls) {
      for (var i = 0; i < TECH_PRESETS.length; i++) {
        var t = TECH_PRESETS[i];
        if (used[t.name]) continue;
        if (techClasses(t).indexOf(cls) === -1) continue;
        used[t.name] = true;
        out.push({ name: t.name, cls: cls });
      }
    }
    var hulls = Object.keys(CLASS_PRESETS);
    var ticks = 0;
    var anyEven = false;
    for (var h = 0; h < hulls.length; h++) {
      var n = choices.hulls[hulls[h]] || 0;
      ticks += n;
      if (n >= 2) anyEven = true;
      if (choices.showAllDraw) {
        if (n > 0) takeAll(hulls[h].toLowerCase());
        continue;
      }
      for (var lvl = 1; lvl <= n; lvl++) {
        take(lvl % 2 === 1 ? hulls[h].toLowerCase() : 'none');
      }
    }
    /* show-all widens each level's pool, it does not invent levels: the classless pool is
       what an even level draws from, so it only appears once some class has reached one */
    if (choices.showAllDraw) { if (anyEven) takeAll('none'); }
    /* no hull ticked is not reachable from step 1, but an empty offer would be a dead end */
    else if (!ticks) take('none');
    /* the offer reads classless first, then each class in hull order. A normal draw is a
       handful of cards, so name alone orders them; a show-all offer is the whole pool, so
       it groups by rarity (common to rare, as RARITY_ORDER lists them) before name. */
    var order = ['none'];
    for (var o = 0; o < hulls.length; o++) order.push(hulls[o].toLowerCase());
    var byRarity = !!choices.showAllDraw;
    out.sort(function (a, b) {
      var d = order.indexOf(a.cls) - order.indexOf(b.cls);
      if (d) return d;
      if (byRarity) {
        var ta = findTech(a.name), tb = findTech(b.name);
        d = RARITY_ORDER.indexOf((ta && ta.rarity) || 'common') -
            RARITY_ORDER.indexOf((tb && tb.rarity) || 'common');
        if (d) return d;
      }
      return a.name.toLowerCase().localeCompare(b.name.toLowerCase());
    });
    var names = [];
    for (var k = 0; k < out.length; k++) names.push(out[k].name);
    return { names: names, reroll: reroll };
  }

  /* techs handed out by the chosen core options, as name -> count */
  function coreTechCounts() {
    var out = {};
    for (var i = 0; i < CORE_SECTIONS.length; i++) {
      var sk = CORE_SECTIONS[i].key;
      var opt = findSectionOption(sk, corePick(sk));
      if (!opt || !opt.grants) continue;
      for (var g = 0; g < opt.grants.length; g++) {
        out[opt.grants[g][0]] = (out[opt.grants[g][0]] || 0) + opt.grants[g][1];
      }
    }
    return out;
  }
  function revalidateCore() {
    for (var i = 0; i < CORE_SECTIONS.length; i++) {
      var sk = CORE_SECTIONS[i].key;
      choices.core[sk] = validCorePick(sk, choices.core[sk]);
    }
  }
  function coreComplete() {
    for (var i = 0; i < CORE_SECTIONS.length; i++) if (!corePick(CORE_SECTIONS[i].key)) return false;
    return true;
  }
  function firstUnansweredSection() {
    for (var i = 0; i < CORE_SECTIONS.length; i++) if (!corePick(CORE_SECTIONS[i].key)) return i;
    return CORE_SECTIONS.length - 1;
  }
  /* the section Continue should open next: the first unanswered one after the current, wrapping
     round so a section skipped earlier is still collected, or -1 once every section is answered */
  function nextUnansweredSection(from) {
    var n = CORE_SECTIONS.length;
    for (var i = 1; i <= n; i++) {
      var j = (from + i) % n;
      if (!corePick(CORE_SECTIONS[j].key)) return j;
    }
    return -1;
  }
  function hasPick(k) {
    if (k === 'shipClass') return hullTicks() > 0;
    if (k === 'core') return coreComplete();
    if (k === 'tech') { for (var dn in deckCounts()) return true; return false; }
    if (isSingle(k)) return !!pickOf(k);
    if (k === 'skills') return true;
    var inv = choices.inv && choices.inv[k];
    if (inv) for (var n in inv) if (inv[n] > 0) return true;
    return false;
  }
  /* ===== find helpers ===== */
  /* hullClass is one class or a list of them; always read it as a list */
  function techClasses(t) {
    var hc = (t && t.hullClass) || 'none';
    return (Object.prototype.toString.call(hc) === '[object Array]') ? hc : [hc];
  }
  function findTech(name) {
    for (var i = 0; i < TECH_PRESETS.length; i++) if (TECH_PRESETS[i].name === name) return TECH_PRESETS[i];
    return null;
  }
  /* "Create Module Cannon." / "Create deployable Fusion Mine" -> the preset it names.
     matched by longest preset name so "Create Module P.D. Trash." finds P.D., not nothing. */
  function modsNamedIn(text, found) {
    var re = /create\s+(?:module|deployable)\s+/gi;
    var m;
    while ((m = re.exec(text)) !== null) {
      var rest = text.slice(re.lastIndex).toLowerCase();
      var best = null;
      for (var i = 0; i < MOD_PRESETS.length; i++) {
        var nm = MOD_PRESETS[i].name;
        if (rest.indexOf(nm.toLowerCase()) === 0 && (!best || nm.length > best.length)) best = nm;
      }
      if (best) found[best] = true;
    }
  }
  /* every module or deployable the deck can create, one of each, refreshed on entering the step */
  function syncModsFromDeck() {
    var deck = deckCounts();
    var found = {};
    for (var name in deck) {
      var t = findTech(name);
      if (!t) continue;
      modsNamedIn([t.onbuild || '', t.passive || '', t.onactivate || ''].join('\n'), found);
    }
    var added = false;
    for (var mn in found) {
      if (!(choices.inv.mod[mn] > 0)) { choices.inv.mod[mn] = 1; added = true; }
    }
    if (added) saveChoices();
  }
  function findMod(name) {
    for (var i = 0; i < MOD_PRESETS.length; i++) if (MOD_PRESETS[i].name === name) return MOD_PRESETS[i];
    return null;
  }

  /* ===== screens ===== */
  var landing = document.getElementById('landing');
  var win = document.getElementById('win');
  var exp = document.getElementById('exp');

  function show(s) {
    screen = s;

    win.classList.toggle('builder-hidden', s !== 'win');
    exp.classList.toggle('builder-hidden', s !== 'exp');

    if (s === 'exp') renderExport();

  }

  function refreshLanding() {
    document.getElementById('limitsBox').checked = !!choices.disableLimits;
    document.getElementById('statBlocksBox').checked = !!choices.statBlocks;
    document.getElementById('showAllDrawBox').checked = !!choices.showAllDraw;
    var hint = document.getElementById('landingHint');
    var resumeBtn = document.getElementById('resumeBtn');
    if (choicesHaveAny()) {
      hint.textContent = 'Saved choices are ready to continue — resume, or start fresh.';
      resumeBtn.style.display = '';

      hint.textContent = 'No saved choices yet.';
      resumeBtn.style.display = 'none';

  /* ===== option cards (click-select + expandable detail) ===== */
  function metaTags(list) {
    var html = '';

    var html = '<div class="opt-panel" data-panel="' + key + '">';

      if (addCount) html += '<span class="exp-count">×' + addCount + '</span>';
      html += '<button type="button" class="exp-add" data-add="' + key + '">+</button>';
    }

      html += '<button type="button" class="exp-del" data-del="' + id.replace(/"/g, '&quot;') +
        '" title="Remove one copy from your deck">✕</button>';
    }
    for (var i = 0; i < expand.length; i++) {
      var it = expand[i];
      var head = (it.tag || it.name)
        ? '<div class="exp-item-name">' + (it.tag ? '<span class="exp-tag">' + esc(it.tag) + '</span>' : '') +
          esc(it.name || '') + '</div>'

      '<button type="button" class="opt' + (body ? '' : ' compact') + (sel ? ' sel' : '') + (open ? ' open' : '') + (extraCls ? ' ' + extraCls : '') + '" data-id="' +
      id.replace(/"/g, '&quot;') + '" data-okey="' + esc(key) + '"' + (isExp ? ' data-exp="1"' : '') + '>' +
      '<span class="opt-title-row">' + (leadIcon || '') + '<span class="opt-title">' + esc(title) + '</span>' + (titleTag || '') + '</span>' +
      (meta && meta.length ? '<span class="opt-meta">' + metaTags(meta) + '</span>' : '') +
      (body ? '<span class="opt-body">' + body + '</span>' : '') +
      (isExp ? '<span class="opt-chev">' + (open ? '▾' : '▸') + '</span>' : '') +

  }

        f.types[MOD_PRESETS[i].tt] = true;
        f.vehs[MOD_PRESETS[i].type] = true;

  }
  function filterChip(iconHtml, fKey, label, on) {
    return '<button type="button" class="ffilter' + (on ? ' on' : '') + '" data-f="' + fKey + '" title="' + esc(label) + '">' + iconHtml + '</button>';
  }
  function renderFilterBar(k) {

      bar.classList.add('builder-hidden');

    for (var i = 0; i < FE.length; i++) {
      var on = filters.types.indexOf(FE[i][0]) !== -1;
      if (f.types[FE[i][0]] || on) row += filterChip(FE[i][1], 't:' + FE[i][0], cap(FE[i][0]) + ' type', on);
    }
    var veh = '';
    var vOn = filters.vehs.indexOf('module') !== -1;
    if (f.vehs.module || vOn) veh += filterChip(MODULE_ICON, 'v:module', 'Modules', vOn);
    var dOn = filters.vehs.indexOf('deployable') !== -1;
    if (f.vehs.deployable || dOn) veh += filterChip(DEPLOYABLE_ICON, 'v:deployable', 'Deployables', dOn);
    if (veh) row += '<span class="ff-div"></span>' + veh;
    if (k === 'tech') {
      var RA = ['common', 'uncommon', 'rare'];
      var rars = '';
      for (var r = 0; r < RA.length; r++) {
        var rOn = filters.rars.indexOf(RA[r]) !== -1;
        if (f.rars[RA[r]] || rOn) {
          rars += filterChip('<span class="rchip rchip-' + RA[r] + '">' + rarityIcon(RA[r]) + '</span>',
            'r:' + RA[r], cap(RA[r]), rOn);

      if (f.ld || filters.ld) extras += filterChip(LEADERSHIP_ICON, 'ld', 'Has capacity cost', filters.ld);

  }
  /* gold Continue: the step is not merely passable but finished */
  function stepReady(k) {
    if (k === 'shipClass') return choices.disableLimits ? hullTicks() > 0 : hullPointsLeft() <= 0;
    if (k === 'tech') return choices.disableLimits ? hasPick('tech') : deckPointsLeft() <= 0;
    if (k === 'core') return coreComplete();
    if (k === 'mod') return hasPick('mod');
    if (k === 'skills') return skillsTotal() >= 13;
    return hasPick(k);
  }
  /* why Continue is greyed out, said in the step's own terms */
  function blockedReason(k) {
    if (k === 'shipClass') {
      var left = hullPointsLeft();
      return left > 0
        ? 'Spend all ' + left + ' remaining hull point' + (left === 1 ? '' : 's') + ' first.'
        : 'Tick a hull first.';
    }
    if (k === 'core') return 'Pick an option in this section first.';
    if (k === 'tech') {
      var dl = deckPointsLeft();
      return dl > 0
        ? 'Draw ' + dl + ' more card' + (dl === 1 ? '' : 's') + ' to spend your remaining points.'
        : 'Draw at least one card first.';
    }
    if (k === 'mod') return 'Pick at least one stat-block first.';
    return 'Finish this step first.';
  }
  function firstUnfinished() {
    for (var i = 0; i < steps.length; i++) if (!stepReady(steps[i].key)) return i;
    return steps.length;
  }
  /* the step the run is sitting on, or null on the export screen */
  function curStepKey() {
    return (screen === 'win' && steps[step]) ? steps[step].key : null;
  }
  function curStepDone() {
    var k = curStepKey();
    return k === null ? true : stepReady(k);
  }
  /* a step is only reachable once every step before it is finished */
  function stepReachable(i) {
    for (var j = 0; j < i && j < steps.length; j++) if (!stepReady(steps[j].key)) return false;
    return true;
  }
  /* the top menu only ever blocks going forward: stepping back to revisit or fix an
     earlier section is always allowed, jumping ahead needs everything before it finished */
  function stepLocked(i) {
    if (i <= step) return false;
    return !stepReachable(i);
  }
  function lockReason(i) {
    if (!curStepDone()) return 'Finish "' + (steps[step] ? steps[step].label : '') + '" before moving on.';
    return 'Finish the earlier steps first.';

  function renderProgressDots() {
    var el = document.getElementById('psteps');

      var isExport = i === steps.length;
      var done = isExport ? stepReachable(steps.length) : stepReady(steps[i].key);
      var cur = isExport ? (screen === 'exp') : (screen === 'win' && i === step);
      var locked = stepLocked(i);
      var cls = cur ? 'cur' : (done ? 'done' : '');
      if (locked) cls += ' locked';
      html += '<button type="button" class="pstep ' + cls + '"' +
        (locked ? ' disabled title="' + escapeHtml(lockReason(i)) + '"' : '') +
        ' onclick="goStep(' + i + ')">' + (i + 1) + '. ' +
        esc(isExport ? 'Export' : steps[i].label) + '</button>';

  function enterExport() {
    syncModsFromDeck();

    if (ib) { ib.classList.add('builder-hidden'); ib.innerHTML = ''; }
    if (fb) { fb.classList.add('builder-hidden'); fb.innerHTML = ''; }
  }
  function goStep(i) {
    if (stepLocked(i)) return;
    if (i === steps.length) { enterExport(); return; }
    goToWin(i);
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function updateProgress() {
    var el = document.getElementById('psteps');
    el.classList.toggle('builder-hidden', screen !== 'win' && screen !== 'exp');

  /* ===== navigation ===== */
  function goToWin(i, sec) {
    drawOffer = null;
    step = i;
    if (steps[i].key === 'mod') syncModsFromDeck();
    if (steps[i].key === 'core') coreSection = (sec === undefined) ? firstUnansweredSection() : sec;
    resetFilters();
    show('win');
    renderOptions();
    renderProgressDots();
  }
  function onContinue() {
    /* the core step is three picks in one window. Continue walks to whatever is still
       unanswered — including a section that was skipped past — and only leaves the step
       once all three are in, so the Generator pick alone cannot carry you forward. */
    if (steps[step] && steps[step].key === 'core') {
      var nextSec = nextUnansweredSection(coreSection);
      if (nextSec !== -1) {
        coreSection = nextSec;
        renderOptions();
        return;
      }
    }
    if (step < steps.length - 1) { goToWin(step + 1); }
    else { enterExport(); }
  }
  function onBack() {
    if (screen === 'win' && steps[step].key === 'core' && coreSection > 0) {
      coreSection -= 1;
      renderOptions();
      return;
    }
    if (step > 0) { goToWin(step - 1); }
    else if (screen === 'exp') { goToWin(steps.length - 1); }
    else { show('landing'); }
  }

  document.getElementById('winOptions').addEventListener('click', function (e) {
    var del = e.target.closest('.exp-del');

      removeOneFromDeck(del.getAttribute('data-del'));

      renderOptions();
      return;
    }
    var addBtn = e.target.closest('.exp-add');

      var kk = addBtn.getAttribute('data-add');
      var wrap = e.target.closest('.opt-wrap');
      var optEl = wrap ? wrap.querySelector('.opt') : null;
      var id = optEl ? optEl.getAttribute('data-id') : null;
      if (!kk || !id) return;

      choices.inv[kk][id] = (choices.inv[kk][id] || 0) + 1;

    }
    var modInfo = e.target.closest('.mod-info');
    if (modInfo) {
      e.stopPropagation();
      openModPopup(modInfo.getAttribute('data-mod'));

    var info = e.target.closest('.skinfo');
    if (info) {
      var irow = e.target.closest('.sk');

    if (sbtn) {
      var row = e.target.closest('.sk');
      var name = row ? row.getAttribute('data-skill') : null;
      if (!name) return;
      var cur = parseInt(choices.skills[name].points, 10);
      if (isNaN(cur)) cur = 0;
      var d = parseInt(sbtn.getAttribute('data-d'), 10) || 0;
      var nv = Math.max(-1, Math.min(choices.disableLimits ? 13 : 4, cur + d));
      choices.skills[name].points = String(nv);
      saveChoices();
      renderOptions();
      return;
    }
    var rec = e.target.closest('.recbtn');

      return;
    }

        saveChoices();

    var btn = e.target.closest('.opt');
    if (!btn || btn.classList.contains('locked-opt')) return;
    var id = btn.getAttribute('data-id');
    var k = btn.getAttribute('data-okey') || steps[step].key;
    var wasOpen = expandedFor[k] === id;
    if (k === 'shipClass') {
      if (hullPointsLeft() <= 0) return;
      choices.hulls[id] = (choices.hulls[id] || 0) + 1;
      revalidateCore();
    }
    if (isSingle(k)) setPick(k, id);
    if (btn.getAttribute('data-exp')) expandedFor[k] = wasOpen ? null : id;
    saveChoices();
    renderOptions();
  });

  document.getElementById('winOptions').addEventListener('input', function (e) {

  document.getElementById('limitsBox').addEventListener('change', function () {

  /* ===== landing actions ===== */
  function startNew() {
    var keepLimits = choices.disableLimits, keepBlocks = choices.statBlocks, keepLevel = shipLevel();
    var keepShowAll = choices.showAllDraw;
    choices = emptyChoices();
    choices.disableLimits = keepLimits;
    choices.statBlocks = keepBlocks;
    choices.showAllDraw = keepShowAll;
    choices.level = keepLevel;
    rebuildSteps();
    saveChoices();
    step = 0;
    goToWin(0);
  }
  function resumeRun() {
    /* resume at the first step that is not finished, so a half-spent step is not skipped past */
    var next = firstUnfinished();
    if (next >= steps.length) { enterExport(); return; }
    step = next;
    goToWin(step);
  }
  function loadExisting() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json,.json';
    input.onchange = function () {
      var file = input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (e) {
        try {
          var json = JSON.parse(e.target.result);
          var loaded = applyLoadedSheet(json);
          if (!loaded) {
            alert('Load failed: no matching cards found in that sheet file.');
            return;
          }
          resumeRun();
        } catch (err) {
          alert('Load failed: invalid JSON file.');
        }
      };
      reader.readAsText(file);
    };
    input.click();
  }
  function applyLoadedSheet(json) {
    var c = emptyChoices();
    var matched = false;
    c.shipName = (json && json.shipName) || '';
    var jl = parseInt(json && json.level, 10);
    if (!isNaN(jl)) c.level = Math.max(MIN_LEVEL, Math.min(MAX_LEVEL, jl));
    if (json && json.hulls && typeof json.hulls === 'object') {
      Object.keys(json.hulls).forEach(function (hn) {
        var n = parseInt(json.hulls[hn], 10);
        if (n > 0 && CLASS_PRESETS[hn]) { c.hulls[hn] = n; matched = true; }
      });
    } else if (json && json.shipClass && CLASS_PRESETS[json.shipClass]) {
      c.hulls[json.shipClass] = 1;
      matched = true;
    }
    var beforeHulls = choices.hulls;
    choices.hulls = c.hulls;
    if (json && json.coreOptions && typeof json.coreOptions === 'object') {
      for (var oi = 0; oi < CORE_SECTIONS.length; oi++) {
        var osk = CORE_SECTIONS[oi].key;
        var got = validCorePick(osk, json.coreOptions[osk]);
        if (got) { c.core[osk] = got; matched = true; }
      }
    }
    if (json && json.tech) {
      for (var ti = 0; ti < json.tech.length; ti++) {
        if (json.tech[ti] && findTech(json.tech[ti].name)) {
          var tn = findTech(json.tech[ti].name).name;
          c.inv.tech[tn] = (c.inv.tech[tn] || 0) + 1;
          matched = true;
        }
      }
    }
    if (json && json.mods) {
      for (var mi = 0; mi < json.mods.length; mi++) {
        if (json.mods[mi] && findMod(json.mods[mi].name)) {
          var mn = findMod(json.mods[mi].name).name;
          c.inv.mod[mn] = (c.inv.mod[mn] || 0) + 1;
          matched = true;
        }
      }
    }
    if (json && json.skills && typeof json.skills === 'object') {
      for (var i = 0; i < SKILL_NAMES.length; i++) {
        var n = SKILL_NAMES[i];
        var sv = json.skills[n];
        if (sv && typeof sv === 'object') {
          c.skills[n].points = (sv.points !== undefined && sv.points !== null) ? String(sv.points) : c.skills[n].points;
          c.skills[n].penalty = (sv.penalty !== undefined && sv.penalty !== null) ? String(sv.penalty) : '';
        }
      }
    }
    choices.hulls = beforeHulls;
    c.disableLimits = choices.disableLimits;
    c.statBlocks = choices.statBlocks;
    c.showAllDraw = choices.showAllDraw;
    choices = c;
    rebuildSteps();
    saveChoices();
    return matched;
  }

  /* ===== export ===== */
  function renderExport() {
    document.getElementById('shipName').value = choices.shipName;
    var html = '';

    function pickList(t, invArr) {
      var names = [];
      if (invArr) {
        for (var n in invArr) if (invArr[n] > 0) names.push(n);
      }
      var chips = '';
      if (names.length) {
        for (var i = 0; i < names.length; i++) {
          var c = invArr[names[i]];
          chips += '<span class="exp-skill">' + esc(names[i]) + (c > 1 ? ' <b>×' + c + '</b>' : '') + '</span>';
        }
      }
      html += '<div class="exp-pick exp-wide"><div class="opt-title">' + esc(t) + '</div>' +
        (chips ? '<div class="exp-skills">' + chips + '</div>' : '<div><span class="exp-none">Not chosen</span></div>') +
        '</div>';
    }

    html += '<div class="exp-pick exp-wide"><div class="opt-title">Hull Class</div><div>' +
      (hullTicks() ? esc(hullLabel()) : '<span class="exp-none">Not chosen</span>') + '</div></div>';
    for (var ci = 0; ci < CORE_SECTIONS.length; ci++) {
      var sec = CORE_SECTIONS[ci];
      var pick = corePick(sec.key);
      html += '<div class="exp-pick exp-wide"><div class="opt-title">' + esc(sec.title) + '</div><div>' +
        (pick ? esc(pick) : '<span class="exp-none">Not chosen</span>') + '</div></div>';
    }
    pickList('Technologies', choices.inv.tech);
    pickList('Modules / Deployables', choices.inv.mod);

    var skPts = [];
    for (var si = 0; si < SKILL_NAMES.length; si++) {
      var n = SKILL_NAMES[si];
      var v = choices.skills[n] || { points: '0', penalty: '' };
      var pen = v.penalty ? ' (' + v.penalty + ')' : '';
      skPts.push(n + ' ' + skillEffective(n) + pen);
    }
    html += '<div class="exp-pick exp-wide"><div class="opt-title">Crew Skills</div><div class="exp-skills">' +
      skPts.map(function (x) { return '<span class="exp-skill">' + esc(x) + '</span>'; }).join('') +
      '</div></div>';
    document.getElementById('expSummary').innerHTML = html;
  }

  function buildSheet() {
    var s = JSON.parse(JSON.stringify(SHEET_DEFAULTS));
    s.shipName = choices.shipName || '';
    s.level = shipLevel();
    s.shipClass = hullTicks() ? hullLabel() : 'Unclassified';
    s.hulls = {};
    for (var hk in choices.hulls) if (choices.hulls[hk] > 0) s.hulls[hk] = choices.hulls[hk];
    s.coreOptions = {};
    for (var ck = 0; ck < CORE_SECTIONS.length; ck++) {
      s.coreOptions[CORE_SECTIONS[ck].key] = corePick(CORE_SECTIONS[ck].key) || '';
    }
    var skills = {};
    for (var si = 0; si < SKILL_NAMES.length; si++) {
      var sn = SKILL_NAMES[si];
      var cv = choices.skills[sn] || {};
      skills[sn] = {
        points: (cv.points !== undefined && cv.points !== null) ? String(cv.points) : SHEET_DEFAULTS.skills[sn],
        penalty: cv.penalty || ''
      };
    }
    s.skills = skills;

    s.crew = [];

    s.tech = [];
    var techCounts = deckCounts();
    for (var tn in techCounts) {
      var tech = findTech(tn);
      if (!tech) continue;
      for (var tk = 0; tk < techCounts[tn]; tk++) {
        s.tech.push({
          name: tech.name,
          traits: tech.traits || '',
          onbuild: tech.onbuild || '',
          passive: tech.passive || '',
          onactivate: tech.onactivate || '',
          techType: tech.tt || 'offense',
          storage: tech.storage || '0',
          leadership: tech.leadership || '',
          hull: '',
          charges: tech.charges || '',
          deploy: deployKey(tech.deploy),
          state: 'deck'
        });
      }
    }

    s.mods = [];
    for (var mn in choices.inv.mod) {
      var mod = findMod(mn);
      if (!mod) continue;
      for (var mk = 0; mk < choices.inv.mod[mn]; mk++) {
        s.mods.push({
          name: mod.name,
          req: mod.req || '',
          hull: mod.hull || '',
          duration: mod.duration || '',
          speed: mod.speed || '',
          charges: mod.charges || '',
          onbuild: mod.onbuild || '',
          passive: mod.passive || '',
          onactivate: mod.onactivate || '',
          type: mod.type || 'module',
          tt: mod.tt || 'offense',
          shape: '',
          exhaust: false
        });
      }
    }
    return s;
  }

  function deployKey(d) {
    if (d === 'module') return 'module';
    if (d === true || d === 'true' || d === 1 || d === '1') return 'deployable';
    if (d === 'deployable' || d === 2 || d === '2') return 'deployable';
    return 'normal';
  }

  /* the builder is same-origin with the board, so handing a build over in-game is a localStorage
     write plus a navigation. It goes on its own key rather than frigate.html's autosave key,
     which any open board tab overwrites as it unloads. */
  var SHEET_HANDOFF_KEY = 'frigatePendingSheet';
  var BOARD_URL = '../board.html';
  function loadInGame(data) {
    try {
      localStorage.setItem(SHEET_HANDOFF_KEY, JSON.stringify(data));
    } catch (e) {
      alert('Could not load the sheet in-game: this browser is not allowing local storage.');
      return;
    }
    window.location.href = BOARD_URL;
  }
  function exportSheet() {
    var data = buildSheet();
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var name = (data.shipName || 'frigate-sheet').replace(/[^a-z0-9_-]+/gi, '_').replace(/^_+|_+$/g, '') || 'frigate-sheet';
    a.href = url;
    a.download = name + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    /* the confirm blocks here while the download finishes in the background */
    if (confirm('Load in-game?')) loadInGame(data);
  }

  /* expose export for the inline onclick */
  window.exportSheet = exportSheet;
  window.buildSheet = buildSheet;

  /* ===== init ===== */
  choices = loadChoices();
  rebuildSteps();
  document.getElementById('shipName').value = choices.shipName;
  window.startNew = function () { startNew(); };
  window.loadExisting = function () { loadExisting(); };
  window.resumeRun = function () { resumeRun(); };
  window.goStep = goStep;
  show('landing');
  renderProgressDots();
})();
</script>
</body>
</html>
