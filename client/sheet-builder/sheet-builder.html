<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheet Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frigate-sheet/css/style.css">
<link rel="stylesheet" href="../frigate-sheet/css/frigate.css">
<style>
  body { padding: 28px 18px 110px; }
  .builder { max-width: 1200px; margin: 0 auto; }
  .builder-panel { margin-top: 16px; padding: 22px 26px; position: relative; }
  .builder-panel .eyebrow { margin-bottom: 14px; }
  .builder-hidden { display: none !important; }

  /* options grid */
  .opt-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px; margin-top: 4px;
  }
  .opt {
    position: relative; text-align: left; cursor: pointer;
    background: var(--panel-alt); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 16px;
    color: var(--ink); font-family: var(--body); font-size: 13.5px; line-height: 1.45;
    display: flex; flex-direction: column; gap: 8px; min-height: 120px;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  .opt:hover { border-color: var(--cyan); }
  .opt.compact { min-height: 0; padding: 12px 16px; }
  .opt.sel {
    border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber), 0 0 18px rgba(232,169,74,.25);
  }
  .opt.sel::after {
    content: '✓'; position: absolute; top: 8px; right: 10px;
    color: var(--amber); font-family: var(--mono); font-weight: 700; font-size: 16px;
  }
  .opt-title {
    font-family: var(--disp); font-size: 14px; letter-spacing: .04em;
    color: var(--ink); text-transform: uppercase;
  }
  .opt-title-row {
    display: flex; align-items: center; gap: 8px;
  }
  .opt-title-row .ticon { width: 15px; height: 15px; flex: none; }
  .opt-meta {
    display: flex; flex-wrap: wrap; gap: 6px;
    font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
  }
  .opt-meta span { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border: 1px solid var(--line); color: var(--ink-mid); border-radius: 4px; line-height: 1; vertical-align: middle; }
  .opt-meta span.t-cyan { color: var(--cyan); border-color: var(--cyan-dim); }
  .opt-meta span.t-amber { color: var(--amber); border-color: var(--brown-dim); }
  .opt-meta span.t-red { color: var(--red); border-color: var(--red-dim); }
  .opt-meta span.t-skill { color: var(--amber); border-color: var(--brown-dim); background: rgba(232,169,74,.08); }
  .opt-meta span.t-hull { background: rgba(232,169,74,.12); color: var(--amber); border-color: var(--amber); }
  .opt-meta span.t-class-tech { color: var(--icon-charged); border-color: var(--icon-charged); background: rgba(156,63,102,.12); }
  .opt-meta .ticon { width: 11px; height: 11px; flex: none; display: block; }
  .sk-note { margin: 0 0 8px; color: var(--ink-mid); font-size: 12px; }
  .skill-pick { display: flex; flex-wrap: wrap; gap: 6px; }
  .skill-pick-btn { padding: 5px 10px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--ink-mid); font-family: var(--mono); font-size: 11px; letter-spacing: .06em; cursor: pointer; }
  .skill-pick-btn:hover { border-color: var(--amber); color: var(--amber); }
  .skill-pick-btn.on { border-color: var(--icon-cyan); color: var(--cyan); background: rgba(92,168,182,.1); }
  .sk-total { grid-column: 1 / -1; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--ink-mid); margin-bottom: 10px; }
  .sk-total b { color: var(--amber); }
  .sk-num.boosted { color: var(--amber); }
  .opt-body {
    color: var(--ink-mid); font-size: 12.5px; white-space: pre-line;
    display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden;
  }
  .opt-body .ticon { width: 15px; height: 15px; vertical-align: -2px; margin-right: 6px; }

  /* filter bar */
  .filter-bar { display: flex; align-items: center; gap: 12px; margin: 14px 0 2px; flex-wrap: wrap; }
  .ff-row { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .ffilter {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 34px; height: 30px; padding: 0 8px;
    border: 1px solid var(--line-bright); border-radius: 6px;
    background: none; color: var(--ink-mid); cursor: pointer; font-size: 13px; line-height: 1;
    transition: border-color .12s ease, color .12s ease, background .12s ease;
  }
  .ffilter .ticon { width: 15px; height: 15px; display: block; }
  .ffilter:hover { border-color: var(--cyan); color: var(--cyan); }
  .ffilter.on { border-color: var(--cyan); color: var(--cyan); background: rgba(79,216,201,.12); }
  .ff-div { width: 1px; height: 20px; background: var(--line); margin: 0 3px; flex: none; }
  .fsearch {
    flex: 1; min-width: 190px;
    background: var(--panel-alt); border: 1px solid var(--line); color: var(--ink);
    font: 500 13px var(--body); padding: 7px 12px; border-radius: 6px;
  }
  .fsearch:focus { outline: none; border-color: var(--cyan); }
  /* inventory bar (multi-picks above the filter bar) */
  .inv-bar {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
    margin: 12px 0 0;
  }
  .invchip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 5px; cursor: pointer;
    background: var(--void); border: 1px solid var(--amber); color: var(--amber);
    font-family: var(--mono); font-size: 11px; letter-spacing: .05em;
  }
  .invchip b { color: var(--amber); }
  .invchip:hover { background: rgba(232,169,74,.12); }
  /* expandable option cards */
  .opt-wrap { display: flex; flex-direction: column; }
  .opt-wrap .opt { flex: 1; }
  .opt-chev {
    margin-top: auto; align-self: flex-end; line-height: 1;
    font-family: var(--mono); font-size: 13px; color: var(--ink-dim);
  }
  .opt.sel .opt-chev, .opt.open .opt-chev { color: var(--amber); }
  .opt-panel {
    position: relative; margin-top: 6px; padding: 13px 15px;
    background: var(--void); border: 1px solid var(--line); border-left: 3px solid var(--cyan-dim);
    border-radius: 8px; display: flex; flex-direction: column; gap: 13px;
  }
  .exp-add {
    position: absolute; top: 8px; right: 10px;
    width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
    background: none; border: 1px solid var(--line-bright); color: var(--ink-mid);
    font-family: var(--mono); font-size: 16px; line-height: 1;
  }
  .exp-add:hover { border-color: var(--amber); color: var(--amber); }
  .exp-count {
    position: absolute; top: 8px; right: 42px;
    font-family: var(--mono); font-size: 10px; letter-spacing: .1em; color: var(--amber);
  }
  .exp-item-name {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-family: var(--disp); font-size: 12px; letter-spacing: .04em; color: var(--ink); text-transform: uppercase;
  }
  .exp-tag {
    font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--cyan); border: 1px solid var(--cyan-dim); border-radius: 4px; padding: 2px 7px;
  }
  .exp-item-desc { color: var(--ink-mid); font-size: 12px; line-height: 1.55; white-space: pre-line; }
  .exp-item-desc br + br { display: none; }

  /* progress steps */
  .psteps { display: flex; gap: 10px; align-items: center; margin: 22px 0 6px; flex-wrap: wrap; }
  .pstep {
    font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-dim); border: 1px solid var(--line); border-radius: 20px; padding: 4px 12px;
    background: none; cursor: pointer; line-height: inherit;
  }
  .pstep:hover { border-color: var(--cyan); color: var(--cyan); }
  .pstep.done { color: var(--cyan); border-color: var(--cyan-dim); }
  .pstep.cur { color: var(--ink); border-color: var(--cyan); background: rgba(79,216,201,.08); }

  /* window nav */
  .win-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 26px; gap: 12px; }
  .b-btn {
    font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    background: none; border: 1px solid var(--line-bright); color: var(--ink-mid);
    padding: 9px 18px; border-radius: 6px; cursor: pointer;
    transition: border-color .12s ease, color .12s ease;
  }
  .b-btn:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }
  .b-btn:disabled { opacity: .35; cursor: default; }
  .b-btn.primary {
    background: rgba(79,216,201,.08); border-color: var(--cyan); color: var(--cyan);
  }
  .b-btn.primary:hover:not(:disabled) { background: rgba(79,216,201,.15); }

  /* landing */
  .land-btns { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; }
  .land-btns .b-btn { padding: 14px 22px; font-size: 12px; }
  .hint-text { color: var(--ink-dim); font-size: 12px; margin-top: 18px; line-height: 1.55; }

  /* export screen */
  .exp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-top: 16px; }
  .exp-pick {
    background: var(--panel-alt); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
  }
  .exp-pick .opt-title { font-size: 12px; margin-bottom: 4px; }
  .exp-pick .exp-none { color: var(--ink-dim); font-style: italic; font-size: 12.5px; }
  .exp-field { margin-top: 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .exp-field label { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--ink-mid); text-transform: uppercase; }
  .exp-field input {
    background: var(--panel-alt); border: 1px solid var(--line); color: var(--ink);
    font-size: 13px; font-family: var(--body); padding: 8px 12px; border-radius: 6px; min-width: 240px;
  }
  .exp-field input:focus { outline: none; border-color: var(--cyan); }

  /* skills window */
  .sk-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 12px; margin-top: 4px;
  }
  .sk {
    display: flex; flex-direction: column;
    background: var(--panel-alt); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 14px;
  }
  .sk-head { display: flex; align-items: center; gap: 10px; }
  .sk-name {
    font-family: var(--disp); font-size: 13px; letter-spacing: .04em; text-transform: uppercase;
    min-width: 0; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sk-num {
    font-family: var(--mono); font-weight: 700; font-size: 15px; color: var(--cyan);
    width: 34px; text-align: center; flex: none;
  }
  .sk-btns { display: flex; gap: 6px; flex: none; }
  .sbtn {
    width: 30px; height: 30px; border-radius: 6px; cursor: pointer;
    background: none; border: 1px solid var(--line-bright); color: var(--ink-mid);
    font-family: var(--mono); font-size: 15px; line-height: 1;
  }
  .sbtn:hover { border-color: var(--cyan); color: var(--cyan); }
  .sk-pen { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
  .sk-pen label {
    font-family: var(--mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim);
  }
  .sk-pen input {
    width: 56px; background: var(--panel-alt); border: 1px solid var(--line); color: var(--ink);
    font: 600 13px var(--body); padding: 4px 6px; border-radius: 4px;
  }
  .sk-pen input:focus { outline: none; border-color: var(--cyan); }
  .skinfo {
    margin-left: 2px; width: 28px; height: 26px; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid var(--line); border-radius: 5px;
    color: var(--ink-mid); cursor: pointer;
  }
  .skinfo .ticon { width: 14px; height: 14px; }
  .skinfo:hover, .skinfo.on { color: var(--amber); border-color: var(--amber); }
  .sk-desc {
    margin-top: 8px; padding: 8px 10px;
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--amber);
    border-radius: 6px; color: var(--ink-mid); font-size: 12px; line-height: 1.4;
  }

  /* export summary */
  .exp-wide { grid-column: 1 / -1; }
  .exp-skills { display: flex; flex-wrap: wrap; gap: 8px; }
  .exp-skill {
    font-family: var(--mono); font-size: 11px; letter-spacing: .03em;
    color: var(--ink-mid); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px;
  }
</style>
</head>
<body>
<nav class="menu-bar">
  <div class="menu-brand">
    <div class="ship-class-label">Sheet Builder</div>
  </div>
  <div class="menu-actions">
    <button type="button" class="menu-toggle" onclick="window.close()" title="Close the sheet builder"><span class="menu-ico" aria-hidden="true">✕</span><span class="menu-label">Close</span></button>
  </div>
</nav>

<main class="builder">

  <!-- LANDING -->
  <section class="panel builder-panel" id="landing">
    <div class="bl"></div><div class="br"></div>
    <div class="eyebrow"><span class="eb-text">Build a Character</span></div>
    <p style="color:var(--ink-mid);font-size:13.5px;line-height:1.6;margin:8px 0 4px;">
      Run through a few windows to assemble your frigate: pick a hull class, a trait or officer,
      a starting technology and a starting module. Choices are remembered in this browser and can
      be exported to a full frigate sheet JSON.
    </p>
    <div class="land-btns">
      <button type="button" class="b-btn primary" onclick="startNew()">Create new character</button>
      <button type="button" class="b-btn" onclick="loadExisting()">Load existing character</button>
      <button type="button" class="b-btn" id="resumeBtn" onclick="resumeRun()" style="display:none;">Continue run in progress</button>
    </div>
    <div class="hint-text" id="landingHint">No saved choices yet.</div>
  </section>

  <!-- PROGRESS -->
  <div class="psteps" id="psteps"></div>

  <!-- CHOICE WINDOW -->
  <section class="panel builder-panel builder-hidden" id="win">
    <div class="bl"></div><div class="br"></div>
    <div class="eyebrow"><span class="eb-text" id="winTitle">…</span></div>
    <div class="inv-bar" id="invBar"></div>
    <div class="filter-bar" id="filterBar"></div>
    <div class="opt-grid" id="winOptions"></div>
    <div class="win-nav">
      <button type="button" class="b-btn" id="backBtn">← Back</button>
      <button type="button" class="b-btn primary" id="continueBtn">Continue →</button>
    </div>
  </section>

  <!-- EXPORT WINDOW -->
  <section class="panel builder-panel builder-hidden" id="exp">
    <div class="bl"></div><div class="br"></div>
    <div class="eyebrow"><span class="eb-text">Review &amp; Export</span></div>
    <div class="exp-grid" id="expSummary"></div>
    <div class="exp-field">
      <label for="shipName">Ship Name</label>
      <input type="text" id="shipName" maxlength="40" placeholder="e.g. The Inevitable">
    </div>
    <div class="win-nav">
      <button type="button" class="b-btn" id="expBackBtn">← Back</button>
      <button type="button" class="b-btn primary" onclick="exportSheet()">⇩ Export</button>
    </div>
  </section>

</main>

<script src="../frigate-sheet/presets/crew-presets.js"></script>
<script src="../frigate-sheet/presets/tech-presets.js"></script>
<script src="../frigate-sheet/presets/mod-presets.js"></script>
<script>
(function () {
  'use strict';

  var BUILDER_KEY = 'frigateBuilderChoices';

  /* class presets mirror frigate.html CLASS_PRESETS (stat/skill bonuses only) */
  var CLASS_PRESETS = {
    'Support Class': { stats: { hull: 2, shield: 2, storage: 2 }, techName: 'Repulsor Unit', modName: 'Repulsor Unit' },
    'Jump Class': { stats: { speed: 2 }, skills: { Sensors: 1 }, techName: 'Phantom' },
    'Discovery Class': { stats: { storage: 2 }, skills: { Logistics: 2, Science: 1 }, techName: 'Experimental Reconnaissance' },
    'Striker Class': { stats: { storage: 2 }, skills: { Leadership: 2 }, techName: 'Decomp Strikes' },
    'Bulwark Class': { stats: { hull: 4 }, crewTraits: ['Citadel'] }
  };

  /* matches the values a fresh frigate.html sheet starts with */
  var SHEET_DEFAULTS = {
    dcHex: '6',
    stats: {
      hullCur: '5', hullBase: '5', shieldCur: '6', shieldBase: '6',
      speedCur: '2', speedBase: '2', storageBase: '0',
      sensorRangeBase: '0', drawPlayBase: '1', drawDrawBase: '4'
    },
    skills: {
      Cyber: '1', Diplomacy: '0', Engineering: '3', Leadership: '0',
      Logistics: '2', Navigation: '3', Piloting: '3', Sensors: '2', Science: '-1'
    }
  };

  var SKILL_NAMES = ['Cyber', 'Diplomacy', 'Engineering', 'Leadership', 'Logistics', 'Navigation', 'Piloting', 'Sensors', 'Science'];

  var SKILL_DESC = {
    'Cyber': 'Cyber is added to Draw (min. 0)',
    'Diplomacy': 'Used to reduce or cause conflict, through threats, persuasion and deception.',
    'Engineering': 'Engineering is added to Hull HP (min. 0)',
    'Leadership': 'Leadership is the maximum number of Traits & Officers slots (min. 0)',
    'Logistics': 'Logistics is added to Storage (min. 0). Also used for Initiative rolls to determine round order',
    'Navigation': 'Navigation is added to Speed (min. 0)',
    'Piloting': 'Sometimes you might have to dodge!!!',
    'Science': '1/2 of (science + science penalty)',
    'Sensors': 'Twice Sensors is added to Sensor Range (min. 0)'
  };

  var steps = [
    { key: 'shipClass', label: 'Hull Class' },
    { key: 'crew', label: 'Trait / Officer' },
    { key: 'tech', label: 'Technology Deck' },
    { key: 'mod', label: 'Modules/Deployables' },
    { key: 'skills', label: 'Crew Skills' }
  ];

  function defaultSkills() {
    var out = {};
    for (var i = 0; i < SKILL_NAMES.length; i++) {
      out[SKILL_NAMES[i]] = { points: SHEET_DEFAULTS.skills[SKILL_NAMES[i]], penalty: '' };
    }
    return out;
  }

  var choices = { shipClass: null, crew: null, tech: null, mod: null, skills: defaultSkills(), shipName: '', skillBoost: null, inv: emptyInv() };
  var step = 0;
  var screen = 'landing'; // landing | win | exp
  var expandedFor = { shipClass: null, crew: null, tech: null, mod: null };
  var filters = { q: '', types: [], vehs: [], st: false, ch: false, cbt: false, sk: false };
  function resetFilters() { filters = { q: '', types: [], vehs: [], st: false, ch: false, cbt: false, sk: false }; }
  var skillInfoOpen = null;

  /* ===== persistence ===== */
  function emptyInv() { return { crew: {}, tech: {}, mod: {} }; }
  function emptyChoices() { return { shipClass: null, crew: null, tech: null, mod: null, skills: defaultSkills(), shipName: '', skillBoost: null, inv: emptyInv() }; }
  function loadChoices() {
    try {
      var raw = localStorage.getItem(BUILDER_KEY);
      var s = raw ? JSON.parse(raw) : {};
      var c = emptyChoices();
      if (s && typeof s === 'object') {
        c.shipClass = s.shipClass || null;
        c.crew = s.crew || null;
        c.tech = s.tech || null;
        c.mod = s.mod || null;
        c.shipName = s.shipName || '';
        c.skillBoost = s.skillBoost || null;
        if (s.inv && typeof s.inv === 'object') {
          c.inv = { crew: {}, tech: {}, mod: {} };
          ['crew', 'tech', 'mod'].forEach(function (ik) {
            var src = s.inv[ik];
            if (src && typeof src === 'object') {
              Object.keys(src).forEach(function (name) {
                var n = parseInt(src[name], 10);
                if (n > 0) c.inv[ik][name] = n;
              });
            }
          });
        } else {
          c.inv = emptyInv();
          if (s.crew) c.inv.crew[s.crew] = 1;
          if (s.tech) c.inv.tech[s.tech] = 1;
          if (s.mod) c.inv.mod[s.mod] = 1;
        }
        if (s.skills && typeof s.skills === 'object') {
          for (var i = 0; i < SKILL_NAMES.length; i++) {
            var n = SKILL_NAMES[i];
            var v = s.skills[n];
            if (v && typeof v === 'object') {
              c.skills[n].points = (v.points !== undefined && v.points !== null) ? String(v.points) : SHEET_DEFAULTS.skills[n];
              c.skills[n].penalty = (v.penalty !== undefined && v.penalty !== null) ? String(v.penalty) : '';
            }
          }
        }
      }
      return c;
    } catch (e) { return emptyChoices(); }
  }
  function saveChoices() {
    try { localStorage.setItem(BUILDER_KEY, JSON.stringify(choices)); } catch (e) {}
  }
  function choicesHaveAny() {
    return !!(choices.shipClass || choices.crew || choices.tech || choices.mod || choices.shipName);
  }
  function hasPick(k) {
    if (k === 'shipClass' || k === 'skills') return !!choices[k];
    var inv = choices.inv && choices.inv[k];
    if (inv) for (var n in inv) if (inv[n] > 0) return true;
    return !!choices[k];
  }
  function firstUnanswered() {
    for (var i = 0; i < steps.length; i++) {
      if (!hasPick(steps[i].key)) return i;
    }
    return steps.length; // all answered -> export
  }

  /* ===== find helpers ===== */
  function findCrew(name) {
    for (var i = 0; i < CREW_PRESETS.length; i++) if (CREW_PRESETS[i].name === name) return CREW_PRESETS[i];
    return null;
  }
  function findTech(name) {
    for (var i = 0; i < TECH_PRESETS.length; i++) if (TECH_PRESETS[i].name === name) return TECH_PRESETS[i];
    return null;
  }
  function findMod(name) {
    for (var i = 0; i < MOD_PRESETS.length; i++) if (MOD_PRESETS[i].name === name) return MOD_PRESETS[i];
    return null;
  }
  function stripTags(s) {
    return String(s || '').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
  }

  /* ===== screens ===== */
  var landing = document.getElementById('landing');
  var win = document.getElementById('win');
  var exp = document.getElementById('exp');

  function show(s) {
    screen = s;
    landing.classList.toggle('builder-hidden', s !== 'landing');
    win.classList.toggle('builder-hidden', s !== 'win');
    exp.classList.toggle('builder-hidden', s !== 'exp');
    if (s === 'landing') refreshLanding();
    if (s === 'exp') renderExport();
    window.scrollTo(0, 0);
  }

  function refreshLanding() {
    var hint = document.getElementById('landingHint');
    var resumeBtn = document.getElementById('resumeBtn');
    if (choicesHaveAny()) {
      hint.textContent = 'Saved choices are ready to continue — resume, or start fresh.';
      resumeBtn.style.display = '';
    } else {
      hint.textContent = 'No saved choices yet.';
      resumeBtn.style.display = 'none';
    }
  }

  /* ===== option cards (click-select + expandable detail) ===== */
  function metaTags(list) {
    var html = '';
    for (var i = 0; i < list.length; i++) {
      html += '<span class="' + (list[i].cls || '') + '">' + list[i].text + '</span>';
    }
    return html;
  }
  // expand: array of { tag, name, desc } to list under the card when opened
  function expandPanelHtml(key, expand, id) {
    if (!expand || !expand.length) return '';
    var addCount = (choices.inv && choices.inv[key] && choices.inv[key][id]) || 0;
    var html = '<div class="opt-panel" data-panel="' + key + '">';
    if (addCount) html += '<span class="exp-count">×' + addCount + '</span>';
    html += '<button type="button" class="exp-add" data-add="' + key + '">+</button>';
    for (var i = 0; i < expand.length; i++) {
      var it = expand[i];
      html += '<div class="exp-item">' +
        '<div class="exp-item-name">' + (it.tag ? '<span class="exp-tag">' + esc(it.tag) + '</span>' : '') + esc(it.name) + '</div>' +
        '<div class="exp-item-desc">' + (it.desc || 'No text.') + '</div>' +
        '</div>';
    }
    html += '</div>';
    return html;
  }
  function optionHtml(key, id, title, body, meta, expand, leadIcon) {
    var sel = choices[key] === id;
    var isExp = !!(expand && expand.length);
    var open = isExp && expandedFor[key] === id;
    return '<div class="opt-wrap">' +
      '<button type="button" class="opt' + (body ? '' : ' compact') + (sel ? ' sel' : '') + (open ? ' open' : '') + '" data-id="' +
      id.replace(/"/g, '&quot;') + '"' + (isExp ? ' data-exp="1"' : '') + '>' +
      '<span class="opt-title-row">' + (leadIcon || '') + '<span class="opt-title">' + esc(title) + '</span></span>' +
      (meta && meta.length ? '<span class="opt-meta">' + metaTags(meta) + '</span>' : '') +
      (body ? '<span class="opt-body">' + body + '</span>' : '') +
      (isExp ? '<span class="opt-chev">' + (open ? '▾' : '▸') + '</span>' : '') +
      '</button>' +
      (open ? expandPanelHtml(key, expand, id) : '') +
      '</div>';
  }

  var MODULE_ICON = '<svg class="ticon" viewBox="0 0 24 24" fill="none"><path d="M12 2.5 21 8v8l-9 5.5L3 16V8l9-5.5Z" stroke="var(--icon-cyan)" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.6" stroke="var(--icon-cyan)" stroke-width="1.6"/></svg>';
  var DEPLOYABLE_ICON = '<svg class="ticon" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="4" stroke="var(--icon-amber)" stroke-width="1.6"/><circle cx="8" cy="8" r="1.4" fill="var(--icon-amber)"/><circle cx="16" cy="8" r="1.4" fill="var(--icon-amber)"/><circle cx="12" cy="12" r="1.4" fill="var(--icon-amber)"/><circle cx="8" cy="16" r="1.4" fill="var(--icon-amber)"/><circle cx="16" cy="16" r="1.4" fill="var(--icon-amber)"/></svg>';
  var STORAGE_ICON = '<svg class="ticon" viewBox="0 0 24 24" fill="none"><path d="M4 8h16v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z" stroke="var(--icon-logistics)" stroke-width="1.8" stroke-linejoin="round"/><path d="M2 8h20l-2-4H4L2 8Z" stroke="var(--icon-logistics)" stroke-width="1.8" stroke-linejoin="round"/></svg>';
  var CHARGES_ICON = '<svg class="ticon" viewBox="0 0 24 24" fill="none"><rect x="2" y="7" width="16" height="10" rx="2.5" stroke="var(--icon-charged)" stroke-width="1.8"/><path d="M21 10.5v3" stroke="var(--icon-charged)" stroke-width="1.8" stroke-linecap="round"/><path d="M6 10.5v3M10 10.5v3M14 10.5v3" stroke="var(--icon-charged)" stroke-width="1.8" stroke-linecap="round"/></svg>';
  var HULL_ICON = '<svg class="ticon" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.35-9.5-9.2C.7 7.9 2.7 4 6.4 4c2 0 3.6 1.1 5.6 3.4C14 5.1 15.6 4 17.6 4c3.7 0 5.7 3.9 3.9 7.8C19 16.65 12 21 12 21Z" stroke="var(--icon-hull)" stroke-width="1.8" stroke-linejoin="round"/></svg>';
  var TECH_TYPE_ICONS = { offense: '⚔', defense: '🛡', movement: '➤', science: '⚛︎' };
  function typeIcon(key) { return TECH_TYPE_ICONS[key] || '⚔'; }
  // renders tech traits: module/deployable become tags, leftover trait text (e.g. "active 1") stays
  function traitHtml(traits) {
    var rest = String(traits || '').replace('[Module]', '').replace('[Deployable]', '').trim();
    if (!rest || rest.indexOf('Class Tech') !== -1) return '';
    return '<span>' + esc(rest) + '</span>';
  }

  function techDesc(t) {
    if (!t) return '';
    var lines = [];
    if (t.traits) lines.push('Traits: ' + t.traits);
    if (t.onbuild) lines.push('On Play: ' + t.onbuild);
    if (t.passive) lines.push('Passive: ' + t.passive);
    if (t.onactivate) lines.push('On Activate: ' + t.onactivate);
    if (!lines.length) return 'No text.';
    return lines.map(escapeHtml).join('<br>');
  }
  function modDesc(m) {
    if (!m) return '';
    var lines = [];
    if (m.req) lines.push('Requires: ' + m.req);
    if (m.onbuild) lines.push('On Play: ' + m.onbuild);
    if (m.passive) lines.push('Passive: ' + m.passive);
    if (m.onactivate) lines.push('On Activate: ' + m.onactivate);
    if (!lines.length) return 'No text.';
    return lines.map(escapeHtml).join('<br>');
  }

  function classOptions() {
    var out = [];
    var keys = Object.keys(CLASS_PRESETS);
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i], p = CLASS_PRESETS[k];
      var parts = [];
      if (p.stats) {
        Object.keys(p.stats).forEach(function (s) { parts.push('+' + p.stats[s] + ' ' + cap(s)); });
      }
      if (p.skills) {
        Object.keys(p.skills).forEach(function (s) { parts.push('+' + p.skills[s] + ' ' + s); });
      }
      var meta = [];
      if (p.techName) meta.push({ text: 'Tech: ' + p.techName, cls: 't-cyan' });
      if (p.modName) meta.push({ text: 'Mod: ' + p.modName, cls: 't-cyan' });
      if (p.crewTraits && p.crewTraits.length) meta.push({ text: 'Trait: ' + p.crewTraits.join(', '), cls: 't-amber' });
      var expand = [];
      if (p.techName) {
        var pt = findTech(p.techName);
        expand.push({ tag: 'Class Tech', name: p.techName, desc: techDesc(pt) });
      }
      if (p.modName) {
        var pm = findMod(p.modName);
        expand.push({ tag: 'Class Module', name: p.modName, desc: modDesc(pm) });
      }
      if (p.crewTraits) {
        for (var t = 0; t < p.crewTraits.length; t++) {
          var pc = findCrew(p.crewTraits[t]);
          expand.push({ tag: 'Crew Trait', name: p.crewTraits[t], desc: pc ? escapeHtml(stripTags(pc.text_description)) : '' });
        }
      }
      out.push(optionHtml('shipClass', k, k, parts.join(' · ') || 'No stat bonuses.', meta, expand));
    }
    return out.join('');
  }

  function crewOptions() {
    var out = [];
    var SK = '[Skill Increase]';
    if (!filters.cbt && nameMatch(SK) && filterTypes('science')) {
      var meta = [{ text: '⚛︎ Science', cls: 't-cyan' }, { text: '⭐ Crew Skill', cls: 't-skill' }];
      out.push(optionHtml('crew', SK, SK, '', meta, [{ tag: 'Science', name: SK, desc: crewPickHtml() }]));
    }
    for (var i = 0; i < CREW_PRESETS.length; i++) {
      var c = CREW_PRESETS[i];
      if (!nameMatch(c.name) || !filterTypes(c.type)) continue;
      if (filters.cbt && !c.combat_only) continue;
      if (filters.sk && !c.skill_increase) continue;
      var meta = [{ text: typeIcon(c.type) + ' ' + cap(c.type), cls: 't-cyan' }];
      if (c.skill_increase) meta.push({ text: '⭐ Crew Skill', cls: 't-skill' });
      if (c.combat_only) meta.push({ text: '⚔ Combat only', cls: 't-red' });
      var expand = [{ tag: cap(c.type), name: c.name, desc: escapeHtml(stripTags(c.text_description)) }];
      out.push(optionHtml('crew', c.name, c.name, '', meta, expand));
    }
    return out.join('');
  }
  function crewPickHtml() {
    var html = '<div class="sk-note">Gain a +2 to any Crew Skill (up to max 4).</div><div class="skill-pick">';
    for (var i = 0; i < SKILL_NAMES.length; i++) {
      var n = SKILL_NAMES[i];
      var on = choices.skillBoost === n;
      html += '<button type="button" class="skill-pick-btn' + (on ? ' on' : '') + '" data-boost="' + esc(n) + '">' + esc(n) + '</button>';
    }
    html += '</div>';
    return html;
  }

  function techOptions() {
    var out = [];
    for (var i = 0; i < TECH_PRESETS.length; i++) {
      var t = TECH_PRESETS[i];
      var metaTraits = t.traits || '';
      var isMod = metaTraits.indexOf('[Module]') !== -1;
      var isDep = metaTraits.indexOf('[Deployable]') !== -1;
      if (!nameMatch(t.name) || !filterTypes(t.tt)) continue;
      if (!filterVeh(isMod ? 'module' : (isDep ? 'deployable' : null))) continue;
      var st = parseInt(t.storage, 10);
      var hasCh = t.charges !== undefined && t.charges !== null && t.charges !== '' && parseInt(t.charges, 10) >= 0;
      if (filters.st && !(st > 0)) continue;
      if (filters.ch && !hasCh) continue;
      var body = traitHtml(t.traits);
      var meta = [{ text: typeIcon(t.tt) + ' ' + cap(t.tt), cls: 't-cyan' }];
      if (metaTraits.indexOf('Class Tech') !== -1) meta.push({ text: 'Class Tech', cls: 't-class-tech' });
      if (isMod) meta.push({ text: MODULE_ICON, cls: 't-cyan' });
      if (isDep) meta.push({ text: DEPLOYABLE_ICON, cls: 't-amber' });
      if (!isNaN(st) && st > 0) meta.push({ text: STORAGE_ICON + t.storage, cls: '' });
      if (hasCh) meta.push({ text: CHARGES_ICON + t.charges, cls: '' });
      var expand = [{ tag: 'Tech ' + cap(t.tt), name: t.name, desc: techDesc(t) }];
      out.push(optionHtml('tech', t.name, t.name, body, meta, expand));
    }
    return out.join('');
  }

  function modOptions() {
    var out = [];
    for (var i = 0; i < MOD_PRESETS.length; i++) {
      var m = MOD_PRESETS[i];
      if (!nameMatch(m.name) || !filterTypes(m.tt)) continue;
      if (!filterVeh(m.type)) continue;
      var lead = m.type === 'deployable' ? DEPLOYABLE_ICON : MODULE_ICON;
      var meta = [{ text: typeIcon(m.tt) + ' ' + cap(m.tt), cls: 't-cyan' }];
      if (m.hull) meta.push({ text: HULL_ICON + m.hull, cls: 't-hull' });
      var expand = [{ tag: cap(m.tt), name: m.name, desc: modDesc(m) }];
      out.push(optionHtml('mod', m.name, m.name, '', meta, expand, lead));
    }
    return out.join('');
  }

  function skillEffective(name) {
    var base = parseInt(choices.skills[name].points, 10);
    if (isNaN(base)) base = 0;
    if (choices.crew === '[Skill Increase]' && choices.skillBoost === name) return Math.min(4, base + 2);
    return base;
  }
  function skillsTotal() {
    var total = 0;
    for (var i = 0; i < SKILL_NAMES.length; i++) {
      var b = parseInt(choices.skills[SKILL_NAMES[i]].points, 10);
      if (!isNaN(b)) total += b;
    }
    return total;
  }
  function skillsOptions() {
    var out = [];
    var remaining = 13 - skillsTotal();
    out.push('<div class="sk-total">Total Points remaining: <b>' + remaining + '</b></div>');
    out.push('<div class="sk-grid">');
    for (var i = 0; i < SKILL_NAMES.length; i++) {
      var n = SKILL_NAMES[i];
      var v = choices.skills[n] || { points: '0', penalty: '' };
      var base = parseInt(v.points, 10);
      if (isNaN(base)) base = 0;
      var eff = skillEffective(n);
      var boosted = eff !== base;
      var canPlus = remaining > 0 && base < 4;
      var canMinus = base > -1;
      var desc = SKILL_DESC[n] || '';
      var infoOpen = skillInfoOpen === n && !!desc;
      out.push(
        '<div class="sk" data-skill="' + esc(n) + '">' +
        '<div class="sk-head">' +
        '<span class="sk-name">' + esc(n) + '</span>' +
        '<span class="sk-num' + (boosted ? ' boosted' : '') + '">' + esc(String(eff)) + '</span>' +
        '<span class="sk-btns">' +
        '<button type="button" class="sbtn sminus" data-d="-1" title="Decrease ' + esc(n) + '"' + (canMinus ? '' : ' disabled') + '>−</button>' +
        '<button type="button" class="sbtn splus" data-d="1" title="Increase ' + esc(n) + '"' + (canPlus ? '' : ' disabled') + '>+</button>' +
        '</span>' +
        '<span class="sk-pen">' +
        '<label>Penalty</label>' +
        '<input class="skpen-input" value="' + esc(v.penalty) + '" maxlength="3" placeholder="—" title="Skill penalty">' +
        '</span>' +
        (desc ? '<button type="button" class="skinfo' + (infoOpen ? ' on' : '') + '" title="' + esc(desc) + '"><svg class="ticon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 11.2v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="7.8" r="1.1" fill="currentColor"/></svg></button>' : '') +
        '</div>' +
        (infoOpen ? '<span class="sk-desc">' + esc(desc) + '</span>' : '') +
        '</div>'
      );
    }
    out.push('</div>');
    return out.join('');
  }

  function cap(s) {
    return String(s).charAt(0).toUpperCase() + String(s).slice(1);
  }
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function renderOptions() {
    document.getElementById('winTitle').textContent = steps[step].label;
    var k = steps[step].key;
    renderFilterBar(k);
    renderOptionsList();
  }
  function renderOptionsList() {
    var k = steps[step].key;
    var html = '';
    if (k === 'shipClass') html = classOptions();
    else if (k === 'crew') html = crewOptions();
    else if (k === 'tech') html = techOptions();
    else if (k === 'mod') html = modOptions();
    else html = skillsOptions();
    document.getElementById('winOptions').innerHTML = html;
    document.getElementById('continueBtn').disabled = (k !== 'skills' && !hasPick(k)) || (k === 'crew' && choices.crew === '[Skill Increase]' && !choices.skillBoost);
    updateProgress();
  }

  /* ===== filtering (search + icon chips) ===== */
  function nameMatch(name) {
    var q = filters.q.toLowerCase();
    return !q || String(name).toLowerCase().indexOf(q) !== -1;
  }
  function filterTypes(key) {
    return !filters.types.length || filters.types.indexOf(key) !== -1;
  }
  function filterVeh(key) {
    if (!filters.vehs.length) return true;
    return !!key && filters.vehs.indexOf(key) !== -1;
  }
  function toggleIn(arr, v) {
    var i = arr.indexOf(v);
    if (i === -1) arr.push(v); else arr.splice(i, 1);
  }
  function renderInv(k) {
    var invEl = document.getElementById('invBar');
    var inv = choices.inv && choices.inv[k];
    var names = [];
    if (inv) for (var n in inv) if (inv[n] > 0) names.push(n);
    if (k === 'shipClass' || k === 'skills' || !names.length) {
      invEl.classList.add('builder-hidden');
      invEl.innerHTML = '';
      return;
    }
    invEl.classList.remove('builder-hidden');
    var html = '';
    for (var i = 0; i < names.length; i++) {
      var c = inv[names[i]];
      html += '<button type="button" class="invchip" data-rk="' + esc(k) + '" data-rn="' + esc(names[i]) + '" title="Tap to remove one">' +
        esc(names[i]) + (c > 1 ? ' <b>(×' + c + ')</b>' : '') + '</button>';
    }
    invEl.innerHTML = html;
  }
  function filterChip(iconHtml, fKey, label, on) {
    return '<button type="button" class="ffilter' + (on ? ' on' : '') + '" data-f="' + fKey + '" title="' + esc(label) + '">' + iconHtml + '</button>';
  }
  function renderFilterBar(k) {
    renderInv(k);
    var bar = document.getElementById('filterBar');
    if (k !== 'crew' && k !== 'tech' && k !== 'mod') {
      bar.classList.add('builder-hidden');
      bar.innerHTML = '';
      return;
    }
    bar.classList.remove('builder-hidden');
    var html = '<div class="ff-row">';
    var FE = [['offense', '⚔'], ['defense', '🛡'], ['movement', '➤'], ['science', '⚛︎']];
    for (var i = 0; i < FE.length; i++) {
      html += filterChip(FE[i][1], 't:' + FE[i][0], cap(FE[i][0]) + ' type', filters.types.indexOf(FE[i][0]) !== -1);
    }
    if (k === 'tech' || k === 'mod') {
      html += '<span class="ff-div"></span>';
      html += filterChip(MODULE_ICON, 'v:module', 'Modules', filters.vehs.indexOf('module') !== -1);
      html += filterChip(DEPLOYABLE_ICON, 'v:deployable', 'Deployables', filters.vehs.indexOf('deployable') !== -1);
    }
    if (k === 'crew') {
      html += '<span class="ff-div"></span>';
      html += filterChip('⚔', 'cbt', 'Combat only', filters.cbt);
      html += filterChip('⭐', 'sk', 'Crew Skill', filters.sk);
    }
    if (k === 'tech') {
      html += '<span class="ff-div"></span>';
      html += filterChip(STORAGE_ICON, 'st', 'Has storage cost', filters.st);
      html += filterChip(CHARGES_ICON, 'ch', 'Has charges', filters.ch);
    }
    html += '</div>';
    html += '<input type="text" class="fsearch" value="' + esc(filters.q) + '" placeholder="Filter by name…">';
    bar.innerHTML = html;
  }
  function renderProgressDots() {
    var el = document.getElementById('psteps');
    var html = '';
    for (var i = 0; i < steps.length; i++) {
      var answered = !!choices[steps[i].key];
      var cls = i === step ? 'cur' : (answered ? 'done' : '');
      html += '<button type="button" class="pstep ' + cls + '" onclick="goStep(' + i + ')">' + (i + 1) + '. ' + esc(steps[i].label) + '</button>';
    }
    html += '<button type="button" class="pstep ' + (screen === 'exp' ? 'cur' : (firstUnanswered() === steps.length ? 'done' : '')) + '" onclick="goStep(' + steps.length + ')">' + (steps.length + 1) + '. Export</button>';
    el.innerHTML = html;
  }
  function goStep(i) {
    if (i === steps.length) { step = steps.length; show('exp'); renderProgressDots(); return; }
    goToWin(i);
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function updateProgress() {
    var el = document.getElementById('psteps');
    el.classList.toggle('builder-hidden', screen !== 'win' && screen !== 'exp');
    renderProgressDots();
  }

  /* ===== navigation ===== */
  function goToWin(i) {
    step = i;
    resetFilters();
    show('win');
    renderOptions();
    renderProgressDots();
  }
  function onContinue() {
    if (step < steps.length - 1) { goToWin(step + 1); }
    else { step = steps.length; show('exp'); renderProgressDots(); }
  }
  function onBack() {
    if (step > 0) { goToWin(step - 1); }
    else if (screen === 'exp') { goToWin(steps.length - 1); }
    else { show('landing'); }
  }

  document.getElementById('winOptions').addEventListener('click', function (e) {
    var addBtn = e.target.closest('.exp-add');
    if (addBtn) {
      var kk = addBtn.getAttribute('data-add');
      var wrap = e.target.closest('.opt-wrap');
      var optEl = wrap ? wrap.querySelector('.opt') : null;
      var id = optEl ? optEl.getAttribute('data-id') : null;
      if (kk && id) {
        if (!choices.inv[kk]) choices.inv[kk] = {};
        choices.inv[kk][id] = (choices.inv[kk][id] || 0) + 1;
        saveChoices();
        renderOptions();
      }
      return;
    }
    var pk = e.target.closest('.skill-pick-btn');
    if (pk) {
      choices.crew = '[Skill Increase]';
      choices.skillBoost = pk.getAttribute('data-boost');
      expandedFor.crew = '[Skill Increase]';
      saveChoices();
      renderOptions();
      return;
    }
    var info = e.target.closest('.skinfo');
    if (info) {
      var irow = e.target.closest('.sk');
      var iname = irow ? irow.getAttribute('data-skill') : null;
      if (!iname) return;
      skillInfoOpen = (skillInfoOpen === iname) ? null : iname;
      renderOptions();
      return;
    }
    var sbtn = e.target.closest('.sbtn');
    if (sbtn) {
      var row = e.target.closest('.sk');
      var name = row ? row.getAttribute('data-skill') : null;
      if (!name) return;
      var cur = parseInt(choices.skills[name].points, 10);
      if (isNaN(cur)) cur = 0;
      var d = parseInt(sbtn.getAttribute('data-d'), 10) || 0;
      var nv = Math.max(-1, Math.min(4, cur + d));
      choices.skills[name].points = String(nv);
      saveChoices();
      renderOptions();
      return;
    }
    var btn = e.target.closest('.opt');
    if (!btn) return;
    var id = btn.getAttribute('data-id');
    var k = steps[step].key;
    var wasOpen = expandedFor[k] === id;
    choices[k] = id;
    if (k === 'crew' && id !== '[Skill Increase]') choices.skillBoost = null;
    if (btn.getAttribute('data-exp')) expandedFor[k] = wasOpen ? null : id;
    saveChoices();
    renderOptions();
  });

  document.getElementById('winOptions').addEventListener('input', function (e) {
    if (steps[step].key !== 'skills') return;
    var inp = e.target.closest('.skpen-input');
    if (!inp) return;
    var row = e.target.closest('.sk');
    var name = row ? row.getAttribute('data-skill') : null;
    if (!name) return;
    choices.skills[name].penalty = inp.value;
    saveChoices();
  });

  document.getElementById('continueBtn').addEventListener('click', onContinue);
  document.getElementById('backBtn').addEventListener('click', onBack);
  document.getElementById('expBackBtn').addEventListener('click', onBack);

  document.getElementById('invBar').addEventListener('click', function (e) {
    var chip = e.target.closest('.invchip');
    if (!chip) return;
    var ik = chip.getAttribute('data-rk');
    var iname = chip.getAttribute('data-rn');
    var inv = choices.inv[ik];
    if (!inv || !inv[iname]) return;
    inv[iname] -= 1;
    if (inv[iname] <= 0) delete inv[iname];
    saveChoices();
    renderOptions();
  });
  document.getElementById('filterBar').addEventListener('click', function (e) {
    var b = e.target.closest('.ffilter');
    if (!b) return;
    var f = b.getAttribute('data-f');
    if (f.charAt(0) === 't') toggleIn(filters.types, f.slice(2));
    else if (f.charAt(0) === 'v') toggleIn(filters.vehs, f.slice(2));
    else if (f === 'st') filters.st = !filters.st;
    else if (f === 'ch') filters.ch = !filters.ch;
    else if (f === 'cbt') filters.cbt = !filters.cbt;
    else if (f === 'sk') filters.sk = !filters.sk;
    renderOptions();
  });
  document.getElementById('filterBar').addEventListener('input', function (e) {
    var s = e.target.closest('.fsearch');
    if (!s) return;
    filters.q = s.value;
    renderOptionsList();
  });

  document.getElementById('shipName').addEventListener('input', function () {
    choices.shipName = this.value;
    saveChoices();
  });

  /* ===== landing actions ===== */
  function startNew() {
    choices = emptyChoices();
    saveChoices();
    step = 0;
    goToWin(0);
  }
  function resumeRun() {
    var next = firstUnanswered();
    if (next >= steps.length) { step = steps.length; show('exp'); renderProgressDots(); return; }
    step = next;
    goToWin(step);
  }
  function loadExisting() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json,.json';
    input.onchange = function () {
      var file = input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (e) {
        try {
          var json = JSON.parse(e.target.result);
          applyLoadedSheet(json);
          startNew(false);
        } catch (err) {
          alert('Load failed: invalid JSON file.');
        }
      };
      reader.readAsText(file);
    };
    input.click();
  }
  function applyLoadedSheet(json) {
    var c = emptyChoices();
    c.shipName = (json && json.shipName) || '';
    if (json && json.shipClass && CLASS_PRESETS[json.shipClass]) c.shipClass = json.shipClass;
    if (json && json.crew && json.crew[0] && findCrew(json.crew[0].name)) {
      c.crew = json.crew[0].name;
      for (var ci = 0; ci < json.crew.length; ci++) {
        if (findCrew(json.crew[ci].name)) c.inv.crew[json.crew[ci].name] = (c.inv.crew[json.crew[ci].name] || 0) + 1;
      }
    }
    if (json && json.tech && json.tech[0] && findTech(json.tech[0].name)) {
      c.tech = json.tech[0].name;
      for (var ti = 0; ti < json.tech.length; ti++) {
        if (findTech(json.tech[ti].name)) c.inv.tech[json.tech[ti].name] = (c.inv.tech[json.tech[ti].name] || 0) + 1;
      }
    }
    if (json && json.mods && json.mods[0] && findMod(json.mods[0].name)) {
      c.mod = json.mods[0].name;
      for (var mi = 0; mi < json.mods.length; mi++) {
        if (findMod(json.mods[mi].name)) c.inv.mod[json.mods[mi].name] = (c.inv.mod[json.mods[mi].name] || 0) + 1;
      }
    }
    if (json && json.skills && typeof json.skills === 'object') {
      for (var i = 0; i < SKILL_NAMES.length; i++) {
        var n = SKILL_NAMES[i];
        var sv = json.skills[n];
        if (sv && typeof sv === 'object') {
          c.skills[n].points = (sv.points !== undefined && sv.points !== null) ? String(sv.points) : c.skills[n].points;
          c.skills[n].penalty = (sv.penalty !== undefined && sv.penalty !== null) ? String(sv.penalty) : '';
        }
      }
    }
    choices = c;
    saveChoices();
  }

  /* ===== export ===== */
  function renderExport() {
    document.getElementById('shipName').value = choices.shipName;
    var skillBoostLabel = choices.crew === '[Skill Increase]' && choices.skillBoost ? '[Skill Increase] → ' + choices.skillBoost : null;
    var html = '';

    function pickList(t, invArr, singleVal, opts) {
      var names = [];
      if (invArr) {
        for (var n in invArr) if (invArr[n] > 0) names.push(n);
      }
      var chips = '';
      if (names.length) {
        for (var i = 0; i < names.length; i++) {
          var c = invArr[names[i]];
          chips += '<span class="exp-skill">' + esc(names[i]) + (c > 1 ? ' <b>×' + c + '</b>' : '') + '</span>';
        }
      } else if (opts) {
        chips = '<span class="exp-skill">' + esc(opts) + '</span>';
      }
      html += '<div class="exp-pick exp-wide"><div class="opt-title">' + esc(t) + '</div>' +
        (chips ? '<div class="exp-skills">' + chips + '</div>' : '<div><span class="exp-none">Not chosen</span></div>') +
        '</div>';
    }

    html += '<div class="exp-pick exp-wide"><div class="opt-title">Hull Class</div><div>' +
      (choices.shipClass ? esc(choices.shipClass) : '<span class="exp-none">Not chosen</span>') + '</div></div>';
    if (skillBoostLabel) pickList('Trait / Officer (Skill Increase)', null, null, skillBoostLabel);
    pickList('Traits / Officers', choices.inv.crew, choices.crew);
    pickList('Technologies', choices.inv.tech, choices.tech);
    pickList('Modules / Deployables', choices.inv.mod, choices.mod);

    var skPts = [];
    for (var si = 0; si < SKILL_NAMES.length; si++) {
      var n = SKILL_NAMES[si];
      var v = choices.skills[n] || { points: '0', penalty: '' };
      var pen = v.penalty ? ' (' + v.penalty + ')' : '';
      skPts.push(n + ' ' + skillEffective(n) + pen);
    }
    html += '<div class="exp-pick exp-wide"><div class="opt-title">Crew Skills</div><div class="exp-skills">' +
      skPts.map(function (x) { return '<span class="exp-skill">' + esc(x) + '</span>'; }).join('') +
      '</div></div>';
    document.getElementById('expSummary').innerHTML = html;
  }

  function bumpNum(cur, delta) {
    var n = parseInt(cur, 10);
    if (isNaN(n)) n = 0;
    return String(n + delta);
  }

  function buildSheet() {
    var s = JSON.parse(JSON.stringify(SHEET_DEFAULTS));
    s.shipName = choices.shipName || '';
    s.shipClass = choices.shipClass || 'Unclassified';
    var preset = choices.shipClass ? CLASS_PRESETS[choices.shipClass] : null;
    if (preset && preset.stats) {
      var st = preset.stats || {};
      if (st.hull) { s.stats.hullCur = bumpNum(s.stats.hullCur, st.hull); s.stats.hullBase = bumpNum(s.stats.hullBase, st.hull); }
      if (st.shield) { s.stats.shieldCur = bumpNum(s.stats.shieldCur, st.shield); s.stats.shieldBase = bumpNum(s.stats.shieldBase, st.shield); }
      if (st.speed) { s.stats.speedCur = bumpNum(s.stats.speedCur, st.speed); s.stats.speedBase = bumpNum(s.stats.speedBase, st.speed); }
      if (st.storage) { s.stats.storageBase = bumpNum(s.stats.storageBase, st.storage); }
    }
    var skills = {};
    for (var si = 0; si < SKILL_NAMES.length; si++) {
      var sn = SKILL_NAMES[si];
      var cv = choices.skills[sn] || {};
      skills[sn] = {
        points: (cv.points !== undefined && cv.points !== null) ? String(cv.points) : SHEET_DEFAULTS.skills[sn],
        penalty: cv.penalty || ''
      };
    }
    if (preset && preset.skills) {
      Object.keys(preset.skills).forEach(function (name) {
        skills[name].points = bumpNum(skills[name].points, preset.skills[name]);
      });
    }
    if (choices.crew === '[Skill Increase]' && choices.skillBoost && skills[choices.skillBoost]) {
      var boost = parseInt(skills[choices.skillBoost].points, 10);
      if (isNaN(boost)) boost = 0;
      skills[choices.skillBoost].points = String(Math.min(4, boost + 2));
    }
    s.skills = skills;

    s.crew = [];
    var crew = findCrew(choices.crew);
    if (crew && !(choices.inv.crew && choices.inv.crew[crew.name])) {
      s.crew.push({
        name: crew.name,
        text: crew.text_description || '',
        combat: crew.combat_only === true,
        type: crew.type
      });
    }
    for (var cn in choices.inv.crew) {
      var cp = findCrew(cn);
      if (!cp) continue;
      for (var ck = 0; ck < choices.inv.crew[cn]; ck++) {
        s.crew.push({
          name: cp.name,
          text: cp.text_description || '',
          combat: cp.combat_only === true,
          type: cp.type
        });
      }
    }

    s.tech = [];
    for (var tn in choices.inv.tech) {
      var tech = findTech(tn);
      if (!tech) continue;
      for (var tk = 0; tk < choices.inv.tech[tn]; tk++) {
        s.tech.push({
          name: tech.name,
          traits: tech.traits || '',
          onbuild: tech.onbuild || '',
          passive: tech.passive || '',
          onactivate: tech.onactivate || '',
          techType: tech.tt || 'offense',
          storage: tech.storage || '0',
          hull: '',
          charges: tech.charges || '',
          deploy: deployKey(tech.deploy),
          state: 'deck'
        });
      }
    }
    var soloTech = findTech(choices.tech);
    if (soloTech && !choices.inv.tech[soloTech.name]) {
      s.tech.push({
        name: soloTech.name,
        traits: soloTech.traits || '',
        onbuild: soloTech.onbuild || '',
        passive: soloTech.passive || '',
        onactivate: soloTech.onactivate || '',
        techType: soloTech.tt || 'offense',
        storage: soloTech.storage || '0',
        hull: '',
        charges: soloTech.charges || '',
        deploy: deployKey(soloTech.deploy),
        state: 'deck'
      });
    }

    s.mods = [];
    for (var mn in choices.inv.mod) {
      var mod = findMod(mn);
      if (!mod) continue;
      for (var mk = 0; mk < choices.inv.mod[mn]; mk++) {
        s.mods.push({
          name: mod.name,
          req: mod.req || '',
          hull: mod.hull || '',
          duration: mod.duration || '',
          speed: mod.speed || '',
          charges: mod.charges || '',
          onbuild: mod.onbuild || '',
          passive: mod.passive || '',
          onactivate: mod.onactivate || '',
          type: mod.type || 'module',
          tt: mod.tt || 'offense',
          shape: '',
          exhaust: false
        });
      }
    }
    var soloMod = findMod(choices.mod);
    if (soloMod && !choices.inv.mod[soloMod.name]) {
      s.mods.push({
        name: soloMod.name,
        req: soloMod.req || '',
        hull: soloMod.hull || '',
        duration: soloMod.duration || '',
        speed: soloMod.speed || '',
        charges: soloMod.charges || '',
        onbuild: soloMod.onbuild || '',
        passive: soloMod.passive || '',
        onactivate: soloMod.onactivate || '',
        type: soloMod.type || 'module',
        tt: soloMod.tt || 'offense',
        shape: '',
        exhaust: false
      });
    }
    return s;
  }

  function deployKey(d) {
    if (d === 'module') return 'module';
    if (d === true || d === 'true' || d === 1 || d === '1') return 'deployable';
    if (d === 'deployable' || d === 2 || d === '2') return 'deployable';
    return 'normal';
  }

  function exportSheet() {
    var data = buildSheet();
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var name = (data.shipName || 'frigate-sheet').replace(/[^a-z0-9_-]+/gi, '_').replace(/^_+|_+$/g, '') || 'frigate-sheet';
    a.href = url;
    a.download = name + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* expose export for the inline onclick */
  window.exportSheet = exportSheet;
  window.buildSheet = buildSheet;

  /* ===== init ===== */
  choices = loadChoices();
  document.getElementById('shipName').value = choices.shipName;
  window.startNew = function () { startNew(); };
  window.loadExisting = function () { loadExisting(); };
  window.resumeRun = function () { resumeRun(); };
  window.goStep = goStep;
  show('landing');
  renderProgressDots();
})();
</script>
</body>
</html>
