<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stats Bar</title>
<link href="frigate-sheet/css/style.css" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent; }
  .sb-wrap { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  .sb {
    flex: 1 1 auto; min-height: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center; gap: 0;
    user-select: none; -webkit-user-select: none;
    background: linear-gradient(#10161f, #0c1117);
  }
  .sb-side { flex: 1; min-width: 0; height: 100%; max-height: 100%; overflow: hidden; display: flex; align-items: center; }
  .sb-left { justify-content: flex-start; padding-left: 18px; }
  .sb-right { justify-content: flex-end; padding-right: 18px; }
  .sb-center { display: flex; align-items: center; gap: 34px; height: 100%; max-height: 100%; overflow: hidden; }
  .sb-name {
    font-family: var(--disp); font-weight: 700; font-size: 17px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1;
  }
  .sb-name.empty { color: var(--ink-dim); opacity: .55; }
  .sb-dc { display: flex; align-items: center; gap: 8px; }
  .sb-dc-label {
    font-family: var(--mono); font-weight: 600; font-size: 13px; letter-spacing: .18em;
    color: var(--ink-dim);
  }
  .sb-dc-val {
    font-family: var(--mono); font-weight: 700; font-size: 21px; color: var(--icon-amber); line-height: 1;
  }
  .sb-item { display: flex; align-items: center; gap: 9px; white-space: nowrap; cursor: pointer; }
  .sb-item svg { width: 21px; height: 21px; flex: none; }
  .sb-num { font-family: var(--mono); font-weight: 700; font-size: 19px; color: var(--ink); line-height: 1; }
  .sb-sep { font-family: var(--mono); font-weight: 600; font-size: 16px; color: var(--ink-dim); line-height: 1; }
  .sb-item.hull .sb-num { color: var(--icon-hull); }
  .sb-item.shield .sb-num { color: var(--icon-shield); }
  .sb-item.energy .sb-num { color: var(--icon-energy); }
  .sb-item.speed .sb-num { color: var(--icon-cyan); }
  .sb-num, .sb-sep { position: relative; top: -1px; }
  .sb-item svg { opacity: .85; transition: opacity .12s ease, transform .12s ease; }
  .sb-item:hover svg { opacity: 1; transform: scale(1.12); }
  .sb-skills {
    flex: 0 0 auto; height: 38px;
    display: flex; align-items: center; justify-content: center; gap: 26px;
    background: #0c1117; border-top: 1px solid #1f2a38;
  }
  .sb-skills.hidden { display: none; }
  .sb-skill { display: flex; align-items: center; gap: 6px; white-space: nowrap; cursor: default; }
  .sb-skill svg { width: 15px; height: 15px; opacity: .85; }
  .sb-skill-num { font-family: var(--mono); font-weight: 700; font-size: 15px; line-height: 1; color: var(--ink); }
</style>
</head>
<body>
<div class="sb-wrap" id="sbWrap">
  <div class="sb" id="sb">
    <div class="sb-side sb-left"><span class="sb-name empty" id="sbName">SHIP NAME</span></div>
    <div class="sb-center">
      <div class="sb-item hull">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.35-9.5-9.2C.7 7.9 2.7 4 6.4 4c2 0 3.6 1.1 5.6 3.4C14 5.1 15.6 4 17.6 4c3.7 0 5.7 3.9 3.9 7.8C19 16.65 12 21 12 21Z" stroke="var(--icon-hull)" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span class="sb-num sb-cur">–</span><span class="sb-sep">/</span><span class="sb-num sb-max">–</span>
      </div>
      <div class="sb-item shield">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2 4 5v6c0 5 3.4 8.4 8 11 4.6-2.6 8-6 8-11V5l-8-3Z" stroke="var(--icon-shield)" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span class="sb-num sb-cur">–</span><span class="sb-sep">/</span><span class="sb-num sb-max">–</span>
      </div>
      <div class="sb-item energy">
        <svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" stroke="var(--icon-energy)" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span class="sb-num sb-cur">–</span><span class="sb-sep">/</span><span class="sb-num sb-max">–</span>
      </div>
      <div class="sb-item speed">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 20V5M6 11l6-6 6 6" stroke="var(--icon-cyan)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="sb-num sb-cur">–</span><span class="sb-sep">/</span><span class="sb-num sb-max">–</span>
      </div>
    </div>
    <div class="sb-side sb-right">
      <div class="sb-dc"><span class="sb-dc-label">DC</span><span class="sb-dc-val" id="sbDc">–</span></div>
    </div>
  </div>
  <div class="sb-skills hidden" id="sbSkills"></div>
</div>
<script>
(function(){
  var SKILL_META = [
    { key: 'Cyber', svg: '<svg viewBox="0 0 24 24" fill="none"><path d="M3 4h18v12H3V4Z" stroke="var(--icon-computer)" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 20h6M12 16v4" stroke="var(--icon-computer)" stroke-width="1.8" stroke-linecap="round"/></svg>' },
    { key: 'Diplomacy', svg: '<svg viewBox="0 0 24 24" fill="none"><path d="M2 9h6l3 3h2l3-3h6v3h-4l-3 3H9l-3-3H2V9Z" stroke="var(--icon-handshake)" stroke-width="1.8" stroke-linejoin="round"/></svg>' },
    { key: 'Engineering', svg: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.35-9.5-9.2C.7 7.9 2.7 4 6.4 4c2 0 3.6 1.1 5.6 3.4C14 5.1 15.6 4 17.6 4c3.7 0 5.7 3.9 3.9 7.8C19 16.65 12 21 12 21Z" stroke="var(--icon-hull)" stroke-width="1.6" stroke-linejoin="round"/></svg>' },
    { key: 'Leadership', svg: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="7.5" r="3" stroke="var(--icon-shield)" stroke-width="1.6"/><path d="M6.5 19c.7-3.2 3-5 5.5-5s4.8 1.8 5.5 5" stroke="var(--icon-shield)" stroke-width="1.6" stroke-linecap="round"/></svg>' },
    { key: 'Logistics', svg: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 8h16v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z" stroke="var(--icon-amber)" stroke-width="1.6" stroke-linejoin="round"/><path d="M2 8h20l-2-4H4L2 8Z" stroke="var(--icon-amber)" stroke-width="1.6" stroke-linejoin="round"/></svg>' },
    { key: 'Navigation', svg: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 20V5M6 11l6-6 6 6" stroke="var(--icon-cyan)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' },
    { key: 'Piloting', svg: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 4 16 6 18 10 18 14 16 18 12 20 8 18 6 14 6 10 8 6 12 4Z" stroke="var(--icon-wheel)" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 4v20M6 10l12 4M18 10 6 14" stroke="var(--icon-wheel)" stroke-width="1.8" stroke-linecap="round"/><path d="M11 11h2v2h-2z" stroke="var(--icon-wheel)" stroke-width="1.8" stroke-linejoin="round"/></svg>' },
    { key: 'Sensors', svg: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 16c2.2-3 4.9-4.5 8-4.5s5.8 1.5 8 4.5" stroke="var(--cyan)" stroke-width="1.6" stroke-linecap="round"/><path d="M7 12.5c1.4-1.8 3.1-2.7 5-2.7s3.6.9 5 2.7" stroke="var(--cyan)" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="16.5" r="1.6" fill="var(--cyan)"/></svg>' },
    { key: 'Science', svg: '<svg viewBox="0 0 24 24" fill="none"><rect x="5" y="4" width="11" height="15" rx="1.8" stroke="var(--icon-shield)" stroke-width="1.6"/><path d="M8 8h5M8 11h5M8 14h3" stroke="var(--icon-shield)" stroke-width="1.4" stroke-linecap="round"/><path d="M9 20h10V7" stroke="var(--icon-shield)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' }
  ];
  var skillEls = {};
  var skillValues = {};
  var detailOn = false;
  var skillsEl = document.getElementById('sbSkills');

  function buildSkills(){
    skillsEl.innerHTML = '';
    for (var i = 0; i < SKILL_META.length; i++) {
      (function (m) {
        var item = document.createElement('div');
        item.className = 'sb-skill';
        var icon = document.createElement('span');
        icon.innerHTML = m.svg;
        var num = document.createElement('span');
        num.className = 'sb-skill-num';
        num.textContent = '–';
        item.appendChild(icon);
        item.appendChild(num);
        skillsEl.appendChild(item);
        skillEls[m.key] = num;
      })(SKILL_META[i]);
    }
  }
  function renderSkills(){
    for (var key in skillEls) {
      var v = skillValues[key];
      var el = skillEls[key];
      if (v === undefined || v === null || isNaN(v)) {
        el.textContent = '–';
        el.className = 'sb-skill-num';
      } else {
        el.textContent = String(v);
        el.className = 'sb-skill-num';
      }
    }
  }
  function set(st, item){
    if(!st || !item) return;
    var cur = st.cur, max = st.max;
    if(typeof cur !== 'number' || isNaN(cur)) cur = '–';
    if(typeof max !== 'number' || isNaN(max)) max = '–';
    item.querySelector('.sb-cur').textContent = cur;
    item.querySelector('.sb-max').textContent = max;
  }
  function applyStats(m){
    var s = m.stats || {};
    set(s.hull,   document.querySelector('.sb-item.hull'));
    set(s.shield, document.querySelector('.sb-item.shield'));
    set(s.energy, document.querySelector('.sb-item.energy'));
    set(s.speed,  document.querySelector('.sb-item.speed'));
    if (m.skills) { skillValues = m.skills; renderSkills(); }
    var nameEl = document.getElementById('sbName');
    if(m.name && String(m.name).length){
      nameEl.textContent = m.name;
      nameEl.classList.remove('empty');
    } else {
      nameEl.textContent = 'SHIP NAME';
      nameEl.classList.add('empty');
    }
    var dcEl = document.getElementById('sbDc');
    if(m.dc !== undefined && String(m.dc) !== '') dcEl.textContent = m.dc;
  }
  var KEYS = ['hull', 'shield', 'energy', 'speed'];
  function adjust(key, delta){
    if(ch) ch.postMessage({ t: 'adjust', key: key, delta: delta });
  }
  for (var i = 0; i < KEYS.length; i++) {
    (function (key) {
      var item = document.querySelector('.sb-item.' + key);
      if (!item) return;
      item.addEventListener('click', function (e) {
        e.preventDefault();
        adjust(key, +1);
      });
      item.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        adjust(key, -1);
      });
      item.title = 'Left-click +1 — right-click −1';
    })(KEYS[i]);
  }
  window.addEventListener('message', function (e) {
    var m = e.data;
    if (!m || typeof m !== 'object' || m.t !== 'detail') return;
    detailOn = !!m.on;
    skillsEl.classList.toggle('hidden', !detailOn);
  });
  buildSkills();
  if(typeof BroadcastChannel === 'undefined') return;
  var ch = new BroadcastChannel('frigate-hull-stats');
  ch.onmessage = function(ev){
    var m = ev.data;
    if(m && m.t === 'stats') applyStats(m);
  };
  ch.postMessage({ t: 'hello', from: 'stats' });
  setInterval(function(){ ch.postMessage({ t: 'hello', from: 'stats' }); }, 2000);
})();
</script>
</body>
</html>
