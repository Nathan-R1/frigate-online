<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frigate — Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="frigate-sheet/css/style.css">
<link rel="stylesheet" href="frigate-sheet/css/frigate.css">
<style>
  body { margin:0; padding:0; height:100vh; overflow:hidden; font-family:var(--body); }
  .g-wrap { display:grid; grid-template-rows:auto 1fr auto; height:100vh; }
  .g-top { display:flex; align-items:center; gap:14px; padding:8px 14px; background:var(--panel);
           border-bottom:1px solid var(--line-bright); flex-wrap:wrap; }
  .g-turn { font-family:var(--disp); font-size:15px; letter-spacing:.08em; text-transform:uppercase; color:var(--cyan); }
  .g-btn { font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
           padding:7px 14px; cursor:pointer; background:var(--panel-alt);
           border:1px solid var(--cyan); color:var(--cyan); border-radius:6px; }
  .g-btn:hover:not(:disabled) { background:var(--cyan); color:var(--ink-strong); }
  .g-btn:disabled { opacity:.35; cursor:not-allowed; border-color:var(--line); color:var(--ink-dim); }
  .g-btn.ghost { border-color:var(--line-bright); color:var(--ink-mid); }
  /* one colour per seat, so up to four ships stay distinguishable on the board */
  :root { --p0:#4fd8c9; --p1:#d2544e; --p2:#e0a93f; --p3:#9a7ce0; }
  #barRow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .side-bar { display:flex; align-items:center; gap:9px; padding:4px 10px;
              border:1px solid var(--sc, var(--line)); color:var(--ink);
              border-radius:6px; font-family:var(--mono); font-size:11px; }
  .side-bar .sb-name { color:var(--sc, var(--ink)); font-weight:700; }
  .side-bar .sb-team { font-size:9px; letter-spacing:.1em; color:var(--ink-dim);
                       border:1px solid var(--line-bright); border-radius:3px; padding:0 4px; }
  .side-bar.turn { box-shadow:0 0 0 1px var(--sc, currentColor) inset; opacity:1; }
  .side-bar:not(.turn) { opacity:.55; }
  .side-bar.out { opacity:.3; text-decoration:line-through; }
  .side-bar b { font-size:14px; }
  .sb-hull b { color:var(--icon-hull); } .sb-sh b { color:var(--icon-shield); }
  .sb-mv b { color:var(--icon-cyan); } .sb-cards b { color:var(--icon-card); }
  .g-mid { display:grid; grid-template-columns:1fr 300px; min-height:0; }
  .g-board { position:relative; overflow:auto; background:var(--void); }
  .grid { position:relative; }
  .cells, .pieces { position:absolute; inset:0; }
  /* the pieces layer spans the whole board, so it must not eat clicks on open ground —
     only the pieces themselves take them, and everything else falls through to the cells */
  .pieces { pointer-events:none; }
  .piece { pointer-events:auto; }
  .cell { position:absolute; box-sizing:border-box; border:1px solid rgba(255,255,255,.04); }
  .cell.legal { background:rgba(79,216,201,.16); border-color:var(--cyan); cursor:pointer; }
  .cell.legal:hover { background:rgba(79,216,201,.34); }
  /* ===== pieces =====
     Silhouettes and animations come from the tabletop board; see client/game/pieces.js.
     Nothing on a piece is written out — the shape is the label, and hull lives on the
     module's card in the hand below. */
  .piece { position:absolute; box-sizing:border-box; }
  .piece .module-svg { width:100%; height:100%; display:block; overflow:visible;
    user-select:none; -webkit-user-select:none; transform-origin:50% 50%;
    filter:drop-shadow(0 0 4px var(--pc)) drop-shadow(0 0 9px var(--pc)); }
  /* deployables are small craft, not hull: three-quarter size inside a dashed berth */
  .piece.dep .module-svg { transform:scale(.68); opacity:.95;
    filter:drop-shadow(0 0 3px var(--pc)); }
  .piece.dep::before { content:''; position:absolute; inset:3px; border-radius:50%;
    border:1px dashed color-mix(in srgb, var(--pc) 55%, transparent); }
  .piece.ast .module-svg { filter:drop-shadow(0 0 4px rgba(0,0,0,.8)) saturate(.45);
    animation:astro-spin var(--astro-speed, 40s) linear infinite; }
  .piece.ast { opacity:.94; }
  .piece.clickable { cursor:pointer; }

  /* selected — the piece the pad and the arrow keys drive */
  .piece.sel { outline:2px solid var(--cyan); outline-offset:-2px;
               box-shadow:0 0 12px rgba(79,216,201,.6); border-radius:6px; }
  /* exhausted — spent for the turn */
  .piece.exh .module-svg { filter:brightness(.55) saturate(.55); }
  .piece.exh { opacity:.75; }
  /* disconnected — requirements unmet, destroyed at end of turn unless fixed */
  .piece.badreq { border:2px dotted var(--red); border-radius:6px;
                  background:rgba(176,58,58,.14); }
  /* moving — still has Move to spend this phase */
  .piece.moving { border:2px solid rgba(91,148,240,.75); border-radius:6px;
                  box-shadow:0 0 8px rgba(91,148,240,.35); }
  .piece .move-corner { position:absolute; width:9px; height:9px; opacity:0;
    border:0 solid rgba(91,148,240,.8); pointer-events:none; }
  .piece .move-corner.mc-tl { top:-1px; left:-1px; border-top-width:2px; border-left-width:2px; }
  .piece .move-corner.mc-tr { top:-1px; right:-1px; border-top-width:2px; border-right-width:2px; }
  .piece .move-corner.mc-bl { bottom:-1px; left:-1px; border-bottom-width:2px; border-left-width:2px; }
  .piece .move-corner.mc-br { bottom:-1px; right:-1px; border-bottom-width:2px; border-right-width:2px; }
  .piece.moving .move-corner { opacity:1; animation:move-corner-pulse 1.6s ease-in-out infinite; }
  .piece.moving .move-corner.mc-tr, .piece.moving .move-corner.mc-bl { animation-delay:.8s; }
  /* a legal target for the shot being resolved */
  .piece.targetable { outline:2px solid var(--amber); outline-offset:-2px;
    box-shadow:0 0 10px rgba(232,169,74,.5); border-radius:6px; cursor:pointer; }
  /* ready to activate */
  .piece.ready .module-svg { filter:drop-shadow(0 0 5px var(--pc)) drop-shadow(0 0 13px var(--pc)); }

  /* floating badges: charges top-right, Move remaining bottom-centre */
  .pc-badge { position:absolute; font-family:var(--mono); font-weight:700; font-size:9px;
    line-height:1; padding:1.5px 3px; border-radius:3px; pointer-events:none;
    background:rgba(10,16,24,.88); border:1px solid #26374a; }
  .pc-charge { top:-3px; right:-3px; color:var(--icon-cyan); border-color:rgba(79,216,201,.5);
    text-shadow:0 0 6px rgba(79,216,201,.5); }
  .pc-move { bottom:-4px; left:50%; transform:translateX(-50%); color:#9cc0ff;
    border-color:rgba(91,148,240,.55); text-shadow:0 0 6px rgba(91,148,240,.5); }
  .pc-tag { top:-3px; left:-3px; font-size:8px; letter-spacing:.02em; color:var(--pc);
    border-color:color-mix(in srgb, var(--pc) 45%, transparent); }

  .module-svg .core-pulse { animation:core-pulse 2.6s ease-in-out infinite; }
  .module-svg .blink { animation:blink-led 2.4s steps(1, end) infinite; }
  .module-svg .scan { animation:scan-sweep 3.2s ease-in-out infinite; }
  .module-svg .scan.scan-in { animation-name:scan-sweep-in; }
  .module-svg .mod-shimmer { animation:shimmer 2.2s ease-in-out infinite; }
  @keyframes core-pulse { 0%,100% { opacity:.6; } 50% { opacity:1; } }
  @keyframes blink-led { 0%,22% { opacity:1; } 30%,88% { opacity:.22; } 96%,100% { opacity:1; } }
  @keyframes scan-sweep { 0%,100% { transform:translateX(8px); } 50% { transform:translateX(36px); } }
  @keyframes scan-sweep-in { 0%,100% { transform:translateX(8px); } 50% { transform:translateX(18px); } }
  @keyframes move-corner-pulse { 0%,100% { opacity:.25; } 50% { opacity:1; } }
  @keyframes shimmer { 0%,100% { opacity:.3; } 50% { opacity:1; } }
  @keyframes astro-spin { from { transform:rotate(var(--astro-start,0deg)); }
                          to { transform:rotate(calc(var(--astro-start,0deg) + 360deg)); } }
  @media (prefers-reduced-motion: reduce) {
    .piece *, .piece { animation:none !important; }
  }

  /* ===== move phase =====
     The route preview, the beacon, the landing ping and the blocked flash are the tabletop
     board's movement graphics (client/board.css), scaled to this board's smaller cell. */
  .pathlayer { position:absolute; inset:0; pointer-events:none; z-index:3; }
  .move-path { position:absolute; left:0; top:0; overflow:visible;
    filter:drop-shadow(0 0 5px rgba(79,216,201,.6)); }
  .move-path polyline { fill:none; stroke:var(--route, var(--cyan)); stroke-linecap:round; stroke-linejoin:round; }
  .move-path .path-base { stroke-width:2.2; opacity:.5; stroke-dasharray:4 11;
    animation:path-breathe 2.2s ease-in-out infinite, path-flow .8s linear infinite; }
  .move-path .path-pulse { stroke-width:6; stroke:#cdf4ff; opacity:.95; stroke-dasharray:6 70;
    animation:path-pulse-flow 1.4s linear infinite; }
  @keyframes path-breathe { 0%,100% { opacity:.35; } 50% { opacity:.65; } }
  @keyframes path-flow { from { stroke-dashoffset:0; } to { stroke-dashoffset:-15; } }
  @keyframes path-pulse-flow { from { stroke-dashoffset:0; } to { stroke-dashoffset:-76; } }
  .move-beacon { position:absolute; width:8px; height:8px; margin:-4px 0 0 -4px; border-radius:50%;
    background:#e6fbff; box-shadow:0 0 10px rgba(79,216,201,.95); pointer-events:none; }
  .move-beacon::after { content:''; position:absolute; left:50%; top:50%; width:12px; height:12px;
    margin:-6px 0 0 -6px; border-radius:50%; border:2px solid var(--route, rgba(79,216,201,.85));
    animation:beacon-ring 1.2s ease-out infinite; }
  @keyframes beacon-ring { 0% { transform:scale(.3); opacity:1; } 100% { transform:scale(3.2); opacity:0; } }
  /* past the Move you hold, the whole preview goes red */
  .pathlayer.over .move-path { filter:drop-shadow(0 0 5px rgba(210,84,78,.6)); }
  .pathlayer.over polyline { stroke:var(--red); }
  .pathlayer.over .path-pulse { stroke:#ffb0a9; }
  .pathlayer.over .move-beacon { background:#ffc6c0; box-shadow:0 0 10px rgba(210,84,78,.95); }
  .pathlayer.over .move-beacon::after { border-color:rgba(210,84,78,.85); }
  /* cells the selected piece can still reach this turn */
  .cell.inreach { background:rgba(79,216,201,.09); border-color:rgba(79,216,201,.22); }

  .ping { position:absolute; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%;
    border:2px solid rgba(255,255,255,.65); box-shadow:0 0 10px rgba(255,255,255,.35);
    pointer-events:none; animation:pingbloom .9s ease-out forwards; }
  @keyframes pingbloom { 0% { opacity:0; transform:scale(.4); }
    40% { opacity:1; transform:scale(1.15); } 100% { opacity:0; transform:scale(1.6); } }
  .blockflash { position:absolute; border:2px solid rgba(255,70,70,.8);
    background:rgba(255,70,70,.12); animation:bf .4s ease-out forwards; pointer-events:none; }
  @keyframes bf { 0% { opacity:1; } 100% { opacity:0; } }

  .dist-readout { position:fixed; z-index:90; font-family:var(--mono); font-size:9px;
    font-weight:700; color:var(--cyan); background:rgba(10,15,22,.9); border:1px solid #22303f;
    border-radius:8px; padding:2px 5px; pointer-events:none; }
  .dist-readout.over { color:var(--red); border-color:rgba(210,84,78,.55);
    box-shadow:0 0 8px rgba(210,84,78,.4); }
  .move-counter { position:absolute; top:12px; left:12px; z-index:40; display:flex;
    align-items:center; gap:10px; background:rgba(10,15,22,.85); border:1px solid #22303f;
    border-radius:8px; padding:6px 12px; pointer-events:none; }
  .mc-label { font-family:var(--mono); font-size:10px; letter-spacing:.2em; color:var(--ink-dim);
    text-transform:uppercase; white-space:nowrap; }
  .mc-val { font-family:var(--disp); font-weight:700; font-size:22px; line-height:1;
    color:var(--cyan); text-shadow:0 0 10px rgba(79,216,201,.35); min-width:28px; text-align:center; }
  .mc-sub { font-family:var(--mono); font-size:10px; color:var(--ink-dim); white-space:nowrap; }
  .movepad { display:grid; grid-template-columns:repeat(3,30px); gap:3px; margin:6px 0; }
  .movepad button { font-family:var(--mono); font-size:12px; padding:5px 0; cursor:pointer;
                    background:var(--panel-alt); border:1px solid var(--cyan-dim); color:var(--cyan); border-radius:4px; }
  .movepad button:disabled { opacity:.25; cursor:default; }
  .movepad .sp { visibility:hidden; }
  .g-right { display:flex; flex-direction:column; border-left:1px solid var(--line-bright);
             background:var(--panel); min-height:0; }
  .g-prompt { padding:10px 12px; border-bottom:1px solid var(--line); min-height:52px; }
  .g-prompt .p-label { font-family:var(--disp); font-size:12px; text-transform:uppercase;
                       letter-spacing:.06em; color:var(--amber); margin-bottom:6px; }
  /* the log is collapsible: hidden, the right column is just the prompt panel */
  .log-head { display:flex; align-items:center; gap:8px; padding:6px 12px;
              border-bottom:1px solid var(--line); flex:none; }
  .log-head .lh-title { font-family:var(--disp); font-size:11px; text-transform:uppercase;
              letter-spacing:.08em; color:var(--ink-dim); flex:1; }
  .log-head button { font-family:var(--mono); font-size:10px; letter-spacing:.1em;
              text-transform:uppercase; padding:3px 8px; cursor:pointer; border-radius:4px;
              background:none; border:1px solid var(--line-bright); color:var(--ink-mid); }
  .log-head button:hover { border-color:var(--cyan); color:var(--cyan); }
  /* with the log gone the column only has to fit the prompt, so the board takes the rest */
  .g-mid.nolog { grid-template-columns:1fr 220px; }
  .g-mid.nolog .g-log { display:none; }
  .g-mid.nolog .g-right { flex:none; }
  .g-log { flex:1; overflow-y:auto; padding:8px 12px; font-family:var(--mono); font-size:10.5px;
           line-height:1.6; color:var(--ink-mid); }
  .g-log div { padding:1px 0; white-space:pre-wrap; }   /* keeps the roll lines indented under their attack */
  .g-log .t0 { color:var(--p0); } .g-log .t1 { color:var(--p1); }
  .g-log .t2 { color:var(--p2); } .g-log .t3 { color:var(--p3); }
  /* the hand is a user-resizable row; --hand-h is written by the drag grip */
  .g-handwrap { display:flex; flex-direction:column; height:var(--hand-h, 132px);
                min-height:64px; max-height:72vh; background:var(--panel);
                border-top:1px solid var(--line-bright); }
  .hand-grip { flex:none; height:9px; cursor:ns-resize; display:flex; align-items:center;
               justify-content:center; background:var(--panel); touch-action:none; }
  .hand-grip span { display:block; width:46px; height:3px; border-radius:2px; background:var(--line-bright); }
  .hand-grip:hover span { background:var(--cyan); }
  /* cards size themselves off the bar's height, so they stay proportional at any size */
  .g-hand { flex:1; min-height:0; container-type:size;
            display:flex; gap:8px; padding:0 14px 8px; overflow-x:auto; overflow-y:hidden;
            align-items:stretch; }
  .hcard { flex:0 0 auto; width:clamp(112px, 64cqh, 208px); height:100%;
           border:1px solid var(--line); border-radius:8px;
           padding:clamp(4px, 5cqh, 10px) clamp(5px, 6cqh, 12px);
           background:var(--panel-alt); display:flex; flex-direction:column;
           gap:clamp(2px, 3cqh, 6px); overflow:hidden; }
  .hcard .hn { font-family:var(--disp); font-size:clamp(8px, 9cqh, 14px); line-height:1.2;
               text-transform:uppercase; color:var(--ink); flex:none;
               display:flex; align-items:center; gap:5px; }
  /* the module's board silhouette, so a card and its piece are easy to match up */
  .hcard .ci { flex:none; width:clamp(12px, 13cqh, 20px); height:clamp(12px, 13cqh, 20px);
               display:block; }
  .hcard .ci .module-svg { width:100%; height:100%; display:block; overflow:visible;
               filter:drop-shadow(0 0 3px var(--pc)); }
  .hcard .ht { font-size:clamp(7px, 7.5cqh, 12px); line-height:1.35; color:var(--ink-dim);
               flex:1; min-height:0; overflow:hidden; }
  .hcard .hb { display:flex; gap:5px; flex:none; }
  .hcard .hb button { flex:1; font-family:var(--mono); font-size:clamp(6.5px, 7cqh, 11px);
                      letter-spacing:.1em; text-transform:uppercase;
                      padding:clamp(2px, 3.5cqh, 6px); cursor:pointer; border-radius:4px;
                      background:none; border:1px solid var(--cyan-dim); color:var(--cyan); }
  .hcard .hb button:disabled { opacity:.3; cursor:not-allowed; border-color:var(--line); color:var(--ink-dim); }
  .hcard.inplay { border-color:var(--amber); }
  .hcard .hmeta { font-family:var(--mono); font-size:clamp(6.5px, 6.5cqh, 11px);
                  color:var(--amber); flex:none; }
  .g-over { position:fixed; inset:0; background:rgba(0,0,0,.72); display:flex; align-items:center;
            justify-content:center; z-index:50; }
  .g-over .box { background:var(--panel-alt); border:1px solid var(--cyan); border-radius:12px;
                 padding:28px 34px; text-align:center; }
  .g-over h2 { font-family:var(--disp); color:var(--cyan); margin:0 0 14px; letter-spacing:.06em; }
  /* the inline info pip that opens a module's own text from a card, and its popup —
     the same affordance the sheet builder gives "Create Module X" */
  .mod-info { display:inline-flex; align-items:center; justify-content:center; vertical-align:-2px;
    width:14px; height:14px; margin-left:4px; padding:0; border:0; border-radius:50%;
    background:none; color:var(--cyan); cursor:pointer; line-height:1; }
  .mod-info svg { width:13px; height:13px; display:block; }
  .mod-info:hover { color:var(--amber); }
  .mp-back { position:fixed; inset:0; z-index:60; display:flex; align-items:center;
    justify-content:center; padding:20px; background:rgba(0,0,0,.6); }
  .mp-box { position:relative; width:min(460px,100%); max-height:80vh; overflow-y:auto;
    background:var(--panel-alt); border:1px solid var(--line); border-left:3px solid var(--cyan-dim);
    border-radius:10px; padding:16px 18px; display:flex; flex-direction:column; gap:10px; }
  .mp-close { position:absolute; top:10px; right:12px; width:26px; height:26px; border-radius:6px;
    cursor:pointer; background:none; border:1px solid var(--line-bright); color:var(--ink-mid);
    font-family:var(--mono); font-size:12px; line-height:1; }
  .mp-close:hover { border-color:var(--amber); color:var(--amber); }
  .mp-head { display:flex; align-items:center; gap:8px; padding-right:34px; }
  .mp-head .ci { width:20px; height:20px; flex:none; display:block; }
  .mp-head .ci svg { width:100%; height:100%; display:block; overflow:visible;
    filter:drop-shadow(0 0 3px var(--pc)); }
  .mp-name { font-family:var(--disp); font-size:14px; letter-spacing:.04em; color:var(--ink);
    text-transform:uppercase; }
  .mp-meta { font-family:var(--mono); font-size:10.5px; color:var(--amber);
    display:flex; gap:10px; flex-wrap:wrap; }
  .mp-desc { color:var(--ink-mid); font-size:12.5px; line-height:1.55; white-space:pre-line; }
  .hidden { display:none !important; }
  /* new-game roster */
  #modePick .box { min-width:min(92vw, 480px); text-align:left; }
  .rost-count { display:flex; gap:8px; margin:0 0 14px; }
  .rost-row { display:grid; grid-template-columns:1.1fr 1fr 1fr auto; gap:8px; align-items:center;
              padding:6px 0; border-top:1px solid var(--line); }
  .rost-row .rn { font-family:var(--mono); font-size:11.5px; font-weight:700; color:var(--sc, var(--cyan));
                  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rost-row .rn small { display:block; font-weight:400; font-size:9.5px; color:var(--ink-dim);
                        letter-spacing:.04em; }
  .rost-edit { display:flex; align-items:center; justify-content:center; width:28px; height:28px;
               padding:0; cursor:pointer; border-radius:5px; background:none;
               border:1px solid var(--line-bright); color:var(--ink-mid); }
  .rost-edit:hover { border-color:var(--cyan); color:var(--cyan); }
  .rost-edit svg { width:14px; height:14px; display:block; }
  .rost-row select { width:100%; font-family:var(--mono); font-size:11px; padding:5px 6px;
                     background:var(--panel); color:var(--ink); border:1px solid var(--line-bright);
                     border-radius:5px; }
  .rost-note { font-size:11px; color:var(--ink-dim); margin:12px 0 0; }
  @media (max-width:520px) { .rost-row { grid-template-columns:1fr 1fr auto; }
    .rost-row .rn { grid-column:1 / -1; } }
</style>
</head>
<body>
<div class="g-wrap">
  <div class="g-top">
    <span class="g-turn" id="turnLabel">—</span>
    <span id="barRow"></span>
    <span style="flex:1"></span>
    <span class="g-turn" id="phaseLabel" style="color:var(--amber)"></span>
    <button type="button" class="g-btn ghost" id="newBtn">New Game</button>
    <button type="button" class="g-btn" id="playPhaseBtn">End Play Phase</button>
    <button type="button" class="g-btn" id="endBtn">End Turn</button>
  </div>
  <div class="g-mid">
    <div class="g-board" id="boardWrap"><div class="grid" id="grid"></div>
      <div class="move-counter hidden" id="moveCounter">
        <span class="mc-label">Move</span><span class="mc-val" id="mcVal">0</span>
        <span class="mc-sub" id="mcSub"></span>
      </div>
    </div>
    <div class="g-right">
      <div class="g-prompt" id="promptPanel"></div>
      <div class="log-head">
        <span class="lh-title">Log</span>
        <button type="button" id="logToggle">Hide</button>
      </div>
      <div class="g-log" id="logPanel"></div>
    </div>
  </div>
  <div class="g-handwrap" id="handWrap">
    <div class="hand-grip" id="handGrip" title="Drag to resize the hand"><span></span></div>
    <div class="g-hand" id="hand"></div>
  </div>
</div>
<div class="mp-back hidden" id="modPop"><div class="mp-box" role="dialog" aria-modal="true"
     aria-labelledby="modPopName">
  <button type="button" class="mp-close" id="modPopClose" title="Close">&#10005;</button>
  <div class="mp-head"><span class="ci" id="modPopIcon"></span><span class="mp-name" id="modPopName"></span></div>
  <div class="mp-meta" id="modPopMeta"></div>
  <div class="mp-desc" id="modPopDesc"></div>
</div></div>
<div class="dist-readout hidden" id="distReadout"></div>
<div class="g-over hidden" id="modePick"><div class="box">
  <h2>New Game</h2>
  <div class="rost-count" id="rostCount">
    <button type="button" class="g-btn" data-count="2">2 Players</button>
    <button type="button" class="g-btn ghost" data-count="3">3 Players</button>
    <button type="button" class="g-btn ghost" data-count="4">4 Players</button>
  </div>
  <div id="rostRows"></div>
  <p class="rost-note hidden" id="rostWarn" style="color:var(--red)">
     Put at least two seats on different teams.</p>
  <p class="rost-note">Seats sharing a team win and lose together. Give everyone their own
     team for a free-for-all — the game ends when only one team still has a Core.</p>
  <p style="margin:16px 0 0"><button type="button" class="g-btn" id="startBtn">Start</button></p>
</div></div>
<div class="g-over hidden" id="overlay"><div class="box">
  <h2 id="overTitle">—</h2><button type="button" class="g-btn" onclick="location.reload()">Play again</button>
</div></div>

<script src="frigate-sheet/presets/tech-presets.js"></script>
<script src="frigate-sheet/presets/mod-presets.js"></script>
<script src="frigate-sheet/presets/card-effects.js"></script>
<script src="game/engine.js"></script>
<script src="game/pieces.js"></script>
<script src="game/ai/ai-knowledge.js"></script>
<script src="game/ai/ai-path.js"></script>
<script src="game/ai/ai-placement.js"></script>
<script src="game/ai/ai-doctrine.js"></script>
<script src="game/ai/ai-commander.js"></script>
<script>
(function () {
  'use strict';
  var CELL = 30;
  var selMod = null;   /* which of my modules the move controls drive */
  /* one colour per seat. The SVG shapes need real hex to derive their fills and detail
     lines, so these are the source of truth and --p0..--p3 in the stylesheet mirror them. */
  var SEAT_HEX = ['#4fd8c9', '#d2544e', '#e0a93f', '#9a7ce0'];
  var TEAM_LETTER = ['A', 'B', 'C', 'D'];

  /* The roster: one entry per seat, in turn order. `ai` hands that seat to the commander,
     `team` groups seats that win and lose together. Two seats on two teams is the old
     one-versus-one game; four seats on two teams is a pairs match. */
  var SEATS = [{ team:0, ai:false }, { team:1, ai:true }];

  /* ===== seat sheets =====
     A seat may carry a build made in the sheet builder. We keep the finished sheet, which is
     what the game plays with, alongside the builder's own choices, which is what lets the
     build be reopened and edited rather than rebuilt from scratch. The roster itself is
     remembered too, so sending the browser off to the builder and back does not lose a
     four-player setup. */
  var GAME_SEATS_KEY = 'frigateGameSeats';
  var GAME_ROSTER_KEY = 'frigateGameRoster';
  var SEAT_REQUEST_KEY = 'frigateBuilderRequest';
  var BUILDER_URL = 'sheet-builder/sheet-builder.html';

  function readStore(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  function writeStore(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }

  var seatSheets = readStore(GAME_SEATS_KEY, []);
  if (!Array.isArray(seatSheets)) seatSheets = [];
  (function restoreRoster() {
    var r = readStore(GAME_ROSTER_KEY, null);
    if (!Array.isArray(r) || r.length < 2 || r.length > 4) return;
    SEATS = r.map(function (x, i) {
      return { team: (typeof x.team === 'number') ? x.team : i, ai: !!x.ai };
    });
  })();

  function sheetOf(i) { return (seatSheets[i] && seatSheets[i].sheet) || null; }

  /* how much hull this sheet brings to the table before the first turn */
  function starterCount(sh) {
    return (sh && sh.tech || []).filter(function (t) { return Engine.cardIsStarter(t); }).length;
  }

  /* Hand the seat's build over to the builder and go there. The choices travel, not the
     sheet: they are the builder's own state, so the run picks up exactly where it stopped
     and "Create new character" still scraps it cleanly. */
  function editSeat(i) {
    writeStore(GAME_ROSTER_KEY, SEATS);
    writeStore(SEAT_REQUEST_KEY, {
      seat: i, label: 'Player ' + (i + 1),
      choices: (seatSheets[i] && seatSheets[i].choices) || null,
      /* A seat that has never been built still opens on something: the stock frigate it
         would otherwise fly, so the builder has a sheet to modify rather than a blank run. */
      sheet: sheetOf(i) || stockSheet(i),
      ret: window.location.pathname + window.location.search
    });
    window.location.href = BUILDER_URL;
  }

  /* The default kit as a sheet the builder can load — only the card names matter, the rest
     it derives from the presets itself. */
  function stockSheet(i) {
    return {
      shipName: '',
      tech: starterDeck().map(function (n) { return { name: n }; }),
      mods: LOADOUTS[i % LOADOUTS.length].map(function (n) { return { name: n }; })
    };
  }
  /* whichever local seat the controls and hand currently belong to */
  var VIEW = 0;

  function isAI(i) { return !!(SEATS[i] && SEATS[i].ai); }
  function localSeats() {
    return SEATS.map(function (x, i) { return i; }).filter(function (i) { return !isAI(i); });
  }
  /* Control belongs to the active seat while it is a local one; when the computer is
     thinking we keep showing the last human seat so its hand does not vanish. */
  function meIdx() {
    var G = Engine.get();
    if (G && !isAI(G.active)) return G.active;
    return VIEW;
  }
  function sideName(i) {
    var sh = sheetOf(i);
    var base = (sh && sh.shipName) ? sh.shipName : 'Player ' + (i + 1);
    return base + (isAI(i) ? ' (AI)' : '');
  }
  function teamOf(i) { return SEATS[i] ? SEATS[i].team : i; }
  var gridEl = document.getElementById('grid');
  var handEl = document.getElementById('hand');
  var logEl  = document.getElementById('logPanel');
  var promptEl = document.getElementById('promptPanel');

  /* a starting deck drawn from the presets, plus the modules a core option would grant */
  function starterDeck() {
    return ['Cannon Unit','Cannon Unit','P.D. Unit','Graviton Unit','Shield Generator',
            'Grav Jet','Rocket Array','Boost','Dynamo','Torpedo Launcher','Armor Unit','Thrust Unit'];
  }
  /* each seat opens with a slightly different hull so the board does not look mirrored */
  var LOADOUTS = [['Cannon','P.D.','Graviton Engine'],
                  ['Cannon','Armor','Thrust Engine'],
                  ['Cannon','P.D.','Thrust Engine'],
                  ['Cannon','Armor','Graviton Engine']];
  /* What a seat brings to the table: its own build if it has one, the stock frigate if not.
     Deployables in a sheet are things its cards create, not hull the ship starts with, so
     only real modules are placed on the board. */
  function seatConfig(i, seat) {
    var base = { name: sideName(i), team: seat.team, ai: seat.ai,
                 deck: starterDeck(), modules: LOADOUTS[i % LOADOUTS.length] };
    var sh = sheetOf(i);
    if (!sh) return base;
    /* carry each copy's own traits through, so a promoted Cannon Unit deploys before combat
       while its unpromoted siblings stay in the deck */
    var deck = (sh.tech || []).filter(function (t) { return !!Engine.findTech(t.name); })
      .map(function (t) { return { name: t.name, traits: t.traits }; });
    var skills = {};
    Object.keys(sh.skills || {}).forEach(function (k) {
      skills[k] = parseInt((sh.skills[k] || {}).points, 10) || 0;
    });
    if (deck.length) base.deck = deck;
    if (Object.keys(skills).length) base.skills = skills;
    /* A built ship deploys the Starter Cards in its own deck, so it gets no pre-placed hull
       here. The sheet's `mods` list is not a loadout — the builder fills it with every module
       the deck could ever create, for stat-block reference. */
    base.modules = [];
    return base;
  }

  function start() {
    selMod = null;
    AICommander.reset();
    document.getElementById('modePick').classList.add('hidden');
    writeStore(GAME_ROSTER_KEY, SEATS);
    VIEW = localSeats().length ? localSeats()[0] : 0;
    Engine.newGame(SEATS.map(function (seat, i) { return seatConfig(i, seat); }));
  }

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  /* ---------- rendering ---------- */
  /* Keep the hand and controls on a seat that still exists: the active local seat while one
     is playing, otherwise the last human seat, and a surviving one once that seat is out. */
  function syncView(G) {
    if (!isAI(G.active) && !G.players[G.active].dead) { VIEW = G.active; return; }
    if (G.players[VIEW] && !G.players[VIEW].dead) return;
    var live = localSeats().filter(function (i) { return G.players[i] && !G.players[i].dead; });
    if (!live.length) live = G.players.filter(function (s) { return !s.dead; })
                                      .map(function (s) { return s.idx; });
    if (live.length) VIEW = live[0];
  }

  function render(G) {
    if (!G) return;
    syncView(G);
    renderTop(G); renderBoard(G); renderHand(G); renderLog(G); renderPrompt(G);
    document.getElementById('overlay').classList.toggle('hidden', !G.over);
    if (G.over) document.getElementById('overTitle').textContent = overText(G);
  }

  function overText(G) {
    var w = G.over.winners || [];
    if (!w.length) return 'Everyone is destroyed';
    var mine = w.filter(function (i) { return !isAI(i); });
    /* a single human in the game gets the personal verdict; otherwise name the winners */
    if (localSeats().length === 1)
      return mine.length ? 'You win' : 'You lose';
    return w.map(function (i) { return sideName(i); }).join(' and ') +
           (w.length > 1 ? ' win' : ' wins');
  }

  function bar(s, G) {
    var core = s.modules[s.coreId];
    return '<span class="sb-name">' + esc(s.name) + '</span>' +
      '<span class="sb-team">TEAM ' + (TEAM_LETTER[teamOf(s.idx)] || (teamOf(s.idx) + 1)) + '</span>' +
      '<span class="sb-hull">HULL <b>' + (core ? core.hull : 0) + '</b></span>' +
      '<span class="sb-sh">SH <b>' + s.shield + '</b>/' + s.shieldMax + '</span>' +
      '<span class="sb-mv">MV <b>' + s.moveLeft + '</b></span>' +
      '<span class="sb-cards">HAND <b>' + s.hand.length + '</b></span>' +
      '<span>PLAYS <b>' + s.playsLeft + '</b></span>';
  }
  function renderTop(G) {
    document.getElementById('turnLabel').textContent =
      'Turn ' + G.turn + ' — ' + G.players[G.active].name;
    document.getElementById('turnLabel').style.color = SEAT_HEX[G.active % 4];
    document.getElementById('barRow').innerHTML = G.players.map(function (s, i) {
      return '<span class="side-bar' + (G.active === i ? ' turn' : '') + (s.dead ? ' out' : '') +
             '" style="--sc:' + SEAT_HEX[i % 4] + '">' + bar(s, G) + '</span>';
    }).join('');
    var mine = G.active === meIdx() && !G.pending && !G.over;
    document.getElementById('endBtn').disabled = !mine || G.phase === 'play';
    var pb = document.getElementById('playPhaseBtn');
    pb.disabled = !mine || G.phase !== 'play';
    pb.classList.toggle('ghost', G.phase !== 'play');
    document.getElementById('phaseLabel').textContent =
      G.phase === 'play' ? 'PLAY PHASE' : (G.phase === 'action' ? 'ACTION PHASE' : '');
  }

  /* ---------- board ----------
     Two layers: a static grid of cells that only ever has its highlight class toggled, and a
     pieces layer that is diffed by object id. Rebuilding the pieces every frame would restart
     every rotation and pulse, so nodes are reused and only their classes and badges change. */
  var cellsEl = null, piecesEl = null, pathEl = null, pathBase = null, pathPulse = null,
      beaconEl = null, fxEl = null;
  /* the route another player has announced but not yet walked */
  var telegraphed = null;
  /* shapes of yours that currently hold more than one kind of module */
  var ambiguous = {};

  function ensureLayers(n) {
    if (cellsEl) return;
    var px = n * CELL;
    gridEl.style.width = gridEl.style.height = px + 'px';
    cellsEl = document.createElement('div');
    cellsEl.className = 'cells';
    var html = '';
    for (var y = 0; y < n; y++) for (var x = 0; x < n; x++)
      html += '<div class="cell" style="left:' + (x*CELL) + 'px;top:' + (y*CELL) +
              'px;width:' + CELL + 'px;height:' + CELL + 'px" data-x="' + x + '" data-y="' + y + '"></div>';
    cellsEl.innerHTML = html;
    piecesEl = document.createElement('div');
    piecesEl.className = 'pieces';
    /* the route preview and the one-shot flashes sit above the pieces but take no clicks */
    pathEl = document.createElement('div');
    pathEl.className = 'pathlayer';
    pathEl.innerHTML =
      '<svg class="move-path" width="' + px + '" height="' + px + '">' +
      '<polyline class="path-base"></polyline><polyline class="path-pulse"></polyline></svg>' +
      '<div class="move-beacon hidden"></div>';
    fxEl = document.createElement('div');
    fxEl.className = 'pathlayer';
    gridEl.appendChild(cellsEl);
    gridEl.appendChild(piecesEl);
    gridEl.appendChild(pathEl);
    gridEl.appendChild(fxEl);
    pathBase = pathEl.querySelector('.path-base');
    pathPulse = pathEl.querySelector('.path-pulse');
    beaconEl = pathEl.querySelector('.move-beacon');
  }

  /* ---------- movement preview ----------
     A module may step onto empty ground or over a deployable, which it destroys; anything
     else stops it. BFS gives the shortest legal route, and the preview shows it whether or
     not this turn's Move covers the whole thing. */
  function passable(x, y) {
    var n = Engine.RULES.boardSize;
    if (x < 0 || y < 0 || x >= n || y >= n) return false;
    var c = Engine.cellAt(x, y);
    return !c || c.kind === 'deployable';
  }
  function routeTo(from, tx, ty) {
    if (from.x === tx && from.y === ty) return [{ x: from.x, y: from.y }];
    if (!passable(tx, ty)) return null;
    var seen = {}, q = [{ x: from.x, y: from.y, prev: null }], head = 0;
    seen[from.x + ',' + from.y] = 1;
    var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    while (head < q.length) {
      var cur = q[head++];
      for (var i = 0; i < 4; i++) {
        var nx = cur.x + dirs[i][0], ny = cur.y + dirs[i][1], k = nx + ',' + ny;
        if (seen[k] || !passable(nx, ny)) continue;
        seen[k] = 1;
        var node = { x: nx, y: ny, prev: cur };
        if (nx === tx && ny === ty) {
          var out = [];
          for (var m = node; m; m = m.prev) out.unshift({ x: m.x, y: m.y });
          return out;
        }
        q.push(node);
      }
    }
    return null;
  }

  /* the piece the movement controls are pointed at, and how far it may still go */
  function mover(G) {
    var p = G.pending;
    if (!p || G.active !== meIdx()) return null;   /* never your movement on another turn */
    if (p.kind === 'moveObject') {
      var d = G.players[meIdx()].deployables[p.objId];
      return d ? { obj: d, left: p.left } : null;
    }
    if (p.kind === 'move' && selMod) {
      var m = G.players[meIdx()].modules[selMod];
      return m ? { obj: m, left: m.moveLeft } : null;
    }
    return null;
  }

  var hoverCell = null;
  function drawPoly(route, over) {
    var pts = route.map(function (c) {
      return (c.x * CELL + CELL / 2) + ',' + (c.y * CELL + CELL / 2); }).join(' ');
    pathBase.setAttribute('points', pts);
    pathPulse.setAttribute('points', pts);
    pathEl.classList.toggle('over', !!over);
    var last = route[route.length - 1];
    beaconEl.style.left = (last.x * CELL + CELL / 2) + 'px';
    beaconEl.style.top = (last.y * CELL + CELL / 2) + 'px';
    beaconEl.classList.remove('hidden');
  }
  function drawRoute(G) {
    /* another player's announced move owns the path layer while it is showing */
    if (telegraphed) { drawPoly(telegraphed, false); distEl.classList.add('hidden'); return telegraphed; }
    var mv = mover(G);
    if (!mv || !hoverCell) return clearRoute();
    var route = routeTo(mv.obj, hoverCell.x, hoverCell.y);
    if (!route || route.length < 2) return clearRoute();
    drawPoly(route, route.length - 1 > mv.left);
    showDist(route.length - 1, mv.left, route.length - 1 > mv.left);
    return route;
  }
  function clearRoute() {
    if (!pathBase) return null;
    pathBase.setAttribute('points', '');
    pathPulse.setAttribute('points', '');
    pathEl.classList.remove('over');
    beaconEl.classList.add('hidden');
    distEl.classList.add('hidden');
    return null;
  }
  var distEl = document.getElementById('distReadout');
  var lastPointer = { x: 0, y: 0 };
  function showDist(cost, left, over) {
    distEl.textContent = cost + ' / ' + left;
    distEl.classList.toggle('over', over);
    distEl.classList.remove('hidden');
    distEl.style.left = (lastPointer.x + 14) + 'px';
    distEl.style.top = (lastPointer.y + 14) + 'px';
  }

  /* one-shot flourishes: a ring where a piece lands, a red flash where it cannot go */
  function ping(x, y) {
    if (!fxEl) return;
    var d = document.createElement('div');
    d.className = 'ping';
    d.style.left = (x * CELL + CELL / 2) + 'px';
    d.style.top = (y * CELL + CELL / 2) + 'px';
    fxEl.appendChild(d);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 900);
  }
  function blockFlash(x, y) {
    if (!fxEl) return;
    var d = document.createElement('div');
    d.className = 'blockflash';
    d.style.left = (x * CELL) + 'px'; d.style.top = (y * CELL) + 'px';
    d.style.width = CELL + 'px'; d.style.height = CELL + 'px';
    fxEl.appendChild(d);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 420);
  }

  function renderBoard(G) {
    ensureLayers(Engine.RULES.boardSize);
    syncSelection(G);
    paintCells(G);
    paintPieces(G);
    renderMoveHud(G);
    drawRoute(G);
  }

  /* the Move counter from the tabletop board: what the selected piece has left, and what
     the rest of the fleet still has banked */
  function renderMoveHud(G) {
    var mc = document.getElementById('moveCounter');
    var mv = mover(G);
    if (!mv) { mc.classList.add('hidden'); return; }
    mc.classList.remove('hidden');
    document.getElementById('mcVal').textContent = mv.left;
    var s = G.players[meIdx()];
    var rest = Object.keys(s.modules).reduce(function (a, i) {
      return a + (i === selMod ? 0 : s.modules[i].moveLeft); }, 0);
    document.getElementById('mcSub').textContent =
      G.pending.kind === 'move' ? esc(mv.obj.name) + (rest ? ' · ' + rest + ' left on other modules' : '')
                                : esc(mv.obj.name);
  }

  /* Who the movement controls point at. This has to settle before anything is painted: the
     reachable shading, the counter and the route preview all read it, and a hand-off decided
     halfway through a repaint would leave them describing the module that just stopped. */
  function syncSelection(G) {
    var mine = G.players[meIdx()].modules;
    if (selMod && !mine[selMod]) selMod = null;
    if (walking) return;
    /* the selection only exists for the duration of a move prompt — otherwise the last piece
       moved keeps its selection ring long after the movement is over */
    if (!G.pending || G.pending.kind !== 'move') { selMod = null; return; }
    /* pass the controls to the next module with Move left once this one is spent, so the
       whole fleet can be moved without reselecting after every module */
    if (!selMod || mine[selMod].moveLeft <= 0)
      selMod = Object.keys(mine).filter(function (i) { return mine[i].moveLeft > 0; })[0] || selMod;
  }

  function paintCells(G) {
    var p = G.pending;
    var legal = (p && p.kind === 'space' && p.filter) ? p.filter : null;
    var reach = reachSet(G);
    var kids = cellsEl.children;
    for (var i = 0; i < kids.length; i++) {
      var c = kids[i], x = +c.getAttribute('data-x'), y = +c.getAttribute('data-y');
      var ok = !!legal && legal(x, y);
      if (ok !== c.classList.contains('legal')) c.classList.toggle('legal', ok);
      var inr = !!reach && reach[x + ',' + y] === true;
      if (inr !== c.classList.contains('inreach')) c.classList.toggle('inreach', inr);
    }
  }

  /* every square the piece being moved can still reach with the Move it holds */
  function reachSet(G) {
    var mv = mover(G);
    if (!mv || mv.left <= 0) return null;
    var seen = {}, q = [{ x: mv.obj.x, y: mv.obj.y, d: 0 }], head = 0;
    seen[mv.obj.x + ',' + mv.obj.y] = false;
    var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    while (head < q.length) {
      var cur = q[head++];
      if (cur.d >= mv.left) continue;
      for (var i = 0; i < 4; i++) {
        var nx = cur.x + dirs[i][0], ny = cur.y + dirs[i][1], k = nx + ',' + ny;
        if (k in seen || !passable(nx, ny)) continue;
        seen[k] = true;
        q.push({ x: nx, y: ny, d: cur.d + 1 });
      }
    }
    return seen;
  }

  /* everything on the board this frame, in draw order: rocks first, then hulls on top */
  function boardObjects(G) {
    var out = [];
    Object.keys(G.asteroids || {}).forEach(function (id) {
      var a = G.asteroids[id];
      out.push({ id: id, o: a, kind: 'ast', shape: 'asteroid', color: '#6a7077' });
    });
    Object.keys(G.cells).forEach(function (k) {
      var c = G.cells[k];
      if (c.kind !== 'anomaly') return;
      var xy = k.split(',');
      out.push({ id: 'anom:' + k, o: { x: +xy[0], y: +xy[1] }, kind: 'anom',
                 shape: 'circle', color: '#b060e0' });
    });
    G.players.forEach(function (s, si) {
      Object.keys(s.modules).forEach(function (id) {
        var m = s.modules[id];
        out.push({ id: id, o: m, kind: 'mod', side: s, si: si,
                   shape: GamePieces.shapeOf(m.name, id === s.coreId), color: SEAT_HEX[si % 4] });
      });
      Object.keys(s.deployables).forEach(function (id) {
        var d = s.deployables[id];
        out.push({ id: id, o: d, kind: 'dep', side: s, si: si,
                   shape: GamePieces.shapeOf(d.name, false), color: SEAT_HEX[si % 4] });
      });
    });
    return out;
  }

  function buildPiece(rec) {
    var d = document.createElement('div');
    d.setAttribute('data-obj', rec.id);
    d.style.width = d.style.height = CELL + 'px';
    d.style.setProperty('--pc', rec.color);
    if (rec.shape === 'asteroid') {
      var seed = GamePieces.hash(rec.id);
      d.style.setProperty('--astro-start', Math.floor(seed * 360) + 'deg');
      d.style.setProperty('--astro-speed', (28 + seed * 42).toFixed(0) + 's');
      d.appendChild(GamePieces.build('asteroid', rec.color, seed));
    } else {
      d.appendChild(GamePieces.build(rec.shape, rec.color));
    }
    ['mc-tl','mc-tr','mc-bl','mc-br'].forEach(function (k) {
      var sp = document.createElement('span');
      sp.className = 'move-corner ' + k;
      d.appendChild(sp);
    });
    var tg = document.createElement('span'); tg.className = 'pc-badge pc-tag'; d.appendChild(tg);
    var ch = document.createElement('span'); ch.className = 'pc-badge pc-charge'; d.appendChild(ch);
    var mv = document.createElement('span'); mv.className = 'pc-badge pc-move'; d.appendChild(mv);
    return d;
  }

  function paintPiece(d, rec, G) {
    var o = rec.o, p = G.pending;
    d.style.left = (o.x * CELL) + 'px';
    d.style.top  = (o.y * CELL) + 'px';
    var cls = 'piece ' + rec.kind;
    var targetIds = (p && p.kind === 'target') ? p.targets : [];
    if (targetIds.indexOf(rec.id) >= 0) cls += ' targetable';
    if (rec.kind === 'mod' || rec.kind === 'dep') {
      var mine = rec.si === meIdx();
      var fx = Engine.fx(o.name, 'mod');
      if (o.exhausted) cls += ' exh';
      if (rec.kind === 'mod' && !Engine.meetsReq(rec.side, o)) cls += ' badreq';
      /* movement state only means anything while a move prompt is open */
      if (mine && p && p.kind === 'move' && o.moveLeft > 0) cls += ' moving';
      if (mine && rec.id === selMod && p && p.kind === 'move') cls += ' sel';
      if (p && p.kind === 'moveObject' && p.objId === rec.id) cls += ' sel moving';
      var canAct = mine && G.phase === 'action' && !p && !o.exhausted && !!fx.activate &&
                   Engine.affordable(rec.side, o, rec.kind === 'dep' ? 'dep' : 'mod');
      if (canAct) cls += ' ready clickable';
      if (mine && p && p.kind === 'move') cls += ' clickable';
    }
    d.className = cls;
    /* the board carries no text, so the name and hull live in the hover title */
    d.title = rec.kind === 'ast' ? 'Asteroid — hull ' + o.hull
            : rec.kind === 'anom' ? 'Anomaly'
            : rec.side.name + ' — ' + o.name + ' — hull ' + o.hull + '/' + (o.hullMax || o.hull);
    var tg = d.querySelector('.pc-tag');
    var tag = (rec.si === meIdx() && ambiguous[rec.shape]) ? shortName(o.name) : '';
    tg.textContent = tag;
    tg.style.display = tag ? '' : 'none';
    var ch = d.querySelector('.pc-charge'), mv = d.querySelector('.pc-move');
    var charges = o.charges || 0;
    ch.textContent = charges ? '⚡' + charges : '';
    ch.style.display = charges ? '' : 'none';
    /* Move remaining is only shown while you are actually moving pieces */
    var showMv = p && (p.kind === 'move' || p.kind === 'moveObject') &&
                 rec.si === meIdx() && o.moveLeft > 0;
    mv.textContent = showMv ? o.moveLeft : '';
    mv.style.display = showMv ? '' : 'none';
  }

  /* "Cann", "P.D.", "TE", "GE" — a multi-word name goes to its initials, a single word to
     its first four letters */
  function shortName(n) {
    var w = n.split(' ');
    return w.length > 1 ? w.map(function (x) { return x[0]; }).join('') : n.slice(0, 4);
  }

  /* On your own turn, name your pieces only where the silhouette is not enough: two Cannons
     need no labels, but a Cannon beside a P.D. does. Keyed by shape, so the tags appear
     exactly on the groups you cannot tell apart at a glance. */
  function ambiguousShapes(G) {
    if (G.active !== meIdx()) return {};
    var byShape = {}, out = {};
    var s = G.players[meIdx()];
    ['modules', 'deployables'].forEach(function (bag) {
      Object.keys(s[bag]).forEach(function (id) {
        var o = s[bag][id], sh = GamePieces.shapeOf(o.name, id === s.coreId);
        (byShape[sh] = byShape[sh] || {})[o.name] = true;
      });
    });
    Object.keys(byShape).forEach(function (sh) {
      if (Object.keys(byShape[sh]).length > 1) out[sh] = true;
    });
    return out;
  }

  function paintPieces(G) {
    var recs = boardObjects(G);
    ambiguous = ambiguousShapes(G);
    /* drop nodes whose object is gone, then place the rest in order, reusing what is there */
    var want = {};
    recs.forEach(function (r) { want[r.id] = r; });
    var kids = piecesEl.children;
    for (var k = kids.length - 1; k >= 0; k--) {
      var id = kids[k].getAttribute('data-obj');
      if (!want[id]) piecesEl.removeChild(kids[k]);
    }
    var byId = {};
    for (var i = 0; i < piecesEl.children.length; i++)
      byId[piecesEl.children[i].getAttribute('data-obj')] = piecesEl.children[i];
    recs.forEach(function (rec, idx) {
      var node = byId[rec.id] || buildPiece(rec);
      var ref = piecesEl.children[idx];
      if (ref !== node) piecesEl.insertBefore(node, ref || null);
      paintPiece(node, rec, G);
    });
  }

  function renderHand(G) {
    var s = G.players[meIdx()], html = '';
    var mine = G.active === meIdx() && !G.pending && !G.over;
    var canPlay = mine && G.phase === 'play';
    var myTurn = mine && G.phase === 'action';
    s.hand.forEach(function (id) {
      var c = s.cards[id], t = Engine.findTech(c.name) || {};
      html += '<div class="hcard"><div class="hn">' + esc(c.name) + '</div>' +
        '<div class="ht">' + cardText(t) + '</div>' +   /* already escaped, and carries info pips */
        '<div class="hb"><button data-play="' + id + '"' +
        (canPlay && s.playsLeft > 0 ? '' : ' disabled') + '>Play</button></div></div>';
    });
    s.played.forEach(function (id) {
      var c = s.cards[id], t = Engine.findTech(c.name) || {};
      var e = Engine.fx(c.name, 'tech');
      if (!e.activate) return;
      html += '<div class="hcard inplay"><div class="hn">' + esc(c.name) + '</div>' +
        '<div class="hmeta">' + (c.charges ? '⚡' + c.charges + ' ' : '') +
        (c.heat ? '🔥' + c.heat + ' ' : '') + (c.exhausted ? 'exhausted' : 'ready') + '</div>' +
        '<div class="ht">' + cardText(t) + '</div>' +   /* already escaped, and carries info pips */
        '<div class="hb"><button data-act="' + id + '"' +
        (myTurn && !c.exhausted && Engine.affordable(s, c, 'tech') ? '' : ' disabled') +
        '>Activate</button></div></div>';
    });
    Object.keys(s.deployables).forEach(function (id) {
      var d = s.deployables[id], e = Engine.fx(d.name, 'mod');
      if (!e.activate) return;
      html += '<div class="hcard inplay"><div class="hn">' + pieceIcon(d.name, false) + esc(d.name) + '</div>' +
        '<div class="hmeta">deployable · hull ' + d.hull + (d.exhausted ? ' · exhausted' : '') + '</div>' +
        '<div class="ht">' + esc((Engine.findMod(d.name) || {}).onactivate || '') + '</div>' +
        '<div class="hb"><button data-dact="' + id + '"' +
        (myTurn && !d.exhausted && Engine.affordable(s, d, 'dep') ? '' : ' disabled') +
        '>Activate</button></div></div>';
    });
    Object.keys(s.modules).forEach(function (id) {
      var m = s.modules[id], e = Engine.fx(m.name, 'mod');
      if (!e.activate) return;
      html += '<div class="hcard inplay"><div class="hn">' + pieceIcon(m.name, id === s.coreId) +
        esc(m.name) + '</div>' +
        '<div class="hmeta">module · hull ' + m.hull + (m.exhausted ? ' · exhausted' : '') + '</div>' +
        '<div class="ht">' + esc((Engine.findMod(m.name) || {}).onactivate || '') + '</div>' +
        '<div class="hb"><button data-mact="' + id + '"' +
        (myTurn && !m.exhausted && Engine.affordable(s, m, 'mod') ? '' : ' disabled') +
        '>Activate</button></div></div>';
    });
    handEl.innerHTML = html || '<div style="color:var(--ink-dim);font-family:var(--mono);font-size:11px">No cards.</div>';
  }
  /* the piece's own silhouette, in your colour, so a card is easy to match to the board */
  var ICON_CACHE = {};
  function pieceIcon(name, isCore) {
    var shape = GamePieces.shapeOf(name, isCore), col = SEAT_HEX[meIdx() % 4];
    var k = shape + col;
    if (!ICON_CACHE[k]) ICON_CACHE[k] = GamePieces.markup(shape, col);
    return '<span class="ci" style="--pc:' + col + '">' + ICON_CACHE[k] + '</span>';
  }

  /* ---------- "Create Module X" gets an info pip ----------
     Ported from the sheet builder: wherever a card's text says it creates a module or a
     deployable, the name is followed by a pip that opens that piece's own rules, so you do
     not have to remember what a Cannon Unit actually builds. */
  var INFO_ICON = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
    '<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>' +
    '<path d="M12 11.2v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>' +
    '<circle cx="12" cy="7.8" r="1.1" fill="currentColor"/></svg>';

  function modInfoPip(name) {
    return '<button type="button" class="mod-info" data-mod="' + esc(name) +
      '" title="' + esc(name) + ' details" aria-label="' + esc(name) + ' details">' +
      INFO_ICON + '</button>';
  }

  /* the longest preset name that follows "Create Module" / "Create Deployable" */
  function namedAfter(rest) {
    var best = null, low = rest.toLowerCase();
    (typeof MOD_PRESETS !== 'undefined' ? MOD_PRESETS : []).forEach(function (m) {
      if (low.indexOf(m.name.toLowerCase()) === 0 && (!best || m.name.length > best.length))
        best = m.name;
    });
    return best;
  }
  function withModPips(line) {
    var re = /create\s+(?:module|deployable)\s+/gi;
    var out = '', last = 0, m;
    while ((m = re.exec(line)) !== null) {
      var best = namedAfter(line.slice(re.lastIndex));
      if (!best) continue;
      var end = re.lastIndex + best.length;
      out += esc(line.slice(last, end)) + modInfoPip(best);
      last = end;
      re.lastIndex = end;
    }
    return out + esc(line.slice(last));
  }

  function cardText(t) {
    return [t.onbuild && 'On Play: ' + t.onbuild, t.passive && 'Passive: ' + t.passive,
            t.onactivate && 'On Activate: ' + t.onactivate]
      .filter(Boolean).map(withModPips).join('  ');
  }

  /* ---------- module / deployable popup ---------- */
  function openModPopup(name) {
    var m = Engine.findMod(name);
    if (!m) return;
    var isDep = m.type === 'deployable';
    var col = SEAT_HEX[meIdx() % 4];
    var icon = document.getElementById('modPopIcon');
    icon.style.setProperty('--pc', col);
    icon.innerHTML = GamePieces.markup(GamePieces.shapeOf(m.name, false), col);
    document.getElementById('modPopName').textContent = m.name;
    var meta = [isDep ? 'Deployable' : 'Module', cap(m.tt || '')];
    if (m.hull) meta.push('Hull ' + m.hull);
    if (m.speed !== undefined && m.speed !== '') meta.push('Speed ' + m.speed);
    if (m.duration) meta.push('Duration ' + m.duration);
    if (m.charges !== undefined && m.charges !== '') meta.push('Charges ' + m.charges);
    document.getElementById('modPopMeta').innerHTML =
      meta.filter(Boolean).map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('');
    var lines = [];
    if (m.req) lines.push('Requires: ' + m.req);
    if (m.onbuild) lines.push('On Play: ' + m.onbuild);
    if (m.passive) lines.push('Passive: ' + m.passive);
    if (m.onactivate) lines.push('On Activate: ' + m.onactivate);
    document.getElementById('modPopDesc').textContent = lines.join('\n') || 'No text.';
    document.getElementById('modPop').classList.remove('hidden');
  }
  function closeModPopup() { document.getElementById('modPop').classList.add('hidden'); }
  function cap(x) { return x ? x.charAt(0).toUpperCase() + x.slice(1) : ''; }

  function renderLog(G) {
    logEl.innerHTML = G.log.slice(-200).map(function (l) {
      return '<div class="t' + l.side + '">' + esc(l.msg) + '</div>';
    }).join('');
    logEl.scrollTop = logEl.scrollHeight;
  }

  function renderPrompt(G) {
    var p = G.pending;
    /* A prompt always belongs to whoever is active, so on another player's turn there is
       nothing here for you to answer — not even while they are moving. */
    if (G.active !== meIdx()) {
      promptEl.innerHTML = '<div class="p-label">' + esc(G.players[G.active].name) + "'s turn" + '</div>' +
        (isAI(G.active)
          ? '<div style="font-size:10.5px;color:var(--ink-dim);font-family:var(--mono)">' +
            esc(AICommander.describe(G.active)) + '</div>'
          : '<div style="font-size:11px;color:var(--ink-dim)">Pass the screen over.</div>');
      return;
    }
    if (!p) {
      promptEl.innerHTML =
        G.phase === 'play'
          ? '<div class="p-label">Play phase</div><div style="font-size:11px;color:var(--ink-dim)">Play a card, or End Play Phase. Whatever is left in hand is discarded.</div>'
          : '<div class="p-label">Action phase</div><div style="font-size:11px;color:var(--ink-dim)">Click your modules and cards to activate them, then end your turn.</div>';
      return; }
    var h = '<div class="p-label">' + esc(p.label || p.kind) + '</div>';
    if (p.kind === 'choice')
      h += p.options.map(function (o, i) {
        return '<button class="g-btn" style="margin:2px" data-choice="' + i + '">' + esc(o) + '</button>'; }).join('') +
        cancelBtn();
    else if (p.kind === 'move') {
      var s = G.players[G.active], sm = s.modules[selMod];
      var total = Object.keys(s.modules).reduce(function (a, i) { return a + s.modules[i].moveLeft; }, 0);
      h += '<div style="font-size:11px;color:var(--ink-dim);margin-bottom:4px">Each module moves on its own. ' +
           'Click one to select it, then click open ground to walk it there — or use the pad ' +
           'and arrow keys.</div>' +
           '<div style="font-size:11px;margin-bottom:4px">Selected: <b style="color:var(--cyan)">' +
           (sm ? esc(sm.name) + ' (' + sm.moveLeft + ' left)' : 'none') + '</b> — ' + total + ' Move unspent</div>' +
           movePad(!!sm && sm.moveLeft > 0) +
           '<button class="g-btn" data-done="1">Done moving</button>' + cancelBtn();
    }
    else if (p.kind === 'moveObject')
      h += '<div style="font-size:11px;color:var(--ink-dim);margin-bottom:4px">Click where it should go, ' +
           'or use the pad — <b style="color:var(--amber)">' + p.left + '</b> left.</div>' + movePad(p.left > 0) +
           '<button class="g-btn" data-done="1">Done</button>' + cancelBtn();
    else if (p.kind === 'space')
      h += '<div style="font-size:11px;color:var(--ink-dim)">Click a highlighted cell.</div>' +
           '<div style="margin-top:6px">' +
           '<button class="g-btn ghost" data-done="1">Skip</button>' + cancelBtn() + '</div>';
    else if (p.kind === 'target')
      h += '<div style="font-size:11px;color:var(--ink-dim)">Click an outlined enemy module.</div>' +
           '<div style="margin-top:6px">' +
           (Engine.canUndo() ? cancelBtn('Cancel — take it back')
                             : '<button class="g-btn ghost" data-done="1">Cancel</button>') +
           '</div>';
    promptEl.innerHTML = h;
  }

  /* Cancel is offered wherever an activation can still be taken back. It puts the pieces
     where they stood and hands back everything the cost took — the modules it exhausted, the
     charges it spent, the drone it ran over — not just the part you were being asked about. */
  function cancelBtn(label) {
    if (!Engine.canUndo()) return '';
    return '<button class="g-btn ghost" style="margin-left:6px" data-cancel="1">' +
           (label || 'Cancel') + '</button>';
  }

  function movePad(on) {
    var d = on ? '' : ' disabled';
    return '<div class="movepad">' +
      '<button class="sp"></button><button data-mv="0,-1"' + d + '>↑</button><button class="sp"></button>' +
      '<button data-mv="-1,0"' + d + '>←</button><button class="sp"></button><button data-mv="1,0"' + d + '>→</button>' +
      '<button class="sp"></button><button data-mv="0,1"' + d + '>↓</button><button class="sp"></button></div>';
  }

  /* ---------- input ---------- */
  /* the cell under the pointer, worked out from the grid rather than the element beneath the
     cursor, because pieces and the path layer cover the cells */
  function cellFromEvent(e) {
    var r = gridEl.getBoundingClientRect(), n = Engine.RULES.boardSize;
    var x = Math.floor((e.clientX - r.left) / CELL), y = Math.floor((e.clientY - r.top) / CELL);
    if (x < 0 || y < 0 || x >= n || y >= n) return null;
    return { x: x, y: y };
  }
  gridEl.addEventListener('mousemove', function (e) {
    lastPointer.x = e.clientX; lastPointer.y = e.clientY;
    var G = Engine.get();
    if (!mover(G)) { if (hoverCell) { hoverCell = null; clearRoute(); } return; }
    var c = cellFromEvent(e);
    if (!c) { hoverCell = null; clearRoute(); return; }
    if (hoverCell && hoverCell.x === c.x && hoverCell.y === c.y) { drawRoute(G); return; }
    hoverCell = c;
    drawRoute(G);
  });
  gridEl.addEventListener('mouseleave', function () { hoverCell = null; clearRoute(); });

  /* walk the previewed route one step at a time, stopping when the Move runs out */
  /* Walk one piece along the previewed route, stopping when its own Move runs out. The id is
     captured up front: every step repaints the board, and the repaint hands the controls to
     the next module with Move left — without pinning the walker here, an out-of-range click
     would spend this module's Move and then march the rest of the fleet down the same line. */
  var walking = false;
  function walkRoute(route) {
    var G = Engine.get(), mv = mover(G);
    if (!mv || !route || walking) return;
    var pend = G.pending, isDep = pend.kind === 'moveObject';
    var id = isDep ? pend.objId : selMod;
    walking = true;
    try {
      for (var i = 1; i < route.length; i++) {
        var now = Engine.get(), s = now.players[meIdx()];
        var piece = isDep ? s.deployables[id] : s.modules[id];
        if (!piece || !now.pending) break;                 /* gone, or the prompt closed */
        var left = isDep ? now.pending.left : piece.moveLeft;
        if (left <= 0) break;
        var dx = route[i].x - route[i-1].x, dy = route[i].y - route[i-1].y;
        var ok = isDep ? Engine.stepDeployable(id, dx, dy) : Engine.moveModule(id, dx, dy);
        if (!ok) { blockFlash(route[i].x, route[i].y); break; }
        ping(route[i].x, route[i].y);
      }
    } finally { walking = false; }
    Engine.emit();
  }

  /* whatever is standing on a square — asked of the game state rather than of the element
     under the cursor, so a click anywhere in the cell counts even when it lands on the gap
     between a silhouette and its corner */
  function objIdAt(G, x, y) {
    var c = Engine.cellAt(x, y);
    return c ? c.id : null;
  }

  gridEl.addEventListener('click', function (e) {
    var G = Engine.get(), p = G.pending;
    var cell = cellFromEvent(e);
    var id = cell ? objIdAt(G, cell.x, cell.y) : null;
    if (!id) { var el = e.target.closest('.piece'); if (el) id = el.getAttribute('data-obj'); }
    if (p) {
      if (p.kind === 'target' && id && p.targets.indexOf(id) >= 0) return Engine.resolve(id);
      /* during a move prompt, clicking one of your modules picks which one the controls drive */
      if (p.kind === 'move' && id && G.players[meIdx()].modules[id]) {
        selMod = id; hoverCell = null; Engine.emit(); return;
      }
      if (p.kind === 'space' && cell && p.filter && p.filter(cell.x, cell.y))
        return Engine.resolve(cell);
      /* clicking open ground walks the selected piece there along the previewed route */
      if (mover(G) && cell) {
        var route = routeTo(mover(G).obj, cell.x, cell.y);
        if (route && route.length > 1) walkRoute(route);
      }
      return;
    }
    /* no prompt open: clicking your own ready piece activates it */
    if (!id || G.active !== meIdx() || G.phase !== 'action') return;
    var s = G.players[meIdx()];
    if (s.modules[id]) Engine.activateModule(id);
    else if (s.deployables[id]) Engine.activateDeployable(id);
  });
  handEl.addEventListener('click', function (e) {
    var pip = e.target.closest('.mod-info');
    if (pip) { e.stopPropagation(); openModPopup(pip.getAttribute('data-mod')); return; }
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.play)  Engine.playCard(b.dataset.play);
    if (b.dataset.act)   Engine.activateCard(b.dataset.act);
    if (b.dataset.mact)  Engine.activateModule(b.dataset.mact);
    if (b.dataset.dact)  Engine.activateDeployable(b.dataset.dact);
  });
  promptEl.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.choice !== undefined) Engine.resolve(+b.dataset.choice);
    if (b.dataset.mv) { var v = b.dataset.mv.split(','); nudge(+v[0], +v[1]); return; }
    if (b.dataset.cancel) { selMod = null; hoverCell = null; clearRoute(); Engine.undo(); return; }
    if (b.dataset.done) Engine.resolve(null);
  });
  document.getElementById('modPopClose').addEventListener('click', closeModPopup);
  document.getElementById('modPop').addEventListener('click', function (e) {
    if (e.target.id === 'modPop') closeModPopup();      /* click the backdrop to dismiss */
  });
  document.getElementById('endBtn').addEventListener('click', function () { Engine.endTurn(); });
  document.getElementById('playPhaseBtn').addEventListener('click', function () { Engine.endPlayPhase(); });
  /* ---------- new-game roster ---------- */
  var rostRows = document.getElementById('rostRows');
  var rostCount = document.getElementById('rostCount');

  /* new seats default to a computer on a team of its own, which makes 3 and 4 players a
     free-for-all until someone pairs them up */
  function setCount(n) {
    while (SEATS.length < n) SEATS.push({ team: SEATS.length, ai: true });
    SEATS.length = n;
    renderRoster();
  }
  var EDIT_ICON = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
    '<path d="M4 20h4l10-10-4-4L4 16v4Z" stroke="currentColor" stroke-width="1.7" ' +
    'stroke-linejoin="round"/><path d="M14.5 5.5 18.5 9.5" stroke="currentColor" ' +
    'stroke-width="1.7" stroke-linecap="round"/></svg>';

  function renderRoster() {
    var n = SEATS.length;
    /* dropping from four seats to two can leave a team letter that no longer exists */
    SEATS.forEach(function (seat, i) { if (seat.team >= n) seat.team = i; });
    Array.prototype.forEach.call(rostCount.children, function (b) {
      b.classList.toggle('ghost', +b.getAttribute('data-count') !== n);
    });
    rostRows.innerHTML = SEATS.map(function (seat, i) {
      var teams = '';
      for (var t = 0; t < n; t++)
        teams += '<option value="' + t + '"' + (seat.team === t ? ' selected' : '') + '>Team ' +
                 TEAM_LETTER[t] + '</option>';
      var sh = sheetOf(i);
      var sub;
      if (!sh) sub = 'Stock frigate';
      else {
        sub = esc(sh.shipName || sh.shipClass || 'Custom build');
        if (!starterCount(sh)) sub += ' — no Starter Cards, deploys as a bare Core';
      }
      return '<div class="rost-row" style="--sc:' + SEAT_HEX[i % 4] + '">' +
        '<span class="rn">Player ' + (i + 1) + '<small>' + sub + '</small></span>' +
        '<select data-team="' + i + '">' + teams + '</select>' +
        '<select data-ai="' + i + '">' +
          '<option value="0"' + (seat.ai ? '' : ' selected') + '>Local player</option>' +
          '<option value="1"' + (seat.ai ? ' selected' : '') + '>Computer</option>' +
        '</select>' +
        '<button type="button" class="rost-edit" data-edit="' + i + '" title="' +
          (sh ? 'Edit this build in the sheet builder' : 'Build a sheet for this player') + '">' +
          EDIT_ICON + '</button></div>';
    }).join('');
    /* one team means nobody to fight, so there is no game to start */
    var used = {};
    SEATS.forEach(function (x) { used[x.team] = true; });
    var ok = Object.keys(used).length >= 2;
    document.getElementById('startBtn').disabled = !ok;
    document.getElementById('rostWarn').classList.toggle('hidden', ok);
  }
  function askMode() {
    renderRoster();
    document.getElementById('modePick').classList.remove('hidden');
  }
  document.getElementById('newBtn').addEventListener('click', askMode);
  rostCount.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-count]');
    if (b) setCount(+b.getAttribute('data-count'));
  });
  rostRows.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-edit]');
    if (b) editSeat(+b.getAttribute('data-edit'));
  });
  rostRows.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.team !== undefined) SEATS[+t.dataset.team].team = +t.value;
    if (t.dataset.ai !== undefined) SEATS[+t.dataset.ai].ai = t.value === '1';
    renderRoster();
  });
  document.getElementById('startBtn').addEventListener('click', function () { start(); });

  /* one nudge function for the pad and the keyboard: fleet move, or a deployable step */
  function nudge(dx, dy) {
    var G = Engine.get(), p = G.pending, s = G.players[meIdx()];
    if (p && p.kind === 'moveObject') {
      var d = s.deployables[p.objId];
      var to = d ? { x: d.x + dx, y: d.y + dy } : null;
      if (!Engine.stepDeployable(p.objId, dx, dy)) { if (to) blockFlash(to.x, to.y); }
      else if (to) ping(to.x, to.y);
      return;
    }
    if (!selMod || !s.modules[selMod] || s.modules[selMod].moveLeft <= 0) selMod = nextMovable(s);
    if (!selMod) return;
    var m = s.modules[selMod], tx = m.x + dx, ty = m.y + dy;
    if (Engine.moveModule(selMod, dx, dy)) ping(tx, ty);
    else blockFlash(tx, ty);
  }
  function nextMovable(s) {
    var ids = Object.keys(s.modules).filter(function (i) { return s.modules[i].moveLeft > 0; });
    return ids[0] || null;
  }
  var DIRS = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
               w:[0,-1], s:[0,1], a:[-1,0], d:[1,0] };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !document.getElementById('modPop').classList.contains('hidden')) {
      e.preventDefault(); closeModPopup(); return;
    }
    var G = Engine.get();
    if (!G || G.active !== meIdx()) return;
    var d = DIRS[e.key];
    if (d) { e.preventDefault(); nudge(d[0], d[1]); }
    if (e.key === 'Escape' && G.pending) { e.preventDefault(); Engine.resolve(null); }
    if (e.key === 'Enter' && G.pending && G.pending.kind === 'move') Engine.resolve(null);
  });

  /* ---------- enemy turn ----------
     All decision-making lives in client/game/ai/. This page only drives the clock. */
  /* How fast the computer plays, and how long its intended move is drawn on the board before
     it commits. The commander publishes the route, we hold the clock for the telegraph, then
     the next tick walks it. */
  var AI_TICK_MS = 380;
  var AI_TELEGRAPH_MS = 700;
  var holdUntil = 0;
  Engine.onAnnounce(function (e) {
    if (e.kind !== 'move' || !e.route || e.route.length < 2) return;
    if (e.side === meIdx()) return;              /* your own moves you are making yourself */
    telegraphed = e.route;
    /* draw it in the moving player's own colour so it is obvious whose move this is */
    pathEl.style.setProperty('--route', SEAT_HEX[e.side % 4]);
    holdUntil = Date.now() + AI_TELEGRAPH_MS;
    Engine.emit();
  });
  setInterval(function () {
    var G = Engine.get();
    if (!G || G.over) return;
    if (Date.now() < holdUntil) return;          /* still showing where they are going */
    if (telegraphed) { telegraphed = null; pathEl.style.removeProperty('--route'); clearRoute(); }
    if (isAI(G.active)) AICommander.tick(G.active);
  }, AI_TICK_MS);

  /* ---------- the log pane shows or hides ---------- */
  (function () {
    var mid = document.querySelector('.g-mid');
    var btn = document.getElementById('logToggle');
    function apply(hidden) {
      mid.classList.toggle('nolog', hidden);
      btn.textContent = hidden ? 'Show' : 'Hide';
      btn.title = hidden ? 'Show the game log' : 'Hide the game log';
      try { localStorage.setItem('frigateLogHidden', hidden ? '1' : '0'); } catch (e) {}
    }
    var start = false;
    try { start = localStorage.getItem('frigateLogHidden') === '1'; } catch (e) {}
    apply(start);
    btn.addEventListener('click', function () { apply(!mid.classList.contains('nolog')); });
  })();

  /* ---------- resizable hand ---------- */
  (function () {
    var grip = document.getElementById('handGrip'), wrap = document.getElementById('handWrap');
    var MIN = 64, drag = null;
    function maxH() { return Math.round(window.innerHeight * 0.72); }
    function setH(h) {
      h = Math.max(MIN, Math.min(maxH(), Math.round(h)));
      document.documentElement.style.setProperty('--hand-h', h + 'px');
      try { localStorage.setItem('frigateHandH', h); } catch (e) {}
    }
    try {
      var saved = parseInt(localStorage.getItem('frigateHandH'), 10);
      if (saved) setH(saved);
    } catch (e) {}
    grip.addEventListener('pointerdown', function (e) {
      drag = { y: e.clientY, h: wrap.getBoundingClientRect().height };
      grip.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    grip.addEventListener('pointermove', function (e) {
      if (!drag) return;
      setH(drag.h - (e.clientY - drag.y));   /* drag up grows the bar */
    });
    function stop() { drag = null; }
    grip.addEventListener('pointerup', stop);
    grip.addEventListener('pointercancel', stop);
    /* double-click restores the default height */
    grip.addEventListener('dblclick', function () { setH(132); });
  })();

  Engine.onChange(render);
  start();          /* build a board so the page is not blank behind the picker */
  askMode();
})();
</script>
</body>
</html>
